- id: 2
  name: 'chapter5_coverage_record.md'
  description: |-
    The chapter artifact of record: per-risk status with implementing
    detectors, the two non-active rows explained in full, what sits outside the
    map entirely, and the maintenance obligations without which the record
    decays.
  implementation_notes: |-
    Published from the closure report output rather than written by hand, so
    the record and the gate cannot disagree. The phrasing is deliberately ten of
    ten ACCOUNTED FOR rather than covered, and the two non-active rows get more
    space than the eight active ones -- because a coverage record earns trust
    through what it declines to claim. The maintenance table exists because a
    record with no jobs behind it is a snapshot that will be confidently wrong
    within two quarters and still being read.
  code: |
    <!--
    chapter5_coverage_record.md
    Section 0510 -- Chapter 5 Summary: AI Security Detection
    20260719 | Detection Engineering: AI Security Detection (Section 0510 Chapter Summary) by Raghav Dinesh
    -->
    # Chapter 5 Coverage Record

    The chapter's artifact of record. Not a summary of what was built -- the
    statement of what the program can and cannot see, with every claim traceable
    to a named detector or a written rationale.

    **Framework pin:** OWASP Top 10 for LLM Applications, 2025 edition (v2.0).
    **Generated by:** `chapter5_coverage_closure_report.py` joining
    `owasp_llm_top10_coverage_matrix.yaml` to `placement_decision_matrix.yaml` on
    per-detector risk coverage.

    ## Status

    | Risk | Status | Implementing detectors |
    |---|---|---|
    | LLM01 Prompt Injection | ACTIVE | injection pattern tier, injection classifier tier, jailbreak pattern library, semantic scorer, multi-turn correlation |
    | LLM02 Sensitive Information Disclosure | ACTIVE | output PII pattern, beacon exfiltration, encoded blob, staged exfiltration correlation |
    | LLM03 Supply Chain | ACTIVE | pipeline integrity checks, RAG ingestion monitor |
    | LLM04 Data and Model Poisoning | ACTIVE | pipeline integrity checks, RAG ingestion monitor |
    | LLM05 Improper Output Handling | ACTIVE | agent tool-call action log, beacon exfiltration |
    | LLM06 Excessive Agency | ACTIVE | agent tool-call action log |
    | LLM07 System Prompt Leakage | ACTIVE | output canary scan |
    | LLM08 Vector and Embedding Weaknesses | PARTIAL | injection pattern and classifier tiers (exploitation path only) |
    | LLM09 Misinformation | ACCEPTED_GAP | none |
    | LLM10 Unbounded Consumption | ACTIVE | extraction scoring, API abuse rules |

    **Accounted for: 10/10. Active: 8. Partial: 1. Accepted gap: 1. Open: 0.**

    Ten of ten *accounted for* -- not ten of ten covered. The distinction is the
    record's whole purpose.

    ## The two non-active rows, in full

    **LLM08 is partial by design.** The weakness lives in how the retrieval layer
    is constructed -- embedding space properties, index access control, tenant
    isolation -- and a design property emits no events. What does emit events is
    its exploitation path: hostile content arriving through retrieved documents,
    which the Section 5.4 context-source scoring covers. The remainder belongs to
    architecture review, not detection. Recorded as partial in Section 5.2 before
    any detector existed, and left partial here.

    **LLM09 is an accepted gap.** Whether a model assertion is false is not a
    property any telemetry family carries. Detection has no observable; the
    control is evaluation and grounding, owned by model quality. The available
    alternative -- keyword rules on hedging language -- would produce noise while
    covering nothing, and would convert an honest gap into a false green row.
    Owning control: evaluation pipeline and grounding architecture. Review on the
    framework recheck cadence.

    ## What is not on this map at all

    The matrix covers the LLM application surface as the pinned edition defines it.
    Three things sit outside it deliberately:

    - **Agentic and multi-agent attack surface.** OWASP maintains a separate
      top-ten for agentic applications. Chapter 5 covers agency only where it
      touches this list -- LLM06 via the tool-call gate. Inter-agent trust,
      orchestration compromise, and tool-ecosystem attacks are their own
      enumeration and their own conversion exercise.
    - **Scale and cost engineering.** The architecture states latency budgets and
      enforces them at boot; sizing infrastructure to meet them is Chapter 9.
    - **Response actions.** Findings are emitted, never acted on. Blocking,
      throttling, revocation, and applying the redaction map are Chapter 12.

    ## Maintenance obligations

    This record is true on its generation date and decays without three running
    jobs:

    | Obligation | Mechanism | Cadence |
    |---|---|---|
    | Framework pin currency | Re-verify the pinned edition; remap risk IDs to stable attack classes | Quarterly and pre-publication |
    | Pattern library decay | `jailbreak_eval_harness.py` fails the build below declared recall floors | Every CI run |
    | Coverage closure | `chapter5_coverage_closure_report.py` fails on any open row | Every CI run |

    A coverage record without these is a snapshot that will be confidently wrong
    within two quarters -- and still being read.
- id: 3
  name: 'chapter5_knowledge_assessment.md'
  description: |-
    Self-assessment mapped one-to-one to the chapter completion criteria: nine
    knowledge questions, ten skills, five mindset scenarios, each carrying the
    section that answers it.
  implementation_notes: |-
    Item counts match the chapter_completion_criteria block exactly (9/10/5),
    asserted at build time so a criteria change surfaces as a failing check.
    Questions are diagnostic rather than recall-based: several carry a plausible
    wrong answer that a skimming reader would give, because knowing which
    misconception you hold is more useful than a score. There is no pass mark,
    deliberately -- the output is a list of sections to reread.
  code: |
    <!--
    chapter5_knowledge_assessment.md
    Section 0510 -- Chapter 5 Summary: AI Security Detection
    20260719 | Detection Engineering: AI Security Detection (Section 0510 Chapter Summary) by Raghav Dinesh
    -->
    # Chapter 5 Knowledge Assessment

    Mapped to the chapter completion criteria in `chapter_05_index.yaml`. Questions
    are diagnostic rather than recall-based: each one has a wrong answer that a
    reader who skimmed the chapter would plausibly give, and the answer key names
    it, because knowing which misconception you hold is more useful than a score.

    ## Knowledge (9)

    **K1.** A team has full endpoint, network, cloud, and identity telemetry, and
    green ATT&CK coverage. Why does it detect zero prompt injections?
    *Answer:* The gap is at the telemetry layer, not the rule layer. The prompt
    channel emits no events in any of those sources, so no rule over them can fire.
    *Plausible wrong answer:* that the rules are missing -- which leads to writing
    rules that test green and never fire. (5.1)

    **K2.** What makes the OWASP LLM Top 10 a *detection* framework rather than an
    awareness document?
    *Answer:* Restating each risk as a falsifiable detection hypothesis with named
    telemetry, a detectability class, an owner, and a tracked status. (5.2)

    **K3.** Name the six detectability classes and give a risk that lands in the
    one where coverage means an accepted-gap record.
    *Answer:* rule, hybrid, behavioral, statistical, architectural,
    not-detection-shaped. LLM09 is not-detection-shaped. (5.2)

    **K4.** ATLAS demands a discipline the OWASP conversion does not. Which, and
    why?
    *Answer:* The observability audit. Large phases of the adversarial ML lifecycle
    run on adversary infrastructure and emit no defender-observable events, so
    techniques must be rated before coverage is claimed. (5.3)

    **K5.** Why is prompt injection detection tiered rather than solved by either
    regex or a classifier alone?
    *Answer:* Regex is cheap, explainable, and enumerable-then-paraphrased around;
    classifiers generalise but are opaque, slower, and untunable without retraining.
    The hybrid fires on the union. (5.4)

    **K6.** Why can no single-message detector catch incremental escalation?
    *Answer:* No individual turn violates policy. The attack is the trajectory, so
    it is a stateful correlation problem keyed on conversation, not a scoring
    problem. (5.5)

    **K7.** A dataset arrives with a valid hash, a valid signature, and a clean
    build attestation. What has verification proven, and what has it not?
    *Answer:* Proven: the provenance chain is intact. Not proven: intent. A
    source-poisoned artifact signed by a compromised-but-legitimate publisher
    verifies cleanly. (5.6)

    **K8.** Why does no global request-rate threshold separate an extraction
    campaign from a sanctioned batch integrator?
    *Answer:* The integrator sends far more traffic. Any cap catching the campaign
    flags the integrator; any cap clearing the integrator misses the campaign. The
    correct axis is per-identity deviation plus query-pattern signals. (5.7)

    **K9.** Why must redaction and detection stay separate?
    *Answer:* A filter that scrubs content without emitting a finding converts an
    incident into a non-event, making frequency, trend, and attribution
    unanswerable. Detection emits and returns a map; response applies it. (5.8)

    ## Skills (10)

    **S1.** Run the telemetry gap assessment against a pipeline and interpret an
    ABSENT family. (5.1)
    **S2.** Add a row to the coverage matrix for a new risk, with hypothesis,
    telemetry, detectability class, and owner. (5.2)
    **S3.** Rate an ATLAS technique's observability and justify a not-observable
    rating including its downstream pointer. (5.3)
    **S4.** Extend the injection pattern pack with a new family and prove on the
    labelled corpus that per-channel recall improved without precision loss. (5.4)
    **S5.** Add a jailbreak family to the library using structural signals only, and
    set a defensible recall floor. (5.5)
    **S6.** Calibrate an ingestion divergence threshold from a corpus's own internal
    spread. (5.6)
    **S7.** Build a per-identity consumption baseline with a deviation floor, and
    explain what the floor prevents. (5.7)
    **S8.** Emit an output finding carrying offsets and a salted hash, and state why
    each field exists. (5.8)
    **S9.** Place a new detector using the four placement questions in order, and
    demote something if the inline budget is exhausted. (5.9)
    **S10.** Regenerate the coverage record and explain why the join is per-risk
    rather than per-section. (5.9)

    ## Security mindset (5)

    **M1.** You inherit a dashboard showing full AI security coverage. What is the
    first thing you verify?
    *Answer:* That the telemetry underneath each claimed row actually exists.
    Coverage claims over absent telemetry are the chapter's founding failure. (5.1)

    **M2.** A stakeholder asks you to turn the one ACCEPTED_GAP row green before a
    board review. What do you say?
    *Answer:* That an honest accepted gap is stronger posture than a rule covering
    nothing, and that the alternative manufactures a false claim the organisation
    will act on. (5.2, 5.6)

    **M3.** Your pattern library has not changed in six months and reports no
    misses. Reassuring or alarming?
    *Answer:* Alarming. Absent decay measurement, no misses means nothing is
    measuring. The detection is the refresh loop, not the file. (5.5)

    **M4.** A composite detector separates your test cases cleanly. What do you do
    before shipping?
    *Answer:* Ablate it, to learn which signals actually carry the detection. An
    author wrong about attribution cannot tune the detector. (5.7)

    **M5.** Which inline detectors deserve fail-closed?
    *Answer:* Only those whose harm is unrecoverable after delivery or execution
    *and* whose check is cheap and high-precision. Severity is the wrong axis;
    recoverability is the right one. (5.9)

    ## Scoring

    There is no pass mark. Any item you cannot answer names a section to reread --
    and any *plausible wrong answer* you would have given names a misconception
    worth correcting before it reaches production.
- id: 4
  name: 'chapter5_to_chapter6_bridge.md'
  description: |-
    The transition: a step-by-step mapping of the Chapter 5 method onto Chapter
    6 surfaces, the three properties that do not carry, and the through-line
    both chapters share.
  implementation_notes: |-
    Written as method transfer rather than topic preview, since the risk at this
    boundary is over-applying Chapter 5 specifics. The three changes are stated
    as explicitly as the transfers: structured payloads restore deterministic
    detection, the observation point returns to operated infrastructure, and
    latency stops being the binding constraint so the placement calculus shifts
    to ingest cost and detection lag.
  code: |
    <!--
    chapter5_to_chapter6_bridge.md
    Section 0510 -- Chapter 5 Summary: AI Security Detection
    20260719 | Detection Engineering: AI Security Detection (Section 0510 Chapter Summary) by Raghav Dinesh
    -->
    # Chapter 5 to Chapter 6: What Transfers

    Chapter 5 looked like a chapter about AI. It was a chapter about applying
    detection engineering to a surface that had none. Chapter 6 does the same for
    cloud, API, and serverless surfaces, and the method transfers intact -- which
    is the point Part II has been making since Chapter 4.

    ## The transferable method

    | Step | Chapter 5 instance | Chapter 6 instance |
    |---|---|---|
    | Establish the telemetry gap first | Prompt channel emits nothing to traditional sources (5.1) | Control-plane and ephemeral-workload gaps in cloud and serverless |
    | Convert a framework into a coverage map | OWASP LLM Top 10 and MITRE ATLAS (5.2, 5.3) | Cloud-relevant ATT&CK matrices and provider control frameworks |
    | Layer detectors by what each method wins at | Pattern tier under classifier tier, hybrid union (5.4) | Deterministic control-plane rules under behavioural identity analytics |
    | Baseline per entity where thresholds fail | Per-identity consumption envelopes (5.7) | Per-principal and per-role activity baselines |
    | Instrument decay | Recall floors per family with a CI gate (5.5) | The same discipline for any pattern-bearing cloud detection |
    | Place by budget and recoverability | 94ms inline cap, fail policy per detector (5.9) | Event-driven placement where the constraint is cost and lag, not request latency |
    | Close coverage from shipped artifacts | Per-risk closure report, exit non-zero on open rows (5.9) | Identical gate over the cloud coverage map |

    ## What changes

    Three properties of the LLM surface do not carry, and expecting them to is the
    main way a reader over-applies Chapter 5.

    **The payload stops being semantic.** Prompt injection required semantic
    judgement with an irreducible error rate, because the data and instruction
    boundary had collapsed. Cloud and API attacks are structured again: an API call
    is a typed, parameterised, attributable event. Deterministic detection recovers
    much of the ground it lost in Chapter 5, and classifiers become the exception
    rather than a required tier.

    **The observation point moves back to infrastructure you operate.** Chapter 5
    put the sensor in a gateway that had to be built. Cloud surfaces already emit
    control-plane logs; the Chapter 6 problem is less about creating telemetry than
    about the volume, latency, and cost of what already exists -- and about the
    ephemeral workloads that vanish before anything queries them.

    **Latency stops being the binding constraint.** The 120ms inline budget existed
    because detection sat in a user request path. Cloud detection is predominantly
    event-driven and asynchronous, so the placement calculus shifts from
    milliseconds to ingest cost and detection lag. The four placement questions
    still apply; only the second one changes units.

    ## The through-line

    Both chapters make the same argument in different vocabulary: coverage is a
    property you measure against telemetry you verified exists, frameworks are
    denominators rather than reading material, detectors are code with tests and a
    decay curve, and the honest gap beats the green row. Chapter 5 made that case
    where the tooling was absent. Chapter 6 makes it where the tooling is abundant
    and the failure mode inverts -- from having no telemetry to drowning in it.
common_mistakes:
- id: 1
  description: |-
    Reporting the chapter result as ten of ten covered rather than ten of ten
    accounted for.
  why_it_happens: |-
    Covered is the word stakeholders ask for, the difference sounds pedantic in
    a status meeting, and eight active rows out of ten genuinely is good work.
  consequence: |-
    The organisation acts on a claim that two rows do not support. LLM09 has no
    detector at all, and the first incident involving model-asserted falsehoods
    arrives against a documented expectation that detection would have caught
    it.
  correct_approach: |-
    Report accounted-for, and treat the partial and accepted-gap rows as the
    credibility of the record rather than blemishes on it. A program that can
    show an honest gap has demonstrated it understands its own detections.
- id: 2
  description: |-
    Treating the chapter as a list of AI security techniques rather than as a
    method applied to a new surface.
  why_it_happens: |-
    The techniques are the memorable part, they map neatly to a framework, and
    a technique list is easier to summarise to a team than a method.
  consequence: |-
    The reader carries prompt injection patterns and canary tricks into Chapter
    6, where none apply, and misses the transferable steps -- telemetry first,
    framework as coverage map, layered detectors, per-entity baselines,
    instrumented decay, budgeted placement, computed closure.
  correct_approach: |-
    Carry the method. Every mechanism in this chapter came from Chapters 1
    through 4; what changed was the telemetry family and the collapsed
    data-instruction boundary. The bridge deliverable maps the transfer step by
    step.
- id: 3
  description: |-
    Publishing the coverage record without the maintenance jobs behind it.
  why_it_happens: |-
    The record is accurate on the day it is generated, it looks like a
    deliverable rather than a process, and the jobs that keep it true live in
    CI where nobody reviewing the record can see them.
  consequence: |-
    Framework editions move, pattern families decay, detectors get retired in
    refactors, and the record keeps asserting active coverage that no longer
    exists -- confidently wrong within two quarters, and still being read.
  correct_approach: |-
    Ship the record with its three obligations wired: framework pin re-verified
    on a cadence, the decay gate failing the build below recall floors, and the
    closure gate failing on any open row. The record is an output of running
    jobs, not a document.
- id: 4
  description: |-
    Treating the deferrals as gaps in the chapter rather than as scoped
    handoffs.
  why_it_happens: |-
    A reader reaching the end wants completeness, and agentic detection, scale
    engineering, and response all feel like they should have been finished here.
  consequence: |-
    Either the team builds them ad hoc without the chapters that treat them
    properly -- response automation wired into a detector, scale decisions made
    from a diagram -- or the chapter reads as incomplete and its actual result
    gets discounted.
  correct_approach: |-
    Read the deferral table as a roadmap with owners. Each exclusion has a
    stated reason and a chapter, and two of them (response coupling, scale
    assumptions) are things this chapter deliberately did not do because doing
    them early makes both harder to change.
- id: 5
  description: |-
    Concluding that AI security detection requires a new product category.
  why_it_happens: |-
    It is the prevailing market message, the surface is genuinely novel, and
    buying a product is faster than building telemetry and a coverage map.
  consequence: |-
    A standalone AI security console recreates the Section 4.1 lock-in problem
    on the newest surface, makes cross-domain correlation structurally
    inexpressible, and leaves the program unable to answer whether an injection
    finding and anomalous tool calls belong to the same identity.
  correct_approach: |-
    Treat products as telemetry sources feeding the platform, never as
    destinations. What the surface actually requires is new telemetry, a
    coverage map, and the detection lifecycle the program should already have --
    which is what nine sections of evidence demonstrate.

section_summary:
  compact: |-
    Chapter 5 took a surface that a mature detection program could not see at
    all and left it measured. The order of work was telemetry first, frameworks
    as coverage maps second, layered detectors third, budgeted placement fourth
    -- and reversing any two of those steps produces rules that test green and
    never fire. Five detection families emerged, each teaching a different
    lesson about method selection: layered union scoring for injection,
    contrastive calibration and instrumented decay for jailbreaks, deterministic
    build-time verification for poisoning, per-identity baselines instead of
    global thresholds for extraction, and completions treated as egress with
    detection kept separate from redaction. Assembled into a gateway
    architecture with a 120ms inline cap consuming 94ms and a fail policy set by
    recoverability rather than severity, the result is a coverage record of ten
    rows accounted for: eight active with named detectors, one partial by
    design, one honest accepted gap, none open, generated by a gate rather than
    written by an author. Agentic detection, scale engineering, and response
    actions are deferred with owners. And the chapter's claim is now
    demonstrated rather than asserted -- every mechanism came from Chapters 1
    through 4, so AI security detection is detection engineering with new
    telemetry, not a new discipline.
  key_takeaways:
  - 'The chapter result is a coverage position, not a technique list: ten of ten
    accounted for, eight active, one partial by design, one accepted gap, zero
    open -- computed by a CI gate rather than asserted'
  - 'Report accounted-for rather than covered; the two non-active rows are what
    make the record credible, not what blemish it'
  - 'The order of work is the transferable part -- telemetry, then coverage map,
    then layered detectors, then budgeted placement -- and it survives contact
    with any new surface'
  - 'Every artifact needs a maintenance job behind it: framework pin recheck,
    decay gate, closure gate, or the record is confidently wrong within two
    quarters'
  - 'The deferrals are a roadmap with owners: agentic detection as a separate
    enumeration, scale to Chapter 9, response to Chapter 12, classifier
    construction to Chapter 7'
  - 'AI security detection is detection engineering applied to new telemetry --
    the coverage discipline, platform, lifecycle, and open standards all came
    from Chapters 1 through 4, and a team that cannot run a detection lifecycle
    will not be rescued by a product'

preview_chapter_06:
  title: 'Chapter 6: Detection for Modern Attack Surfaces -- Cloud, API, Serverless'
  preview: |-
    Chapter 6 applies the same method where the tooling is abundant rather than
    absent, and the failure mode inverts from having no telemetry to drowning in
    it. Cloud control planes, API gateways, and serverless platforms already
    emit enormous volumes of structured, attributable events -- so the work
    shifts from creating telemetry to selecting, costing, and correlating what
    exists, and to the ephemeral workloads that disappear before anything
    queries them. The transferable steps carry: establish the gap, convert a
    framework into a coverage map, layer detectors by what each method wins at,
    baseline per principal where thresholds fail, instrument decay, place by
    constraint, and close coverage from shipped artifacts. Three things change.
    Payloads are structured again, so deterministic detection recovers the
    ground it ceded to semantic judgement in Chapter 5. The observation point
    returns to infrastructure the defender operates. And latency stops binding,
    so placement is decided by ingest cost and detection lag instead of
    milliseconds in a request path.

