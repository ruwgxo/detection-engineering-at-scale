  description: |-
    The consolidated index of all thirty-six chapter artifacts by section, with
    file references, artifact kinds, and totals -- the manifest a reader uses to
    locate anything and a CI job walks to confirm the chapter is intact.
  implementation_notes: |-
    Generated FROM the section files rather than transcribed, and validated by
    asserting the listed set matches deliverable filenames extracted from the
    nine section YAMLs exactly. That check is the deliverable verification rule
    written into the artifact: an added, renamed, or dropped deliverable fails
    the build rather than silently desynchronising the index. Counts by kind
    (12 executable, 13 specification, 4 rule packs, 6 reference, 1 corpus) are
    computed, not asserted.
