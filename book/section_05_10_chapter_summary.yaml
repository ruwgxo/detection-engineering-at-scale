document_info:
  title: 'Chapter 5 Summary: AI Security Detection'
  subtitle: 'Synthesis, coverage record, deliberate deferrals, and the bridge to Chapter 6'
  chapter: 5
  section: 10
  author: 'Raghav Dinesh'
  github: 'https://github.com/ruwgxo/detection-engineering-at-scale'
  license: 'MIT'
  version: '1.0'
  estimated_pages: 3
  estimated_reading_time: '25-30 minutes'
  created: '2026-07-19'

section_overview:
  one_line_summary: |-
    Chapter 5 turned an unmonitored attack surface into a measured one, and the
    chapter closes on its artifact of record rather than a recap: ten of ten
    coverage rows accounted for -- eight active with named detectors, one
    partial by design, one honest accepted gap -- built by applying the
    lifecycle, code discipline, and open standards the book already had to a
    telemetry family nobody was collecting.
  why_this_section_exists: |-
    A chapter summary that lists what each section said is of no use to a reader
    who just read them. This one exists to do three things a section-by-section
    recap cannot.

    It states the chapter's result as a single artifact. Nine sections produced
    thirty-six deliverables, and the question a security leader actually asks is
    not which techniques were covered but what the program can now see and what
    it still cannot. The coverage record answers that in one page, with every
    claim traceable to a named detector or a written rationale.

    It names the deferrals explicitly. Agentic detection, scale engineering, and
    response actions were all pushed out of scope during the chapter, each for a
    stated reason. Collected in one place, they become a roadmap rather than
    scattered caveats a reader has to remember.

    And it makes the chapter's actual argument visible now that the evidence
    exists. AI security detection is not a new discipline requiring new
    tooling, new consoles, and new vendors -- it is detection engineering
    applied to new telemetry. Every mechanism the chapter used came from
    Chapters 1 through 4. That claim would have been an assertion in Section
    5.1; after nine sections of applying it, it is a conclusion.
  position_in_chapter: |-
    Final section of Chapter 5 and the last of Part II's second chapter. It
    consolidates 5.1 through 5.9, publishes the coverage record, collects the
    deferrals, assesses against the chapter completion criteria, and hands off
    to Chapter 6, where the same method meets cloud, API, and serverless
    surfaces. Nothing new is built here except the consolidation artifacts
    themselves.

