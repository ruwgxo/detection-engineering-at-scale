prose_content:
- part: 1
  title: 'What the Chapter Established'
  body: |-
    Chapter 5 opened with a detection program that had endpoint, network, cloud,
    and identity telemetry, healthy ATT&CK coverage, and a one hundred percent
    false-negative rate against LLM attacks. The diagnosis was that the gap was
    structural and lived at the telemetry layer: a prompt injection is an
    authenticated request to an approved endpoint carrying a well-formed body,
    and no rule over the existing sources can distinguish it from ordinary use
    because the events that would carry the signal are never generated.

    That diagnosis set the chapter's order of work, and it is the order worth
    carrying forward. Telemetry first -- five mandatory event families, captured
    at a gateway, with privacy controls designed into the schema before the
    first event was written. Frameworks second, converted from awareness
    documents into coverage maps with detectability classes and tracked status.
    Detectors third, layered and measured. Placement fourth, budgeted and
    enforced. A program that reverses any two of those steps builds rules that
    test green and never fire.
- part: 2
  title: 'The Framework Layer'
  body: |-
    Sections 5.2 and 5.3 converted two frameworks into one coverage map. The
    OWASP LLM Top 10 supplied the risk enumeration, restated as detection
    hypotheses with named telemetry and detectability classes -- rule, hybrid,
    behavioral, statistical, architectural, and not-detection-shaped. MITRE
    ATLAS supplied the adversary-behaviour view, converted by the same machinery
    plus one discipline the risk list did not require: the observability audit,
    because large phases of the adversarial ML lifecycle run on infrastructure
    the defender does not operate and emit nothing at all.

    Both conversions shared a version discipline that matters more than either
    framework. Detections bind to stable attack classes; citations pin the
    framework edition. That two-sided pin is what makes a framework revision a
    mechanical remap rather than an archaeology project, and it is enforced in
    code -- the ATLAS backlog generator refuses to ship a backlog containing a
    technique ID cited from memory.
- part: 3
  title: 'The Five Detection Families'
  body: |-
    Sections 5.4 through 5.8 built five families, and each one taught a
    different lesson about method selection.

    Injection detection is layered: a cheap explainable pattern tier under a
    classifier tier that generalises to paraphrase, combined so the stack fires
    on the union -- proven in code at 0.875 recall against 0.625 for either
    layer alone. Jailbreak detection added what an active adversarial community
    demands: contrastive semantic scoring calibrated against a benign
    background, conversation state for escalation that no single-message
    detector can see, and instrumented decay with per-family recall floors.
    Poisoning detection left the traffic path entirely for the build pipeline,
    where integrity verification is deterministic and free of false positives,
    and statistical ingestion checks calibrate their thresholds from the
    corpus's own spread. Extraction detection abandoned thresholds altogether,
    because no global rate cap separates a campaign from a larger sanctioned
    integrator -- only per-identity baselines plus query-pattern signals do.
    Output monitoring treated completions as egress, with findings that carry
    offsets and hashes rather than values, and detection kept strictly separate
    from redaction.
- part: 4
  title: 'The Gateway Architecture'
  body: |-
    Section 5.9 assembled the five families into one deployable architecture
    with four integration points that differ in capability rather than merely in
    cost: pre-request can prevent an injection, the tool-call gate can stop an
    irreversible action, post-response can redact and stop rendering-triggered
    harm, and off-path can only detect.

    Two constraints did the architectural work. A 120ms inline budget, enforced
    at boot, currently consuming 94ms across seven detectors -- so adding
    anything inline forces an explicit demotion rather than a silent latency
    regression. And a fail policy decided per detector in advance on
    recoverability rather than severity: most fail open because another tier
    still sees the request, while beacon exfiltration and the tool-call gate
    fail closed because their harm completes on delivery or execution.
    Everything normalises through the Chapter 4 OCSF layer into the Chapter 2
    platform, because a standalone AI security console would recreate the
    Section 4.1 lock-in problem on the newest surface in the stack.
- part: 5
  title: 'The Coverage Record as the Artifact of Record'
  body: |-
    The chapter's output is not thirty-six files. It is a coverage position:
    ten of ten rows accounted for, eight active with named implementing
    detectors, one partial by design, one accepted gap, none open -- computed by
    joining the Section 5.2 matrix against the Section 5.9 placement matrix on
    per-detector risk coverage, and failing CI if any row lacks both a detector
    and a rationale.

    Two rows carry the record's credibility. LLM08 stays partial because the
    weakness is architectural while only its exploitation path emits telemetry.
    LLM09 stays an accepted gap because factuality is not a property any
    telemetry family carries, and the available alternative -- keyword rules on
    hedging language -- would produce noise while covering nothing. Both were
    recorded as such in Section 5.2 before any detector existed, and neither was
    quietly upgraded once the chapter had results to show. The correct phrasing
    is ten of ten accounted for, not ten of ten covered, and defending that
    distinction to a stakeholder who wants green is part of the job.
- part: 6
  title: 'Cross-Cutting Threads'
  body: |-
    Four disciplines recurred in every section, and they are what a reader
    should carry to the next surface rather than the specific detectors.

    Measurement before shipping: every detector in the chapter was evaluated
    against a labelled corpus or an executable assertion, and several sections
    caught their own authors being wrong -- the extraction detector's ablation
    corrected a claim about which signals carried the detection, and the closure
    report caught itself manufacturing coverage through a section-level join.
    Honest limits stated in the artifact: the integrity checker prints that it
    proves provenance rather than intent, and the ingestion monitor prints that
    it detects campaigns rather than craftsmanship. Privacy designed into
    schemas: prompt and completion telemetry under restricted-content handling,
    consumption telemetry deliberately metadata-only so its retention could be
    long enough to catch slow campaigns, and output findings carrying hashes
    rather than values. And lifecycle as a first-class deliverable: recall
    floors, decay gates, and closure gates, because a detection artifact without
    a maintenance job is a snapshot that will be confidently wrong within two
    quarters.
- part: 7
  title: 'What Remains Open'
  body: |-
    Three exclusions were made deliberately and are collected here as a roadmap
    rather than left as scattered caveats.

    Agentic detection is the largest. Chapter 5 covered agency only where the
    pinned framework does -- excessive agency via the tool-call gate. Multi-agent
    orchestration, inter-agent trust, and tool-ecosystem attacks form their own
    enumeration, which OWASP maintains as a separate agentic top-ten, and they
    warrant the same conversion exercise Sections 5.2 and 5.3 performed. The
    machinery transfers unchanged, which was the point of building it
    framework-agnostically.

    Scale engineering is deferred to Part III. The architecture states latency
    budgets and enforces them at boot; sizing infrastructure to meet them under
    production volume -- throughput, caching, horizontal scaling, cost
    engineering -- is Chapter 9. And response actions belong to Chapter 12:
    every detector in this chapter emits findings and none acts on them, which
    is why the Section 5.7 abuse alert stopped at a handoff contract and why the
    Section 5.8 pipeline returns a redaction map rather than a redacted string.
- part: 8
  title: 'The Argument, Now Demonstrated'
  body: |-
    The chapter's claim was that AI security detection is detection engineering
    with new telemetry, not a new discipline. In Section 5.1 that was an
    assertion. After nine sections it is a conclusion supported by where every
    mechanism came from.

    The coverage map discipline came from Chapter 1's treatment of ATT&CK. The
    platform, the correlation engine, and the stateful-versus-stateless
    distinction that made multi-turn escalation detection possible came from
    Chapter 2. The rule schema, unit tests, CI gates, and versioning that hold
    the pattern libraries and coverage matrix together came from Chapter 3.
    Sigma and OCSF -- the reason these detections are portable and the reason a
    standalone AI console was never on the table -- came from Chapter 4. What
    Chapter 5 supplied was a telemetry family nobody was collecting and a set of
    detectors tuned to a surface where the data-instruction boundary has
    collapsed.

    That is worth stating plainly because the market says otherwise. The
    prevailing message is that AI security requires a new category of product,
    and the honest engineering answer is that it requires new telemetry, a
    coverage map, and the discipline the program should already have. A team
    that can run a detection lifecycle can secure an LLM application. A team
    that cannot will not be rescued by a product.
- part: 9
  title: 'Bridge to Chapter 6'
  body: |-
    Chapter 6 applies the same method to cloud, API, and serverless surfaces,
    and the transferable steps are the ones this chapter drilled: establish the
    telemetry gap before writing rules, convert a framework into a coverage map,
    layer detectors by what each method wins at, baseline per entity where
    thresholds fail, instrument decay, place by budget and recoverability, and
    close coverage from shipped artifacts.

    Three things change, and expecting them not to is how a reader over-applies
    this chapter. The payload becomes structured again -- an API call is typed,
    parameterised, and attributable, so deterministic detection recovers ground
    it lost to semantic judgement here, and classifiers become an exception
    rather than a required tier. The observation point returns to infrastructure
    the defender already operates, so the problem shifts from creating telemetry
    to managing the volume and cost of telemetry that already exists, plus
    ephemeral workloads that vanish before anything queries them. And latency
    stops being the binding constraint: cloud detection is predominantly
    event-driven, so the placement calculus moves from milliseconds to ingest
    cost and detection lag. The four placement questions still apply; only the
    units of the second one change.

