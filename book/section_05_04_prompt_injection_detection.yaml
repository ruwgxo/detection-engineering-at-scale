prose_content:
  part_1:
    title: 'Two Injection Problems, Not One'
    body: |-
      Prompt injection is routinely discussed as a single phenomenon, but it
      splits into two detection problems that share a name and little else.
      Direct injection is the case everyone pictures: a user types hostile
      instructions into the prompt, trying to override the system prompt or
      the application's intent. The telemetry is the user turn, the adversary
      is the user, and identity attribution is straightforward. Indirect
      injection is the more dangerous case and the harder detection problem:
      the hostile instruction arrives inside content the application itself
      retrieves and trusts -- a document in the RAG corpus, a fetched web
      page, a tool's returned output -- and the model, unable to distinguish
      trusted data from trusted instructions, may act on it. The adversary is
      not the user; the user may be the victim.

      The distinction is not academic taxonomy; it drives the whole detector.
      Direct injection can be scored on the user turn alone. Indirect
      injection cannot be detected there at all -- by the time the poisoned
      document reaches the model, the user turn may be entirely innocent -- so
      detection has to score every piece of content assembled into the context
      window, tagged by its source, which is precisely why Section 5.1 made
      full-context capture with source tags non-negotiable. The two problems
      also carry different severity: an instruction the user typed is a
      first-party act, while an instruction arriving in retrieved content is a
      third-party compromise of the application's trust boundary, and the
      detector's policy layer weights them accordingly. Throughout this
      section, every layer is built to handle both channels, and the places
      where indirect injection changes the design are called out explicitly.
      Keeping the two problems distinct is the first discipline; conflating
      them is the first way injection detectors are built wrong.
  part_2:
    title: 'The Pattern Layer: Fast, Explainable, and Not Enough'
    body: |-
      The first layer is regex over known phrasings, and it earns its place
      for three reasons: it is fast enough to run inline on every request, it
      is completely explainable -- a hit points at the exact matched string --
      and it catches the high-volume, low-effort injection attempts that make
      up the bulk of real traffic. The instruction-override family ('ignore
      all previous instructions', 'disregard the above'), the delimiter-escape
      family (fake closing tags, injected 'system:' prefixes), and the
      role-manipulation family ('you are now', persona priming) are all
      well-known, well-documented, and worth catching cheaply before spending
      a classifier call on them.

      The book's discipline is to express this layer as Sigma over OCSF GenAI
      events, not as bespoke code, for the same reasons Chapter 4 argued:
      platform independence, a shared rule format, and version control. The
      deliverable pack encodes three rules, one per technique family, each
      operating on the prompt_event category, each tagged
      owasp_llm.2025.llm01 per the Section 5.2 convention so coverage queries
      remain platform queries. The delimiter-escape rule additionally scopes
      itself to non-user channels and carries the LLM08 tag, because a fake
      system delimiter in a retrieved document is the signature of indirect
      injection through the vector layer.

      But the pattern layer's virtues are exactly its limits. Every pattern is
      public, so an adversary enumerates the library in an afternoon and
      paraphrases around it: 'kindly set aside the guidance you were given
      earlier' matches none of the override regexes and means exactly 'ignore
      previous instructions'. Worse, obfuscation defeats regex trivially --
      zero-width spaces inside the trigger words, homoglyphs, creative
      spacing. And the same phrasings appear in entirely benign contexts: a
      user asking 'how do injection attacks like ignore previous instructions
      work' is not attacking anything, and a naive pattern rule fires on them.
      The corpus deliberately includes these edge cases. The pattern layer is
      triage -- it handles the easy majority cheaply and explainably -- but a
      detector that stops here ships the signature set the security preview
      warns adversaries will enumerate. Something has to catch the paraphrase.
  part_3:
    title: 'The Classifier Layer: A Contract, Not a Model'
    body: |-
      The paraphrase problem is what learned models are for: a classifier
      trained on injection attempts generalises to phrasings no one wrote a
      pattern for, scoring semantic intent rather than surface strings. But
      dropping a model into a detection platform naively recreates the SIEM
      lock-in problem on a new axis -- the pipeline becomes welded to one
      model's quirks, one vendor's endpoint, one framework's tensors. The
      book's answer is the same as everywhere else: define the layer by its
      contract, not its implementation.

      The classifier contract specifies what goes in (the content of one
      context entry and its channel, optionally a conversation id for
      multi-turn features), what comes out (a calibrated score in zero-to-one,
      a derived label, and -- non-negotiably -- rationale spans naming the
      substrings the model weighted), the thresholds that turn a score into a
      decision, and the service level the pipeline can depend on. Any
      classifier meeting this contract is swappable: a fine-tuned transformer,
      a hosted moderation endpoint, a lightweight logistic model over
      embeddings. Chapter 7 covers building one properly -- training data
      design, feature strategy, drift management -- and this section
      deliberately does not, because the hybrid pipeline depends only on the
      contract. That boundary is the anti-drift discipline in action: the
      classifier's construction is Chapter 7's job, and duplicating it here
      would be the bleed the chapter structure exists to prevent.

      Two contract terms carry disproportionate weight. The service level
      specifies fail-open-to-pattern-layer on timeout: a slow classifier must
      never drop or block a request, because a detection layer that becomes an
      availability risk gets removed, and then coverage is zero. And rationale
      spans are mandatory precisely because of the security preview's second
      warning -- a classifier-only detector the analyst cannot interrogate is
      operationally useless at the moment it matters. A verdict of 'injection,
      score 0.87' with no indication of why cannot be triaged; the same
      verdict with the weighted spans highlighted can. The contract makes
      explainability a shipping requirement, not a nice-to-have.
  part_4:
    title: 'The Hybrid Decision Layer: Combining Verdicts Under Policy'
    body: |-
      With two layers that each catch what the other misses, the detector's
      core becomes the logic that combines them. The hybrid decision layer is
      deliberately thin and deliberately explicit: it takes the pattern
      verdict (deterministic, explainable) and the classifier verdict
      (adaptable, scored) for one context entry and produces a single verdict
      plus an action. The combination rule is a union: an entry is flagged if
      the pattern layer hits OR the classifier clears its threshold, because
      the two layers are strong on different inputs and the goal is to catch
      the union of their true positives. The deliverable proves this property
      holds -- run against the labelled corpus, the hybrid's recall is at
      least the best single layer's and, on the corpus, materially higher than
      either, because the pattern layer catches the stock phrasings the
      classifier stub scores low and the classifier catches the obfuscated and
      paraphrased attempts the patterns miss.

      What makes the layer reusable rather than a one-off is that policy is
      configuration. The same code path serves inline blocking and
      monitor-only placement: a single policy flag decides whether an
      injection verdict produces 'block' or merely 'alert'. This is the
      inline-versus-monitor decision, and framing it as config rather than
      code is what lets Section 5.9 make the placement call per deployment
      without touching the detector. Provenance enters here too: the policy
      escalates injections arriving in non-user channels, because an
      instruction in a retrieved document is a trust-boundary compromise that
      warrants a louder signal than a user's first-party attempt. The layer
      also carries the basis of each verdict -- pattern or classifier -- which
      feeds both the analyst's triage and the review band: high-confidence
      pattern hits can auto-action while mid-band classifier-only scores route
      to human review. The decision layer is small, but it is where the
      section's two methods become one detector, and where the false-positive
      economics of the next part are actually enforced.
  part_5:
    title: 'False-Positive Economics and the Placement Decision'
    body: |-
      Every detection carries a false-positive cost, but inline injection
      blocking carries the sharpest version of it: a false positive is not a
      wasted analyst minute, it is a legitimate user request blocked in real
      time. That asymmetry is why the inline-versus-monitor decision is the
      most consequential policy choice in the stack, and why it must be made
      with measured numbers rather than intuition. A detector destined for
      inline blocking needs a precision bar high enough that the blocked-
      legitimate-request rate is tolerable to the business; a monitor-only
      detector feeding an alert queue can accept lower precision in exchange
      for higher recall, because the cost of a false positive is triage time,
      not a broken user experience.

      This reframes the two layers' roles. The pattern layer, tuned tight to
      well-known phrasings, tends to run high-precision and is a candidate for
      inline action on its high-confidence hits. The classifier layer, scoring
      a spectrum, is where the review band lives: scores above the
      high-confidence threshold can act, scores in the middle band route to
      human review rather than auto-blocking, and the band's boundaries are
      tuned against measured precision at each threshold. The corpus makes
      this tuning empirical: precision and recall are computed per layer and
      per channel, and the ship gate in the classifier contract encodes a
      concrete floor. Indirect injection complicates the economics usefully --
      because non-user-channel injections are both higher-severity and, in
      practice, rarer, escalating them aggressively costs little in false-
      positive volume while catching the attacks that matter most. The
      section's stance is that placement is an evidence-based decision the
      platform revisits as the numbers move, not a one-time architectural
      commitment -- which is exactly why the hybrid layer makes it a config
      value and Section 5.9 owns the final call under a latency budget.
  part_6:
    title: 'Testing the Stack: Corpus, CI, and the Chapter 3 Discipline'
    body: |-
      An injection detector that has not been measured is a hypothesis, not a
      detection, so the stack is built against a labelled corpus from the
      start. The corpus deliverable holds positive cases (injection attempts
      across direct and indirect channels and multiple technique families),
      negative cases (benign requests, including the treacherous ones that
      quote or ask about injection phrasings), and edge cases (obfuscated
      attempts that defeat regex, benign mentions that trip naive patterns).
      Every entry carries its true label, its channel, and where applicable
      its technique, so metrics can be sliced per channel and per family --
      because an aggregate recall number hides the indirect-injection blind
      spot that per-channel recall exposes.

      This corpus is not a one-time evaluation artifact; it is the CI gate, and
      it operationalises the Chapter 3 discipline for this detector. Every
      change to any layer -- a new pattern, a classifier retrain, a threshold
      tweak -- reruns the corpus, and a change that breaks a positive is a
      recall regression while a change that starts firing on a negative is a
      precision regression, both failing the build. The Section 5.3 case-study
      scenarios feed the same harness: the indirect-injection-to-tool-
      exfiltration scenario asserts the context-source scoring fires while the
      direct-injection regex tier legitimately stays silent, which is the
      must-fire/may-stay-silent contract that catches over-firing as well as
      under-firing. The corpus is deliberately small and readable in the
      deliverable so the mechanics are clear; a production corpus grows
      continuously, fed by sampled false negatives from monitor-only
      deployment and by every new technique the community documents. The
      lifecycle is the point: the injection stack is not shipped and forgotten
      but versioned, measured, and refreshed on the same cadence as the
      pattern library it depends on -- because injection technique evolution
      is exactly the arms race Section 5.5 takes up next for jailbreaks.

