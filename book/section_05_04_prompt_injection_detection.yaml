# section_05_04_prompt_injection_detection.yaml

---
document_info:
  title: 'Detecting Prompt Injection: Regex, Classifier, and Hybrid Approaches'
  chapter: 5
  section: 4
  section_code: '0504'
  author: 'Raghav Dinesh'
  github: 'https://github.com/ruwgxo/detection-engineering-at-scale'
  license: 'MIT'
  version: '1.0'
  created: '2026-07-18'
  estimated_pages: 6
  estimated_reading_time: '45-55 minutes'

section_overview:
  one_line_summary: |-
    Prompt injection detection is a layered stack, not a single technique: a
    fast, explainable regex layer expressed as Sigma over OCSF GenAI events
    catches known phrasings; a classifier layer defined by a swappable
    contract catches the paraphrases regex cannot express; a configurable
    hybrid decision layer combines their verdicts so the same code serves
    inline blocking or monitor-only placement; and indirect injection is
    handled by scoring every tagged context source, not just the user turn --
    the whole stack tested against a labelled corpus per Chapter 3.
  why_this_section_exists: |-
    The framework layer named prompt injection the highest-prevalence,
    observable-now hypothesis on the backlog -- OWASP LLM01, the marquee ATLAS
    LLM technique family -- and assigned it here. This is where Chapter 5 stops
    mapping and starts building. It is also the section where the chapter's
    central methodological claim gets its first full workout: that AI security
    detection is detection engineering, subject to the same layering, the same
    lifecycle, and the same measurement discipline as any other detection
    domain, and specifically NOT a product you buy or a single clever trick.

    The section exists because both obvious approaches to prompt injection fail
    on their own, and they fail in opposite, instructive ways. A team that
    regexes its way through injection ships a detector adversaries enumerate in
    an afternoon: every pattern is a public signature, and paraphrase defeats
    it. A team that goes classifier-only ships a detector it cannot explain to
    an analyst at three in the morning, cannot tune without retraining, and
    cannot reason about when it fails. The engineering answer is neither and
    both: a layered stack that uses each method where it wins, measures both,
    and combines them under an explicit policy. Building that stack -- and
    proving the combination beats either half -- is the work of this section.
  position_in_chapter: |-
    Fourth section of Chapter 5 and the first detector-building section. The
    framework layer (5.1 telemetry, 5.2 OWASP map, 5.3 ATLAS map) is complete
    and pointed here. This section builds the prompt injection stack; Section
    5.5 extends the same layered thinking to jailbreaks, reusing the
    classifier contract and adding semantic-distance and multi-turn state.
    Sections 5.6 through 5.8 build the remaining traffic- and pipeline-side
    detectors, and Section 5.9 takes this section's hybrid layer and decides
    what earns a place inline in the request path under a latency budget. The
    corpus and test discipline established here become the template every
    later detector follows.

learning_objectives:
  knowledge:
  - 'Distinguish direct from indirect prompt injection as separate detection
    problems with different telemetry and different provenance'
  - 'State precisely what the regex layer can and cannot catch, and why
    known-pattern detection is a first layer rather than a whole detector'
  - 'Explain how pattern-layer detections are expressed as Sigma rules over
    OCSF GenAI events and tagged to LLM01 per the Section 5.2 convention'
  - 'Define the classifier contract -- inputs, outputs, thresholds, service
    level -- and explain why the stack depends on the contract, not the model'
  - 'Explain the hybrid decision layer''s combination logic and why the union
    of two layers'' true positives is the design goal'
  - 'Reason about false-positive economics and why the inline-versus-monitor
    placement decision is a policy value, not a code change'
  - 'Explain why rationale spans are non-negotiable for the classifier layer
    and what breaks in triage without them'
  skills:
  - 'Author a pattern-layer Sigma pack over prompt events, tagged to LLM01,
    with documented false positives'
  - 'Write a classifier contract that keeps the detector model-agnostic and
    fail-open on timeout'
  - 'Implement the hybrid decision layer with configurable inline/monitor
    policy and provenance-aware escalation'
  - 'Build a labelled positive/negative/edge corpus and measure per-layer
    precision, recall, and F1 as a CI gate'
  - 'Detect indirect injection by scoring tagged non-user context sources'
  security_mindset:
  - 'Assume every published pattern is an enumeration target; treat the regex
    layer as triage, never as coverage'
  - 'Refuse a detector you cannot explain to an analyst -- opacity is an
    operational cost, not just an aesthetic one'
  - 'Weight injections by provenance: an instruction arriving in retrieved
    content is a different severity from one the user typed'
  - 'Measure before shipping and after every change; an untuned injection
    detector is a coverage claim, not coverage'

