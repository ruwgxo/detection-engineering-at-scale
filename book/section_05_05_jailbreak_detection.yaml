document_info:
  title: 'Jailbreak Detection: Pattern Libraries and Semantic Distance Methods'
  chapter: 5
  section: 5
  section_code: '0505'
  author: 'Raghav Dinesh'
  github: 'https://github.com/ruwgxo/detection-engineering-at-scale'
  license: 'MIT'
  version: '1.0'
  created: '2026-07-18'
  estimated_pages: 5
  estimated_reading_time: '40-50 minutes'

section_overview:
  one_line_summary: |-
    Jailbreaks attack the model policy rather than the application logic, and
    they mutate weekly -- so the detector is a maintained system, not a file: a
    defensively curated family-level pattern library, a contrastive semantic
    distance scorer that generalises to novel paraphrases, a stateful
    correlation rule for the multi-turn escalation that single-message scoring
    structurally cannot see, and an evaluation harness that measures per-family
    decay and fails CI when a family rots below its declared recall floor.
  why_this_section_exists: |-
    Section 5.4 built the layered detector for prompt injection: hijacking the
    application instructions. Jailbreaks are the adjacent and distinct problem
    -- defeating the model policy itself -- and they need their own section for
    three reasons the injection stack does not fully cover.

    The first is tempo. Injection phrasings evolve; jailbreak families evolve
    under an active, public, adversarial research community, so a pattern
    library is a snapshot of last quarter's attacks the day it merges. That
    makes decay measurement a first-class deliverable rather than a maintenance
    afterthought. The second is the multi-turn family: incremental escalation
    distributes the attack across a conversation such that no single turn
    violates policy, which is not a scoring problem at all but a stateful
    correlation problem in the Chapter 2 sense. The third is a curation
    constraint with no analogue in the injection stack: a public repository of
    working jailbreak payloads is an attack cookbook with a defensive README.
    This section therefore ships structural signals and defanged paraphrases,
    keeps working payloads in a restricted corpus referenced by hash, and
    treats that boundary as a design requirement rather than a disclaimer.
  position_in_chapter: |-
    Fifth section of Chapter 5 and the second detector-building section. It
    inherits the layered architecture, the classifier contract, and the hybrid
    decision layer from Section 5.4 and extends them with semantic distance,
    conversation state, and lifecycle measurement. Sections 5.6 and 5.7 move
    off the traffic path to pipeline and consumption telemetry; Section 5.8
    returns to content with output-side monitoring, where the system-prompt
    canary work pairs with the extraction attempts covered here; and Section
    5.9 places the whole traffic-side stack under a latency budget. The decay
    harness pattern established here becomes the maintenance template for
    every pattern-bearing detector in the chapter.

learning_objectives:
  knowledge:
  - 'Distinguish jailbreaks from prompt injection by target -- model policy
    versus application instructions -- and explain why the distinction changes
    the detector, the telemetry, and the response'
  - 'Name the five jailbreak families in the taxonomy and give the structural
    signals that identify each'
  - 'Explain why a static pattern library decays and what a recall floor per
    family buys the program'
  - 'Explain embedding-space proximity detection and why absolute cosine
    similarity is uncalibrated without a benign background centroid'
  - 'Explain why incremental escalation is structurally invisible to
    single-message scoring and requires stateful conversation correlation'
  - 'Describe defensive-only curation and why a public jailbreak payload
    repository is an attack cookbook regardless of its stated intent'
  - 'Explain how detection thresholds are derived from observed separation
    rather than hand-picked, and where Chapter 10 formalises this'
  skills:
  - 'Curate a family-level pattern library with structural signals, weights,
    recall floors, and a contribution policy that keeps payloads out'
  - 'Build a contrastive semantic scorer with a pluggable embedding backend and
    a benign background corpus'
  - 'Write a stateful multi-turn correlation rule with accumulators, a window,
    and analyst-triageable emission'
  - 'Measure per-family recall against a held-out corpus and wire decay
    detection as a CI gate'
  - 'Set an operating threshold from the observed gap between populations
    rather than from intuition'
  security_mindset:
  - 'Treat every pattern library as perishable and instrument its decay -- the
    detection is the refresh loop, not the file'
  - 'Refuse to publish working attack payloads even in a defensive repository;
    structural signals detect, payloads only enable'
  - 'Assume the attack that matters is distributed across turns, not contained
    in the one message you are scoring'
  - 'Distrust any similarity score without a background baseline -- ordinary
    text is similar to everything'

prerequisites:
- 'Section 5.4: the layered detection architecture, the classifier contract,
  and the hybrid decision layer this section extends'
- 'Section 5.1: prompt_events and completion_events with conversation_id --
  the state key the multi-turn rule correlates on'
- 'Section 5.2: the LLM01 coverage row and the Sigma tag convention'
- 'Chapter 2, Section 2.3: the correlation engine and the stateful versus
  stateless distinction the multi-turn rule depends on'
- 'Chapter 3: the CI gate the decay harness plugs into'
- 'Chapter 10 (forward): statistical baselining and variance-aware threshold
  setting, previewed here and formalised there'

prose_content:
  part_1:
    title: 'Jailbreaks and Injection: Adjacent Attacks, Different Targets'
    body: |-
      Prompt injection and jailbreaking are routinely used interchangeably, and
      the conflation produces detectors that miss half of both. The clean
      distinction is the target. Prompt injection attacks the application: it
      hijacks the instruction hierarchy so the model serves the attacker's
      objective instead of the developer's, which is why Section 5.4 scored
      every context source and weighted retrieved content heavily. Jailbreaking
      attacks the model: it manipulates the model past its own behavioural
      policy, so that it produces output it would otherwise decline, and it
      usually arrives through the front door -- the user turn, from a user who
      is exactly who they claim to be.

      Three consequences follow for the detector. The telemetry emphasis
      shifts: indirect channels dominate injection detection, while jailbreak
      detection lives primarily in the user turn and, critically, in the
      conversation. The severity calculus differs: a successful injection is a
      compromise of application integrity, often with a third-party attacker
      and an innocent user, whereas a successful jailbreak is a policy failure
      by a first-party user, which changes both the response playbook and who
      gets paged. And the adversarial dynamics differ most of all. Injection
      technique evolution is driven by attackers probing specific
      applications; jailbreak technique evolution is driven by a large, public,
      fast-moving community that publishes new families continuously. That last
      difference is why this section's centre of gravity is not the detector
      but the maintenance system around it.

      The two attacks do compose in practice -- an injected instruction can
      carry a jailbreak payload, which is why the Section 5.4 pattern pack
      already tags role-manipulation priming -- and the stacks share
      architecture deliberately. The classifier contract, the hybrid decision
      layer, and the corpus-as-CI-gate discipline all carry over unchanged. What
      this section adds is what jailbreaks specifically demand: generalisation
      to novel paraphrase, memory across turns, and instrumented decay.
  part_2:
    title: 'A Working Taxonomy of Jailbreak Families'
    body: |-
      Detection needs families rather than instances, because instances are
      infinite and families are few. Five families cover the overwhelming
      majority of observed jailbreak traffic, and each is defined by structural
      signals -- what the attempt does, not what it says.

      Roleplay persona override assigns the model an alternate identity whose
      defining characteristic is the absence of policy, then demands
      acknowledgement of the new role. Its signals are persona assignment
      directed at the assistant, capability or restriction negation bound to
      that persona, and a compliance confirmation demand. Hypothetical framing
      wraps a concrete operational request in a fictional, academic, or
      counterfactual frame, appeals to research or safety-testing
      justification, and asks for the in-frame content verbatim -- the verbatim
      demand is the tell that distinguishes it from genuine creative writing.
      Encoding obfuscation transforms the request to evade surface matching:
      encoded payloads with decode-then-comply instructions, character-level
      insertion inside trigger terms, or mid-request language switching.
      Many-shot priming fills the context with fabricated prior exchanges in
      which the model complied, then asks for continuation of the established
      pattern; it is the family most sensitive to context-window growth, since
      longer contexts make it more effective. And incremental escalation
      distributes the attack across turns, each one benign in isolation, each
      citing prior compliance as precedent -- the family that gets its own
      deliverable in part 4 because no single-message detector can see it.

      Two properties of this taxonomy matter operationally. Families compose:
      a real attempt often combines hypothetical framing with a persona
      override and light obfuscation, so the detector scores against all
      centroids rather than routing to one. And families carry different
      weights, both in how effective they are and in how fast they mutate,
      which is why the library records a weight and a recall floor per family
      rather than treating them as a flat list.
  part_3:
    title: 'The Pattern Library and Defensive-Only Curation'
    body: |-
      The first detection layer is the same shape as Section 5.4's: match known
      structure cheaply and explainably. But the artifact differs in a way that
      is easy to get wrong and hard to undo. A jailbreak pattern library
      populated with working payloads -- the actual prompts that defeat current
      models, copy-pasteable, version-controlled, and published -- is an attack
      cookbook. The defensive framing of the surrounding repository does not
      change what the file is, and open-sourcing it, which this book otherwise
      encourages, actively distributes it.

      The library deliverable therefore stores structural signals, not
      payloads. Each family carries a description, the composable signals a
      detector matches on, a weight, a first-observed date, and a recall floor.
      Working examples live in a held-out evaluation corpus in a restricted
      repository, referenced by hash and never inlined, and the contribution
      policy requires new families to arrive as signal descriptions plus a
      corpus reference rather than as pastes. This is not merely an ethical
      posture; it is better engineering. Signals generalise across the
      paraphrases of a family, while a payload matches exactly one phrasing --
      so the defensively curated artifact is also the more durable detector.

      The structural-signal approach has a real limitation the next part
      addresses. Signals are still lexical at heart: matching them requires the
      attempt to use recognisable vocabulary, and the harness in part 5
      demonstrates a family whose newer variants use vocabulary the library
      never curated, driving its measured recall below the declared floor. That
      is the pattern layer working as designed -- cheap, explainable, and
      demonstrably incomplete -- and it is precisely why a second layer that
      does not depend on shared wording has to sit beside it.
  part_4:
    title: 'Semantic Distance and the Calibration Trap'
    body: |-
      Semantic distance detection embeds known family exemplars, computes a
      centroid per family, and scores incoming content by its proximity in
      embedding space. Its promise is exactly what the pattern layer lacks:
      a novel paraphrase that shares no vocabulary with any curated signal
      still lands near its family's centroid, because the embedding encodes
      structure rather than strings. The scorer deliverable keeps the embedding
      backend pluggable behind a single method, so a production deployment
      injects a real sentence encoder while the shipped stand-in stays
      dependency-free and legible.

      The trap is calibration, and building this deliverable walked straight
      into it. The naive design scores content against family centroids and
      thresholds the raw cosine similarity -- and it fails, because ordinary
      English text has a high baseline similarity to almost any English
      centroid. Benign support requests scored in the same band as jailbreak
      attempts, and no absolute threshold separated them: set it low and every
      customer question is an alert, set it high and real attempts pass. The
      fix is contrastive scoring. The scorer also builds a benign background
      centroid from ordinary application traffic, and what it thresholds is the
      margin between the nearest family similarity and the background
      similarity. Benign text is close to the background and the margin goes to
      zero or negative; a jailbreak attempt is closer to its family than to
      ordinary traffic and the margin opens. In the shipped run, held-out
      paraphrases sharing no exemplar vocabulary score margins from 0.31 to
      0.99 while benign controls sit at zero or below.

      The operating point follows from that separation rather than from
      intuition. The deliverable prints both populations, derives the threshold
      as the midpoint of the observed gap, and asserts the property that
      actually matters -- every jailbreak probe out-margins every benign probe
      -- rather than asserting that a hand-picked constant happens to work. A
      scorer that only passes a tuned threshold has proven nothing about
      separation. This is threshold setting by baselining in its simplest form;
      Chapter 10 formalises it with variance-aware methods, and the background
      corpus needs refreshing on the same cadence as the library, because a
      stale notion of normal is as harmful as a stale notion of attack.
  part_5:
    title: 'Multi-Turn Escalation as a Correlation Problem'
    body: |-
      Incremental escalation defeats both layers built so far, and not by being
      cleverer at the message level -- by not existing at the message level. The
      attacker opens with a legitimate request, establishes a rapport of
      compliance, and ratchets toward the policy boundary across turns, each
      one defensible in isolation, each citing the model's prior cooperation as
      precedent. Score any single turn and it is benign, because it is benign.
      The attack is the trajectory.

      That makes it a stateful correlation problem in the Chapter 2 sense, and
      the deliverable is written as a correlation spec rather than a rule over
      events. It keys state on conversation_id, holds a sliding window bounded
      first by turn count and second by elapsed time -- slow-drip escalation
      over hours is a real pattern, so a purely time-bounded window misses it --
      and maintains three accumulators. Drift score counts turns whose family
      margin rises meaningfully over the previous turn, capturing the ratchet
      directly. Refusal persistence counts turns that pursue the same objective
      after the model has declined, which is the signal that separates
      escalation from a user rephrasing an honestly misunderstood request.
      Precedent reference fires on the structural signal of citing prior
      compliance. The condition combines them so that sustained drift alone
      suffices, or persistence after refusal combined with a precedent appeal.

      Two design details carry weight beyond this rule. The emission includes
      the contributing turn indices and their per-turn margins, because an
      analyst handed a verdict about a conversation without the conversation
      cannot triage it -- the same explainability requirement that made
      rationale spans mandatory in the Section 5.4 classifier contract. And the
      thresholds are explicitly labelled starting points derived from the
      scorer's margin scale, to be reset from observed conversation baselines
      per application. An escalation rule tuned on another application's
      traffic is a guess wearing a number.
  part_6:
    title: 'Measuring Decay: The Detection Is the Refresh Loop'
    body: |-
      Everything above ages. Families mutate, new families appear, and the
      vocabulary the library curated last quarter stops matching this quarter's
      variants -- so the question a jailbreak detection program must answer
      continuously is not 'does the library work' but 'which parts of it have
      stopped working'. That is what the evaluation harness measures, and why
      it is a deliverable rather than a test script.

      The harness scores a held-out defanged corpus against both layers
      separately and in union, per family, and compares each family's measured
      recall against the floor the library declares for it. The per-detector
      split is the diagnostic that matters: a family where the library holds
      but semantic scoring misses is a curation success and an exemplar gap; a
      family where semantic holds but the library misses is vocabulary drift
      demanding new signals; a family where both fall is a family that has
      genuinely moved. The shipped run demonstrates all three states, including
      a many-shot family whose newer variants -- phrased with transcript and
      conversation-history vocabulary the v1.4.0 library never curated -- drive
      measured recall to 0.75 against a declared floor of 0.80. The harness
      names it stale and exits non-zero, so CI surfaces the decay as a work
      queue rather than letting it rot silently. That family carries a high
      weight, and high-weight families are given stricter floors precisely so
      that the most effective attacks are not allowed to decay quietly.

      Two disciplines complete the loop. The harness asserts the union property
      the injection stack also proves -- combining layers never loses recall
      against either alone -- so a change that improves one layer at the other's
      expense fails the build. And the held-out corpus must stay held out:
      building this deliverable produced a leakage bug worth naming, where
      enriching the exemplar sets to fix a miss made the exemplars near-copies
      of the probes and inflated every metric. Corpus and exemplars are
      separate artifacts with separate review, or the numbers measure nothing.
      Refresh is fed by miss analysis -- sampled false negatives from
      monitor-only deployment, plus newly published families -- and it runs on
      a cadence, because the security preview's claim is literal: a static
      library is a snapshot of last quarter's attacks, and the detection is the
      update pipeline, not the file.

