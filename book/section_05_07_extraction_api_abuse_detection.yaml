- 'Chapter 10 (forward): variance-aware baselining, previewed by the deviation
  floor used here'
- 'Chapter 12 (forward): response orchestration, which owns everything after
  the handoff contract'

prose_content:
  part_1:
    title: 'Extraction Economics and the One-Request Problem'
    body: |-
      Model extraction is the attack of copying a model's capability by
      querying it. The adversary sends inputs, records outputs, and trains a
      student model on the resulting pairs -- distillation, performed without
      permission. Related abuses share its shape: quota fraud, where a
      credential is resold and consumed by strangers; and denial-of-wallet,
      where the goal is not capability but cost, running up consumption until
      the victim throttles their own service or absorbs the bill.

      What unites them, and what makes them hard, is that they are entirely
      legitimate at the level detection usually operates. Look at any single
      request from an extraction campaign: an authenticated identity, an
      authorised endpoint, a well-formed body, a sensible prompt, a normal
      completion, a paid invoice. Nothing is violated. Compare that to
      injection, where a payload exists to be scored, or poisoning, where an
      artifact exists to be verified. Extraction offers the detector nothing to
      look at, because the malicious property is not in any request -- it is in
      the relationship between thousands of them.

      The economics also favour patience. An extractor has no deadline. Where
      injection must succeed within one conversation, a distillation campaign
      can spread across weeks, staying beneath every per-minute and per-hour
      rate limit the platform enforces, because those limits exist to protect
      capacity rather than to catch adversaries. This is why the section's
      telemetry argument arrives before its detection argument: catching a
      campaign that runs for a month requires retaining consumption data for
      longer than a month, which is a schema and privacy decision made long
      before any detector is written.
  part_2:
    title: 'Metadata-Only Telemetry and the Fingerprint Trick'
    body: |-
      The token_accounting family is deliberately the narrowest in the Section
      5.1 inventory: identity, endpoint, consumption counts, request shape,
      outcome. No prompt text, no completion text, no context. That
      restriction looks like a limitation and is actually the enabling
      constraint, for a reason worth stating plainly: content telemetry lives
      under the restricted-content regime from Section 5.1 -- inline redaction,
      short retention, partitioned access -- and short retention is fatal to
      slow-burn detection. Keeping this family metadata-only is what makes a
      months-long retention window defensible to a privacy reviewer, and that
      window is the detection.

      One requirement seems to break the rule. Diversity is the strongest
      extraction signal available, and measuring diversity means knowing
      whether two requests were similar -- which sounds like it needs the
      prompts. The schema resolves this with a prompt fingerprint: a
      locality-sensitive hash, stable under paraphrase, that lets the detection
      layer compare requests for similarity without ever storing what they
      said. It is not reversible and it is never used to reconstruct prompts.
      This is a pattern worth carrying beyond this section: when a signal seems
      to require content, ask what property of the content it actually needs,
      and whether that property can be derived at the point of emission and
      shipped alone.

      From these core attributes the detection layer derives the signals that
      do the work: volume per identity per window, diversity as the ratio of
      distinct fingerprints to total requests, coverage as the spread of those
      fingerprints across the topic space, parameter sweep as the count of
      distinct sampling-parameter hashes, refusal ratio, and cost velocity
      against the identity's own history. The schema lists these explicitly as
      derived rather than emitted, because the gateway's job is to emit facts
      cheaply and the detection layer's job is to compute meaning over windows.
  part_3:
    title: 'Why Global Thresholds Cannot Work'
    body: |-
      The natural first detector is a rate limit with an alert attached: flag
      any identity exceeding some number of requests per window. The detector
      deliverable implements exactly this and runs it against three identities
      -- an ordinary interactive user, a sanctioned batch integrator, and a
      patient extraction campaign -- with a result that settles the question.

      At a cap set low enough to catch the extractor, the sanctioned integrator
      flags too, and flags on volume four times larger. That alert is worse
      than useless: an analyst who sees the company's largest legitimate
      consumer at the top of the queue every morning learns to dismiss the
      rule, and the real detection leaves with it. Raise the cap above the
      integrator and the extractor disappears entirely, because the extractor
      is smaller. There is no value that separates them, and this is not a
      tuning failure. The two identities are genuinely indistinguishable on the
      axis being measured; the axis is wrong.

      What separates them is behaviour. The integrator runs one narrow task
      shape at enormous volume: low diversity, low coverage, a single sampling
      configuration, no refusals. The extractor runs maximally varied queries
      spread evenly across the topic space at several sampling configurations,
      accumulating refusals as it maps the boundaries -- because its objective
      is not answers but the model's response surface. Systematic enumeration
      is the signature, and enumeration is visible in the shape of the query
      set regardless of its size. The lesson generalises past extraction: when
      a threshold's correct value depends on who is asking, it is a baseline
      problem wearing a rule costume.
  part_4:
    title: 'Per-Identity Baselines and Composite Scoring'
    body: |-
      The alternative scores each identity against its own established envelope.
      The baseline deliverable holds an identity's recent per-window request
      counts and computes a deviation score for a new window -- how unusual is
      this, for them. That single change reframes the extractor's window: 220
      requests is unremarkable globally and far below the integrator, but sits
      more than eight deviations above the extractor's own history, because the
      campaign ramped.

      Two implementation details matter more than the arithmetic. The deviation
      unit carries a floor: a perfectly steady identity has near-zero spread,
      and dividing by it turns trivial variation into enormous scores, which is
      the classic way per-identity baselining floods a queue. The floor is
      expressed as a fraction of the identity's own mean, so it scales. And the
      composite weights are exposed as a module-level constant rather than
      buried in the scoring function, because an alert whose score cannot be
      decomposed cannot be triaged -- the same explainability requirement that
      made rationale spans mandatory in Section 5.4 and contributing turn
      indices mandatory in Section 5.5.

      The composite combines relative volume with diversity, coverage,
      parameter sweep, and refusal ratio. Against the same three identities it
      produces the separation the threshold could not: the extractor scores
      0.767 and flags, the sanctioned integrator clears at 0.057 despite
      sending four times the traffic, and the ordinary user clears. The
      deliverable asserts all three outcomes rather than printing them, so a
      future weight change that breaks the separation fails the build.
  part_5:
    title: 'Attributing the Signal Honestly'
    body: |-
      A detector that works for reasons its authors misunderstand cannot be
      tuned, and the first draft of this section's closing claim was wrong in
      exactly that way. It asserted that the separation came from the
      behavioural signals rather than volume -- a satisfying line that the
      numbers do not support. The deliverable therefore runs an ablation and
      reports the split.

      Behavioural signals alone score the extractor at 0.468, just under the
      threshold. Relative volume alone contributes 0.300, nowhere near it.
      Neither half suffices; both are load-bearing, and the honest claim is
      narrower than the appealing one: what fails completely is ABSOLUTE
      volume, which ranks the sanctioned integrator four times higher than the
      extractor. Volume is genuinely informative, but only in reference to an
      identity's own envelope. The ablation is written as assertions so this
      stays true: if a future weight change lets either half clear the bar
      alone, the build fails and the prose gets revisited.

      This is a discipline worth generalising to every composite detector in
      the book. Publishing a score without an attribution is publishing a
      number nobody can argue with, and detection engineering runs on
      arguable numbers. Ablation costs a few lines, converts a claim into a
      measurement, and gives the next engineer -- who will be tuning these
      weights against real traffic that looks nothing like the demo -- a
      starting point that tells the truth about which signals were carrying
      the detection and which were decoration.
  part_6:
    title: 'What Belongs in Rules, and Where Detection Stops'
    body: |-
      Not all of this problem needs a scoring layer, and the rule pack covers
      the parts that do not. Credential spread -- one API key serving dozens of
      distinct principals in an hour -- is a deterministic correlation over
      identity fields and a strong signal for resold or shared keys. Cost
      velocity breaks against an identity's trailing profile catch compromised
      credentials and runaway clients early, and cost is among the least
      gameable signals available, because an adversary optimising to stay
      under a cost baseline is an adversary paying less for a slower campaign.
      Sustained low-rate querying across a multi-week window catches precisely
      the traffic that is polite by every short-window measure. Refusal-rate
      spikes catch boundary probing.

      The pack carries a scope note that matters as much as the rules: the
      extraction verdict itself is deliberately not a Sigma rule. Two rules
      reference platform-provided baseline lookups and say explicitly that
      where the platform cannot express per-entity baselines in rule syntax,
      the logic belongs in the scoring layer and must not be degraded into a
      fixed cap -- which would reintroduce the global threshold this section
      spent part 3 dismantling. Naming that temptation inside the artifact is
      the point; the pressure to flatten a baseline into a constant arrives
      during implementation, not during design.

      Where detection stops is the other boundary. The handoff contract
      deliverable specifies what an abuse alert must carry -- the three
      revocation granularities, the score with its components, the baseline
      summary, the window, the sanctioned-bulk flag, and a re-runnable evidence
      query -- and what it must not: no content, and no recommended action.
      Choosing between throttling, challenging, revoking, and picking up the
      phone is a policy decision that Chapter 12 owns, and coupling detection
      to a response system that does not exist yet is how both end up harder to
      change. Section 5.8 returns to content with output-side monitoring.

