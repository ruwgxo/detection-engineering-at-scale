# section_05_07_extraction_api_abuse_detection.yaml

---
document_info:
  title: 'Model Extraction and API Abuse: Rate Anomaly Detection'
  chapter: 5
  section: 7
  section_code: '0507'
  author: 'Raghav Dinesh'
  github: 'https://github.com/ruwgxo/detection-engineering-at-scale'
  license: 'MIT'
  version: '1.0'
  created: '2026-07-18'
  estimated_pages: 4
  estimated_reading_time: '35-45 minutes'

section_overview:
  one_line_summary: |-
    Model extraction and API abuse are invisible per request and obvious per
    baseline: no single call is malicious, so the detection lives in each
    identity own consumption envelope combined with query-diversity, coverage,
    and parameter-sweep signals over metadata-only telemetry -- and a global
    volume threshold provably cannot separate an extraction campaign from a
    sanctioned bulk integrator sending four times more traffic.
  why_this_section_exists: |-
    Every detector built so far in this chapter judges content: what the prompt
    said, what the completion contained, what entered the pipeline. Extraction
    judges nothing about content at all. A distillation campaign consists
    entirely of authorised, well-formed, individually reasonable requests from
    an authenticated identity paying its bills. There is no payload to score,
    no signature to match, no policy violated. The attack exists only as a
    shape across many requests.

    That makes this the chapter's clearest demonstration of a principle the
    book has argued since Chapter 1: some detections are architecture, not
    rules. A team that approaches extraction with the rule-writing reflex
    reaches for a rate limit, discovers it fires on the company's largest
    legitimate customer, raises it until the alerts stop, and now has a
    threshold above every realistic extraction campaign. The failure is not
    tuning; it is that the question 'is this too many requests' has no answer
    that does not reference who is asking. The section builds the alternative
    -- per-identity baselines plus behavioural signals over a metadata-only
    telemetry family -- and proves in executable form that it separates cases
    no threshold can.
  position_in_chapter: |-
    Seventh section of Chapter 5, and the last of the runtime detectors before
    the chapter turns to outputs and assembly. It fills the LLM10 row of the
    Section 5.2 matrix and the model_extraction and cost_harvesting_denial
    hypotheses from the Section 5.3 backlog, both rated observable_now. It sits
    off the content path entirely: Section 5.6 left the traffic path for the
    build pipeline, this section returns to runtime but reads only consumption
    metadata, and Section 5.8 returns to content with output-side monitoring.
    Response actions are deliberately out of scope and deferred to Chapter 12;
    this section defines the handoff contract only.

learning_objectives:
  knowledge:
  - 'Explain extraction economics and why systematic querying is
    indistinguishable from legitimate traffic one request at a time'
  - 'Name the consumption signals the gateway must emit -- volume, diversity,
    coverage, parameter sweep, refusal ratio, cost velocity -- and what each
    detects'
  - 'Explain why the token_accounting family is metadata-only by design and how
    that choice enables the long retention slow-burn detection requires'
  - 'Explain why a global rate threshold cannot separate extraction from
    sanctioned bulk usage, in both directions'
  - 'Describe query-pattern signals: coverage-maximising probes, temperature
    sweeps, and systematic enumeration'
  - 'Explain why cost anomalies are a security signal and among the least
    gameable ones available'
  - 'State which parts of this problem are Sigma-expressible and which require
    a stateful scoring layer'
  skills:
  - 'Specify consumption telemetry with a prompt fingerprint that supports
    diversity scoring without retaining prompt content'
  - 'Build per-identity baselines with a deviation floor that prevents steady
    identities from flagging on trivial variation'
  - 'Score a composite extraction signal and run an ablation to attribute its
    behaviour honestly'
  - 'Write correlation rules for credential spread, cost velocity, and
    slow-burn accumulation'
  - 'Define an alert-to-response handoff contract without building the response'
  security_mindset:
  - 'Distrust any threshold whose correct value depends on who is asking --
    that is a baseline problem wearing a rule costume'
  - 'Treat an alert that fires on your largest legitimate customer as a broken
    detector, not an acceptable cost'
  - 'Assume the patient adversary: the campaign that stays under every
    short-window limit is the one worth catching'
  - 'Know why your detector works -- an author wrong about signal attribution
    cannot tune it'

prerequisites:
- 'Section 5.1: the token_accounting family and the gateway as the emission
  point for consumption telemetry'
- 'Section 5.2: the LLM10 coverage row and the Sigma tag convention'
- 'Section 5.3: the model_extraction and cost_harvesting hypotheses, and the
