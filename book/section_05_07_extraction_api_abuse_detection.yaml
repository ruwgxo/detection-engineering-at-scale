deliverables:
  deliverable_1:
    title: 'API Abuse Sigma Rule Pack'
    filename: 'sigma_api_abuse_rules.yml'
    description: |-
      Four gateway-log rules over the token_accounting category: credential
      spread across principals, cost velocity break against identity history,
      sustained low-rate querying across an extended window, and refusal-ratio
      spikes indicating boundary probing. Tagged to LLM10 per the Section 5.2
      convention.
    implementation_notes: |-
      Multi-document YAML, one rule per document. The pack carries an explicit
      scope note: the extraction verdict is NOT a Sigma rule, because it
      requires per-entity baselines that live in the scoring layer. Two rules
      reference a platform-provided baseline lookup and state directly that
      where a platform cannot express per-entity baselines in rule syntax, the
      logic moves to the scoring layer rather than degrading into a fixed cap
      -- naming the temptation inside the artifact, since it arrives during
      implementation rather than design. The slow-burn rule requires retention
      exceeding its own window, which is the schema decision from deliverable 3.
    code: |
      # sigma_api_abuse_rules.yml
      # Section 0507 -- Model Extraction and API Abuse: Rate Anomaly Detection
      # 20260718 | Detection Engineering: AI Security Detection (Section 0507 Extraction and API Abuse Detection) by Raghav Dinesh
      #
      # Gateway-log rules over the token_accounting family. IMPORTANT SCOPE NOTE:
      # these rules cover the DETERMINISTIC and CORRELATION-EXPRESSIBLE half of the
      # problem -- credential-sharing shapes, cost velocity breaks, and slow-burn
      # aggregates. The extraction verdict itself is NOT a Sigma rule: it needs a
      # per-identity baseline, which is a stateful scoring problem living in
      # extraction_detector.py. Rules that pretend otherwise become the global
      # threshold this section argues against.
      title: API key used from an implausible identity spread
      id: 9a4d3c20-0507-4c01-9e01-abuse0001
      status: experimental
      description: One credential serving many distinct principals, the signature of a shared or resold key
      logsource:
          product: genai_gateway
          category: token_accounting
      detection:
          selection:
              endpoint.route|exists: true
          condition: selection | count(distinct identity.user_id) by identity.api_key_id over 1h > 25
      fields:
          - identity.api_key_id
          - identity.org_id
          - endpoint.route
      falsepositives:
          - Service accounts fronting a legitimate multi-user application; allowlist by api_key_id with an owner and a review date
      level: medium
      tags:
          - owasp_llm.2025.llm10
          - attack.credential_access
      ---
      # sigma_api_abuse_rules.yml (rule 2 of 4)
      # Section 0507 -- 20260718 | Detection Engineering: AI Security Detection (Section 0507 Extraction and API Abuse Detection) by Raghav Dinesh
      title: Cost velocity break against identity history
      id: 9a4d3c20-0507-4c02-9e02-abuse0002
      status: experimental
      description: Consumption cost for an identity departs sharply from its own trailing profile
      logsource:
          product: genai_gateway
          category: token_accounting
      detection:
          selection:
              consumption.estimated_cost_units|exists: true
          condition: selection | sum(consumption.estimated_cost_units) by identity.user_id over 1h > 8 * baseline_hourly_cost(identity.user_id)
      fields:
          - identity.user_id
          - identity.org_id
          - consumption.estimated_cost_units
      falsepositives:
          - Genuine launch or migration traffic; expect a burst window and confirm against change records rather than suppressing
      level: high
      tags:
          - owasp_llm.2025.llm10
      comment: >
          baseline_hourly_cost() is a platform-provided baseline lookup, not a literal
          Sigma function. Where the platform cannot express per-entity baselines in
          rule syntax, this belongs in the scoring layer instead -- do not degrade it
          into a fixed cost cap, which is the global-threshold failure.
      ---
      # sigma_api_abuse_rules.yml (rule 3 of 4)
      # Section 0507 -- 20260718 | Detection Engineering: AI Security Detection (Section 0507 Extraction and API Abuse Detection) by Raghav Dinesh
      title: Sustained low-rate querying across an extended window
      id: 9a4d3c20-0507-4c03-9e03-abuse0003
      status: experimental
      description: Slow-burn volume that stays under any per-hour rate limit but accumulates over weeks
      logsource:
          product: genai_gateway
          category: token_accounting
      detection:
          selection:
              outcome.status: ok
          condition: selection | count() by identity.user_id over 21d > 50000 and max_hourly_rate(identity.user_id) < 200
      fields:
          - identity.user_id
          - endpoint.model_id
      falsepositives:
          - Long-running batch integrations; these clear on diversity in the scoring layer, so route rather than suppress
      level: medium
      tags:
          - owasp_llm.2025.llm10
      comment: >
          This rule exists because rate limiting is a per-window control and extraction
          is a per-campaign attack. It deliberately looks for traffic that is polite by
          every short-window measure. Retention must exceed the window (see schema).
      ---
      # sigma_api_abuse_rules.yml (rule 4 of 4)
      # Section 0507 -- 20260718 | Detection Engineering: AI Security Detection (Section 0507 Extraction and API Abuse Detection) by Raghav Dinesh
      title: Refusal-ratio spike indicating boundary probing
      id: 9a4d3c20-0507-4c04-9e04-abuse0004
      status: experimental
      description: An identity accumulating refusals at a rate consistent with systematic capability mapping
      logsource:
          product: genai_gateway
          category: token_accounting
      detection:
          selection:
              outcome.status: refused
          condition: selection | count() by identity.user_id over 1h > 40
      fields:
          - identity.user_id
          - endpoint.model_id
      falsepositives:
          - New integrations miscalling the API; correlate with error status and first-seen identity age before escalating
      level: medium
      tags:
          - owasp_llm.2025.llm10
          - owasp_llm.2025.llm01
  deliverable_2:
    title: 'Extraction Detector'
    filename: 'extraction_detector.py'
    description: |-
      Per-identity baseline and query-diversity anomaly scorer. Runs both a
      global volume threshold and per-identity composite scoring over the same
      three-identity traffic, proving the threshold cannot separate a
      sanctioned integrator from an extraction campaign while the baseline
      approach can -- then runs an ablation attributing the composite score to
      its signal groups.
    implementation_notes: |-
      Single quotes throughout per book convention; no double-quotes at all.
      The deviation unit carries a floor expressed as a fraction of the
      identity own mean, preventing a steady identity from flagging on trivial
      variation -- the classic per-identity baselining noise failure. Composite
      weights are a module-level constant so a score can be decomposed in
      triage. Every claim in the demo is an assertion: the integrator must
      clear, the extractor must flag, and neither ablation half may clear the
      bar alone, so a future weight change that breaks the section argument
      fails the build rather than silently invalidating the prose.
    code: |
      #!/usr/bin/env python3
      # extraction_detector.py
      # Section 0507 -- Model Extraction and API Abuse: Rate Anomaly Detection
      # 20260718 | Detection Engineering: AI Security Detection (Section 0507 Extraction and API Abuse Detection) by Raghav Dinesh
      # Single quotes throughout per book convention
      '''Per-identity baseline and query-diversity scoring for model extraction.

      The section thesis in executable form: extraction hides in the aggregate, so
      the detection lives in the BASELINE, not in a rule threshold. This module
      demonstrates the claim by running both approaches over the same traffic:

        global threshold  -- one volume cutoff for everyone. Flags the legitimate
                             batch integrator, misses the patient extractor.
        per-identity      -- each identity scored against its own established
                             envelope, combined with diversity, coverage, parameter
                             sweep, and refusal signals.

      Only the second separates the two. That is the whole argument.

      Signals come from the token_accounting family (deliverable 3): metadata only,
      no prompt content. Diversity uses prompt_fingerprint, never prompt text.
      '''
      from __future__ import annotations

      import statistics
      import sys
      from collections import Counter
      from dataclasses import dataclass, field

      # Weights for the composite extraction score. Tuned to the signal scales below,
      # and deliberately exposed rather than buried: an unreviewable score is an
      # unreviewable alert.
      WEIGHTS = {
          'volume_z': 0.30,
          'diversity': 0.25,
          'coverage': 0.20,
          'parameter_sweep': 0.15,
          'refusal_ratio': 0.10,
      }


      @dataclass
      class Baseline:
          '''An identity established consumption envelope, learned from its own history.'''

          identity: str
          request_means: list = field(default_factory=list)

          @property
          def mean(self) -> float:
              return statistics.mean(self.request_means) if self.request_means else 0.0

          @property
          def stdev(self) -> float:
              if len(self.request_means) < 2:
                  return 0.0
              return statistics.stdev(self.request_means)

          def z_score(self, value: float) -> float:
              '''Deviation from this identity own normal, not from a global norm.

              A floor on the deviation unit prevents a perfectly steady identity
              (stdev near zero) from flagging on trivial variation -- the classic
              way per-identity baselining produces noise.
              '''
              spread = max(self.stdev, 0.15 * self.mean, 1.0)
              return round((value - self.mean) / spread, 2)


      def window_signals(events: list) -> dict:
          '''Derive the signals the schema promises, over one identity window.'''
          n = len(events)
          if n == 0:
              return {}
          fingerprints = [e['prompt_fingerprint'] for e in events]
          distinct = len(set(fingerprints))
          # Coverage: how evenly the requests spread across topic buckets. Systematic
          # enumeration maximises spread; real work clusters.
          buckets = Counter(f.split('-')[0] for f in fingerprints)
          even_share = 1.0 / len(buckets) if buckets else 0.0
          spread = 1.0 - sum(abs(c / n - even_share) for c in buckets.values()) / 2
          return {
              'requests': n,
              'diversity': round(distinct / n, 3),
              'coverage': round(spread * (len(buckets) / 8.0), 3),
              'parameter_sweep': round(len({e['parameters_hash'] for e in events}) / n, 3),
              'refusal_ratio': round(sum(e['status'] == 'refused' for e in events) / n, 3),
              'tokens': sum(e['input_tokens'] + e['output_tokens'] for e in events),
          }


      def global_threshold_verdict(sig: dict, request_cap: int) -> str:
          '''The naive approach: one volume cutoff applied to every identity.'''
          return 'FLAG' if sig['requests'] > request_cap else 'clear'


      def extraction_score(sig: dict, baseline: Baseline) -> dict:
          '''Composite per-identity score. Volume matters only relative to the
          identity own envelope; the behavioural signals carry the rest.'''
          z = baseline.z_score(sig['requests'])
          components = {
              'volume_z': min(1.0, max(0.0, z / 6.0)),
              'diversity': sig['diversity'],
              'coverage': min(1.0, sig['coverage']),
              'parameter_sweep': sig['parameter_sweep'],
              'refusal_ratio': min(1.0, sig['refusal_ratio'] * 3),
          }
          score = sum(WEIGHTS[k] * v for k, v in components.items())
          return {'score': round(score, 3), 'z': z,
                  'components': {k: round(v, 3) for k, v in components.items()}}


      def _synth(identity: str, n: int, distinct_ratio: float, buckets: int,
                 params: int, refusals: int, tokens: int) -> list:
          '''Build a synthetic window with controlled signal properties.'''
          events = []
          for i in range(n):
              fp_index = i if i < int(n * distinct_ratio) else 0
              events.append({
                  'user_id': identity,
                  'prompt_fingerprint': str(i % buckets) + '-' + str(fp_index),
                  'parameters_hash': 'p' + str(i % params),
                  'status': 'refused' if i < refusals else 'ok',
                  'input_tokens': tokens,
                  'output_tokens': tokens,
              })
          return events


      def _demo() -> int:
          # Three identities, one window each.
          #  normal      -- ordinary interactive use
          #  integrator  -- SANCTIONED batch consumer: very high volume, but narrow
          #                 and repetitive (same task shape over and over)
          #  extractor   -- patient distillation campaign: volume only modestly above
          #                 its own history, but maximally diverse and systematic
          windows = {
              'normal-user': _synth('normal-user', 40, 0.5, 3, 2, 0, 300),
              'batch-integrator': _synth('batch-integrator', 900, 0.02, 2, 1, 0, 250),
              'extractor': _synth('extractor', 220, 0.98, 8, 6, 12, 400),
          }
          # Each identity own established envelope, learned from prior windows.
          baselines = {
              'normal-user': Baseline('normal-user', [35, 42, 38, 45, 40]),
              'batch-integrator': Baseline('batch-integrator', [880, 910, 895, 905, 890]),
              'extractor': Baseline('extractor', [95, 110, 88, 102, 99]),
          }

          print('signals per identity (token_accounting derived, metadata only)')
          print('-' * 78)
          sigs = {}
          for name, events in windows.items():
              s = window_signals(events)
              sigs[name] = s
              print(name.ljust(20) + 'req=' + str(s['requests']).ljust(6)
                    + 'div=' + str(s['diversity']).ljust(7)
                    + 'cov=' + str(s['coverage']).ljust(7)
                    + 'sweep=' + str(s['parameter_sweep']).ljust(7)
                    + 'refuse=' + str(s['refusal_ratio']))

          # Approach 1: a single global volume threshold, set to catch the extractor
          # volume. Whatever value is chosen, the integrator dwarfs it.
          cap = 200
          print('\napproach 1: global volume threshold (cap=' + str(cap) + ' requests/window)')
          print('-' * 78)
          global_verdicts = {}
          for name, s in sigs.items():
              v = global_threshold_verdict(s, cap)
              global_verdicts[name] = v
              print('  ' + name.ljust(20) + v)

          # Approach 2: per-identity baseline plus behavioural signals.
          print('\napproach 2: per-identity baseline + query-pattern signals')
          print('-' * 78)
          scored = {}
          for name, s in sigs.items():
              r = extraction_score(s, baselines[name])
              scored[name] = r
              verdict = 'FLAG' if r['score'] >= 0.5 else 'clear'
              print('  ' + name.ljust(20) + 'score=' + str(r['score']).ljust(7)
                    + 'z=' + str(r['z']).ljust(7) + verdict)
              print('      components: ' + str(r['components']))

          print('\n' + '-' * 78)
          # The claims, asserted rather than described.
          assert global_verdicts['batch-integrator'] == 'FLAG', 'demo invalid'
          assert global_verdicts['extractor'] == 'FLAG'
          print('global threshold: flags the SANCTIONED integrator as loudly as the')
          print('extractor -- an alert an analyst learns to dismiss, taking the real')
          print('detection with it. Raising the cap above the integrator hides the')
          print('extractor entirely. There is no cap that separates them.')

          assert scored['extractor']['score'] >= 0.5, 'extractor must flag'
          assert scored['batch-integrator']['score'] < 0.5, 'sanctioned integrator must clear'
          assert scored['normal-user']['score'] < 0.5, 'ordinary user must clear'
          assert scored['extractor']['score'] > scored['batch-integrator']['score']
          print('\nper-identity baseline: extractor ' + str(scored['extractor']['score'])
                + ' flags while the higher-VOLUME integrator clears at '
                + str(scored['batch-integrator']['score']) + '.')

          # Ablation: measure what each signal group actually contributes rather than
          # asserting it. Honest attribution matters -- a detector whose authors are
          # wrong about why it works cannot be tuned.
          print('\nablation: contribution of each signal group to the extractor score')
          print('-' * 78)
          ex_sig, ex_base = sigs['extractor'], baselines['extractor']
          full = extraction_score(ex_sig, ex_base)['score']
          comps = extraction_score(ex_sig, ex_base)['components']
          behavioural = sum(WEIGHTS[k] * comps[k] for k in
                            ('diversity', 'coverage', 'parameter_sweep', 'refusal_ratio'))
          relative_volume = WEIGHTS['volume_z'] * comps['volume_z']
          print('  behavioural signals only (no volume): ' + str(round(behavioural, 3)))
          print('  relative-volume contribution:         ' + str(round(relative_volume, 3)))
          print('  full score:                           ' + str(full))

          # The honest conclusion: BOTH halves are load bearing. Behavioural signals
          # alone fall just short of the threshold; relative volume alone is nowhere
          # near it. What fails completely is ABSOLUTE volume, which ranks the
          # sanctioned integrator four times higher than the extractor.
          assert behavioural < 0.5, 'behavioural signals alone should not clear the bar here'
          assert relative_volume < 0.5, 'relative volume alone should not clear the bar either'
          assert sigs['batch-integrator']['requests'] > 4 * sigs['extractor']['requests']
          print('\nneither half suffices alone -- and note the extractor sent FOUR TIMES')
          print('FEWER requests than the integrator it outscores. Volume is informative')
          print('only relative to an identity own envelope (z=' + str(full and scored['extractor']['z'])
                + '); in absolute terms it points at the wrong identity entirely.')
          print('That is why extraction hides in the aggregate: the detection lives in')
          print('the baseline, not the rule threshold.')
          return 0


      if __name__ == '__main__':
          sys.exit(_demo())
  deliverable_3:
    title: 'Token Accounting Schema'
    filename: 'token_accounting_schema.yaml'
    description: |-
      The consumption telemetry family specified: identity at three
      granularities, endpoint, consumption counts including cache hits, request
      shape with a prompt fingerprint, and outcome -- plus the derived signals
      the detection layer computes over windows, and the retention rule that
      slow-burn detection depends on.
    implementation_notes: |-
      Metadata-only is the enabling constraint, not a limitation: it keeps this
      family out of the restricted-content regime, which is what makes the long
      retention slow-burn detection requires defensible to a privacy reviewer.
      The prompt fingerprint is the pattern worth generalising -- a
      locality-sensitive hash that carries the similarity property diversity
      scoring needs without retaining prompt text, computed at emission and
      shipped alone. Derived signals are listed but explicitly not emitted: the
      gateway emits facts cheaply, the detection layer computes meaning over
      windows.
    code: |
      # token_accounting_schema.yaml
      # Section 0507 -- Model Extraction and API Abuse: Rate Anomaly Detection
      # 20260718 | Detection Engineering: AI Security Detection (Section 0507 Extraction and API Abuse Detection) by Raghav Dinesh
      #
      # The token_accounting family from the Section 5.1 inventory, specified.
      # Deliberately METADATA ONLY: no prompt or completion content appears here.
      # That is what lets consumption telemetry carry long retention and broad
      # analyst access while prompts and completions stay in the restricted-content
      # regime -- and long retention is exactly what slow-burn extraction detection
      # needs.
      schema_version: '1.0'
      telemetry_family: 'token_accounting'
      privacy_class: 'metadata -- no content, no rationale spans, no context text'
      emission_point: 'LLM gateway, one event per request; billing plane as reconciliation source'
      core_attributes:
        event_id: 'uuid'
        timestamp: 'rfc3339'
        identity:
          user_id: 'string -- the acting principal'
          api_key_id: 'string -- credential used; distinct from user_id, an extractor may rotate keys under one identity'
          org_id: 'string -- tenant, for peer-group baselining'
        endpoint:
          model_id: 'string'
          route: 'string -- logical endpoint or application'
        consumption:
          input_tokens: 'int'
          output_tokens: 'int'
          cached_input_tokens: 'int -- cache hits change the cost profile and must not be double counted'
          estimated_cost_units: 'float -- normalised cost, not currency; see cost_signal notes'
        request_shape:
          parameters_hash: 'string -- hash of sampling parameters (temperature, top_p, penalties)'
          prompt_length_tokens: 'int'
          prompt_fingerprint: 'string -- locality-sensitive hash of the prompt, NOT the prompt'
          tool_count: 'int'
        outcome:
          status: 'enum: ok | refused | error | timeout'
          latency_ms: 'int'
      derived_signals:
        note: >
          Computed by the detection layer over windows of core events, not emitted by
          the gateway. Listed here because the schema exists to make them computable.
        volume: 'requests and tokens per identity per window'
        diversity: 'distinct prompt_fingerprint count over total requests -- the extraction tell'
        coverage: 'spread of fingerprints across the embedding or topic space; systematic enumeration maximises it'
        parameter_sweep: 'distinct parameters_hash values per identity -- temperature sweeps probe model behaviour, not answers'
        refusal_ratio: 'refused over total; probing for boundaries raises it'
        cost_velocity: 'estimated_cost_units per unit time against the identity own history'
      prompt_fingerprint_notes:
        what: 'a locality-sensitive hash (e.g. SimHash over shallow features) that is stable under paraphrase'
        why: >
          Diversity and coverage need to know whether two requests are SIMILAR without
          retaining what they said. A fingerprint gives the detection layer the
          signal while keeping this family metadata-only.
        what_it_is_not: 'not reversible, not a content store, and never used to reconstruct prompts'
      retention:
        rule: >
          Long by design -- extraction campaigns run for weeks, so a 30-day window is
          a blind spot, not a policy. Metadata-only classification is what makes long
          retention defensible; adding content here would force short retention and
          destroy the detection.
  deliverable_4:
    title: 'Abuse Alert Handoff Contract (stub)'
    filename: 'abuse_alert_playbook_stub.md'
    description: |-
      The detection-side half of the response boundary: what an abuse alert
      must carry for a response system to act on it, what it must never carry,
      and a severity-to-response-tier mapping stated as a contract rather than
      an implementation. Completed in Chapter 12.
    implementation_notes: |-
      Deliberately a stub, and deliberately not a playbook. Response automation
      -- rate limiting, revocation, approval workflow, rollback -- is Chapter
      12, and building it here would couple detection to a response system that
      does not exist yet. Two contract terms carry the weight: the alert
      excludes content, so abuse alerts cannot drag the metadata-only family
      into the restricted-content regime; and the alert excludes a recommended
      action, because detection reports what it observed and how confidently
      while choosing the action is a policy decision response owns.
    code: |
      <!--
      abuse_alert_playbook_stub.md
      Section 0507 -- Model Extraction and API Abuse: Rate Anomaly Detection
      20260718 | Detection Engineering: AI Security Detection (Section 0507 Extraction and API Abuse Detection) by Raghav Dinesh
      -->
      # Abuse Alert Handoff Contract (stub)

      **Scope note.** This is the detection side of the boundary only: what an
      abuse alert must carry so that a response system can act on it. The response
      automation itself -- rate limiting, key revocation, tenant throttling, and
      the approval workflow around them -- is Chapter 12 (Automated Response and
      Orchestration). Building response logic here would couple detection to a
      response system that does not exist yet, which is the coupling Chapter 12
      exists to prevent.

      ## What the alert must carry

      | Field | Why response needs it |
      |---|---|
      | `identity.user_id`, `identity.api_key_id`, `identity.org_id` | The three revocation granularities. Revoking the wrong one either misses the abuser or takes down a tenant. |
      | `score` and `components` | The response tier depends on which signals fired: a diversity-driven extraction score and a cost-velocity spike warrant different actions. |
      | `baseline_summary` (mean, spread, window count) | Lets a human see what "normal" meant for this identity without re-querying. |
      | `window_start`, `window_end` | Campaign scope. Slow-burn cases span weeks and the window is the evidence. |
      | `sanctioned_bulk` flag | Whether this identity is on the reviewed allowlist. Response for an allowlisted identity is a conversation, not a revocation. |
      | `evidence_query` | A re-runnable platform query returning the contributing events, so triage never depends on the alert body alone. |

      ## What the alert must NOT carry

      - Prompt or completion content. The token_accounting family is metadata-only
        by design (see `token_accounting_schema.yaml`); pulling content into an
        abuse alert would drag this family into the restricted-content regime and
        force retention short enough to break slow-burn detection.
      - A recommended action. Detection reports what it observed and how
        confidently. Choosing between throttle, challenge, revoke, and contact is
        a policy decision owned by response.

      ## Severity to response-tier mapping (contract, not implementation)

      | Detection state | Meaning | Response tier (Chapter 12) |
      |---|---|---|
      | Score above threshold, identity allowlisted | Sanctioned bulk consumer behaving unusually | Notify owner; no automated action |
      | Score above threshold, not allowlisted | Probable extraction campaign | Graduated: challenge, then throttle |
      | Cost velocity break, short window | Possible compromised credential or runaway client | Fast throttle, owner contact |
      | Credential spread across many principals | Shared or resold key | Key-scoped action, not identity-scoped |

      ## Open items for Chapter 12

      - Rollback semantics for an automated throttle applied to a false positive.
      - Human-in-the-loop placement: which tiers require approval before action.
      - Feedback path: adjudicated outcomes returning to the baseline as labels.
common_mistakes:
  mistake_1:
    description: |-
      Detecting extraction with a global rate threshold -- one requests-per-
      window cap applied to every identity.
    why_it_happens: |-
      Rate limits already exist for capacity reasons, attaching an alert costs
      one line, and volume feels like the obvious axis for an attack whose
      defining property is sending many requests.
    consequence: |-
      No cap separates the cases. Set low enough to catch a campaign, it flags
      the largest legitimate consumer -- who sends far more traffic -- and the
      analyst learns to dismiss the rule. Set above that consumer, and every
      realistic campaign passes silently underneath.
    correct_approach: |-
      Baseline per identity and combine relative volume with behavioural
      signals: diversity, coverage, parameter sweep, refusal ratio. When a
      threshold correct value depends on who is asking, it is a baseline
      problem wearing a rule costume.
  mistake_2:
    description: |-
      Putting prompt or completion content into consumption telemetry so that
      diversity can be measured directly.
    why_it_happens: |-
      Diversity genuinely needs to know whether two requests were similar, and
      the obvious way to compare requests is to keep them. The data is already
      flowing through the gateway.
    consequence: |-
      The family moves into the restricted-content regime, which forces short
      retention and partitioned access. Slow-burn extraction runs for weeks, so
      a thirty-day window is a blind spot rather than a policy, and the
      detection this telemetry existed to enable is destroyed by the schema
      choice.
    correct_approach: |-
      Derive the property at emission and ship it alone: a locality-sensitive
      prompt fingerprint carries similarity without content, keeps the family
      metadata-only, and keeps months-long retention defensible. Generalise the
      pattern -- ask what property of the content the signal actually needs.
  mistake_3:
    description: |-
      Per-identity baselining without a deviation floor, dividing by whatever
      spread the identity history shows.
    why_it_happens: |-
      The statistics are textbook and the formula looks complete. Identities
      with near-zero variance are not the ones anyone tests against.
    consequence: |-
      A perfectly steady identity -- a scheduled job sending the same volume
      every window -- has near-zero spread, so trivial variation produces
      enormous deviation scores and a permanent stream of alerts from the most
      predictable traffic on the platform.
    correct_approach: |-
      Floor the deviation unit at a fraction of the identity own mean so it
      scales with the identity, as the baseline deliverable does. Chapter 10
      covers the variance-aware treatment in full.
  mistake_4:
    description: |-
      Shipping a composite score without attribution -- publishing a number and
      a threshold with no way to decompose either.
    why_it_happens: |-
      The score works on the evaluation traffic, the weights feel
      self-explanatory to whoever chose them, and ablation looks like academic
      overhead next to a detector that already separates the cases.
    consequence: |-
      Nobody can tune it, triage it, or argue with it. Worse, the authors
      routinely misattribute their own detector -- this section first claimed
      the separation came from behavioural signals rather than volume, which
      the measurement contradicted.
    correct_approach: |-
      Expose the weights as a reviewable constant, emit components with every
      verdict, and run an ablation that reports each signal group contribution
      as executable assertions, so a weight change that invalidates the claim
      fails the build.
  mistake_5:
    description: |-
      Building response automation into the detector -- auto-throttling or
      revoking credentials directly from the scoring layer.
    why_it_happens: |-
      The detector already knows the identity and the severity, the action
      feels like the natural next line of code, and routing through a response
      system that has not been built yet feels like ceremony.
    consequence: |-
      Detection and response become one artifact with one release cycle: a
      threshold change becomes a production access change, a false positive
      becomes an outage with no rollback path, and the policy question of when
      to revoke gets answered implicitly by whoever wrote the scoring function.
    correct_approach: |-
      Define the handoff contract and stop: what the alert carries, what it
      excludes, and how detection states map to response tiers. Detection
      reports what it observed and how confidently; choosing the action is
      policy, and Chapter 12 owns it.

section_summary:
  compact: |-
    Model extraction, quota fraud, and denial of wallet are invisible in any
    single request -- each is authorised, well-formed, and paid for -- so the
    detection has to live in the relationship between requests. That starts
    with a deliberately metadata-only consumption schema whose prompt
    fingerprint carries similarity without content, keeping the family out of
    the restricted-content regime and making the months-long retention
    slow-burn campaigns require defensible. On that telemetry, a global volume
    threshold provably fails in both directions: set to catch a campaign it
    flags the sanctioned integrator sending four times more traffic, and set
    above that integrator it misses every realistic campaign. Per-identity
    baselining with a floored deviation unit, combined with diversity,
    coverage, parameter sweep, and refusal signals, produces the separation
    instead -- extractor 0.767 flagged, integrator 0.057 cleared -- and an
    ablation attributes the result honestly: behavioural signals and relative
    volume are each load-bearing and neither suffices alone, while absolute
    volume actively points at the wrong identity. Deterministic pieces such as
    credential spread, cost velocity, and slow-burn accumulation stay in Sigma
    rules that explicitly refuse to degrade baselines into fixed caps, and
    everything past the alert is a handoff contract owned by Chapter 12.
  key_takeaways:
  - 'Extraction is invisible per request and visible per baseline: no payload
    to score, no policy violated, and the malicious property exists only across
    thousands of authorised calls'
  - 'When a threshold correct value depends on who is asking, it is a baseline
    problem wearing a rule costume -- no global volume cap separates an
    extraction campaign from a larger sanctioned integrator'
  - 'Metadata-only telemetry is the enabling constraint, not a limitation: it
    buys the long retention slow-burn detection needs, and a prompt fingerprint
    supplies similarity without content'
  - 'Per-identity baselines need a deviation floor scaled to the identity own
    mean, or the steadiest traffic on the platform becomes the loudest alert
    source'
  - 'Attribute composite detectors by ablation and assert the result: this
    section first claimed the wrong signal was carrying the detection, and only
    the measurement caught it'
  - 'Detection stops at the handoff contract -- the alert carries identity
    granularities, score components, baseline summary, and evidence query, but
    never content and never a recommended action'

preview_section_05_08:
  title: 'LLM Output Monitoring: PII Leakage, Toxicity, Data Exfiltration'
  summary: |-
    Sections 5.4 through 5.7 covered everything entering the model and
    everything consumed by it. Section 5.8 turns to what comes out, on the
    argument that monitoring only prompts misses half the attack surface:
    completions carry PII and secret leakage, policy-evasion evidence, and
    exfiltration payloads staged across turns that only correlation can catch.
    It builds PII detection with per-data-class method selection, output policy
    scoring, exfiltration patterns including the system-prompt canary that
    pairs with the extraction attempts seen here, and the strict separation
    between detecting an incident and redacting its content -- because
    coupling them hides incidents.

