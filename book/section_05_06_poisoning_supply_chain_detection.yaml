# section_05_06_poisoning_supply_chain_detection.yaml

---
document_info:
  title: 'Training Data Poisoning Indicators: Supply Chain Detection'
  chapter: 5
  section: 6
  section_code: '0506'
  author: 'Raghav Dinesh'
  github: 'https://github.com/ruwgxo/detection-engineering-at-scale'
  license: 'MIT'
  version: '1.0'
  created: '2026-07-18'
  estimated_pages: 4
  estimated_reading_time: '35-45 minutes'

section_overview:
  one_line_summary: |-
    Poisoning is a supply-chain problem whose only affordable detection point
    is the pipeline: provenance telemetry that most programs do not emit,
    deterministic integrity verification that catches substitution and forgery
    outright, statistical indicators that catch ingestion campaigns at the
    stage boundary, and an explicit account of the post-training blindness that
    none of it removes.
  why_this_section_exists: |-
    Sections 5.4 and 5.5 detected attacks arriving at inference time, where the
    attacker gets one request and the defender gets full telemetry. Poisoning
    inverts that economics completely. The attacker acts once, upstream, weeks
    before deployment -- a tampered dataset shard, a swapped adapter, a flood
    of planted documents into a knowledge base -- and every subsequent
    inference serves the compromise for free. The defender, meanwhile, has
    almost no visibility: the ATLAS mapping in Section 5.3 rated both poisoning
    and supply-chain compromise needs-new-telemetry precisely because the
    pipeline_provenance family they depend on is the one family most detection
    programs have never onboarded at all.

    That asymmetry sets this section's argument. There is a narrow window --
    between an artifact entering the pipeline and the model shipping -- where
    poisoning is cheap to catch, because artifacts are still discrete,
    hashable, attributable things. Before that window the attack happens on
    infrastructure the defender does not operate. After it closes, the
    poisoning has been compiled into weights, where it is no longer an event at
    all. The whole section is therefore about instrumenting that window
    properly, and about being honest that closing it does not make the problem
    go away -- which is why part 6 is dedicated to what this detection cannot
    see.
  position_in_chapter: |-
    Sixth section of Chapter 5 and the first to leave the traffic path
    entirely. It builds the pipeline_provenance half of the Section 5.3
    backlog, filling the LLM03 and LLM04 rows of the Section 5.2 coverage
    matrix. Section 5.7 stays off the content path too but returns to runtime,
    covering consumption telemetry and extraction; Section 5.8 returns to
    content with output-side monitoring; and Section 5.9 assembles the traffic-
    side tiers under a latency budget -- an assembly this section's detectors
    sit outside, because pipeline detection runs at build time, not request
    time.

learning_objectives:
  knowledge:
  - 'Explain why poisoning is a supply-chain problem and why its attack
    economics invert those of inference-time attacks'
  - 'Name the four artifact classes in the AI supply chain -- datasets,
    fine-tunes and adapters, embedding indexes, model dependencies -- and what
    provenance each requires'
  - 'State what the training and RAG ingestion paths must log for any poisoning
    detection to be possible'
  - 'Distinguish the four indicator classes: source anomalies, distribution
    shift, label anomalies, and artifact integrity failures'
  - 'Explain why integrity verification is deterministic while ingestion
    indicators are statistical, and what that means for thresholds and false
    positives'
  - 'Explain what a signed manifest proves and, precisely, what it does not'
  - 'Describe post-training blindness and why detection cannot recover a
    poisoning signal once training has completed'
  skills:
  - 'Specify pipeline provenance telemetry as an OCSF-aligned event schema'
  - 'Write deterministic Sigma rules over provenance events for integrity and
    source anomalies'
  - 'Implement hash and signature verification against a signed manifest,
    including manifest-forgery resistance'
  - 'Detect RAG knowledge-base poisoning at ingestion with source,
    duplication, and distribution indicators'
  - 'Calibrate a statistical threshold from a corpus own internal variance
    rather than a hard-coded constant'
  security_mindset:
  - 'Instrument the window where the attack is still an event -- upstream of it
    you have no telemetry, downstream of it you have no signal'
  - 'Treat integrity verification as proof of provenance, never as proof of
    intent'
  - 'Expect statistical indicators to catch campaigns and miss craftsmanship,
    and say so rather than implying coverage you do not have'
  - 'Refuse to let an unverifiable artifact into a training job; the cheapest
    control in this section is the one that simply says no'

prerequisites:
- 'Section 5.1: the telemetry inventory, in which pipeline_provenance is the
  family emitted by CI/CD and MLOps tooling rather than the gateway'
- 'Section 5.2: the LLM03 and LLM04 coverage rows this section fills, and the
  Sigma tag convention'
- 'Section 5.3: the poisoning and supply-chain hypotheses rated
  needs-new-telemetry, and the supply-chain test scenario'
- 'Chapter 3: CI/CD pipeline design -- the pipeline these detections
  instrument is the one Chapter 3 built'
- 'Chapter 10 (forward): variance-aware threshold setting, previewed by the
  calibration approach in the ingestion monitor'
- 'Working familiarity with ML pipeline mechanics: datasets, fine-tuning,
  model registries, and RAG ingestion'

prose_content:
  part_1:
    title: 'Poisoning as a Supply-Chain Problem'
    body: |-
      The instinct to treat poisoning as a data-quality issue is the first
      wrong turn. Data quality asks whether records are accurate; poisoning
      asks whether an adversary chose them. The right frame is the one software
      security arrived at a decade ago for dependencies: everything that flows
      into a model is a dependency, each dependency has a provenance chain, and
      an attacker who compromises any link inherits the trust the whole chain
      carries.

      Four artifact classes make up that supply chain. Datasets are the obvious
      one -- training corpora, fine-tuning sets, evaluation sets -- and they
      arrive from vendors, public repositories, and internal pipelines with
      wildly different trust properties. Fine-tunes and adapters are artifacts
      in their own right: a LoRA adapter downloaded from a public hub is
      executable behaviour modification wearing the costume of a small binary
      file. Embedding indexes are the class most often forgotten, and they are
      where retrieval poisoning lands, because the knowledge base is a
      dependency the model consults at every request. Model dependencies -- the
      base model itself, plus the libraries and serialisation formats around it
      -- carry the same risks as any package dependency, with the added
      property that some model formats execute code on load.

      What unifies them, and what makes detection tractable at all, is that
      each is a discrete, hashable artifact with an origin, a moment of entry,
      and an actor who introduced it. That is the entire basis for the rest of
      this section. It is also why the attack economics are so lopsided: a
      poisoned artifact costs the attacker one successful upstream action and
      then pays out on every inference forever, while the defender must
      instrument a build pipeline that, in most organisations, was never
      designed to emit security telemetry at all.
  part_2:
    title: 'Provenance-First Telemetry'
    body: |-
      Nothing in this section is possible without events that do not currently
      exist in most environments. Section 5.1 named pipeline_provenance as one
      of the five mandatory families and flagged that it comes from CI/CD and
      MLOps tooling rather than the gateway; Section 5.3 rated the techniques
      depending on it needs-new-telemetry for the same reason. So the first
      deliverable here is the schema, not a rule pack -- because a rule pack
      over events nobody emits is theatre.

      The schema's organising claim is that every provenance event answers four
      questions: which artifact, which actor, which stage, and what did
      verification conclude. Artifact identity carries a stable id, a type, the
      URI it came from, a content hash, and a size. Actor carries the principal
      and, importantly, whether the stage was automation-triggered or manually
      invoked -- a human running a normally automated training stage at an odd
      hour is an indicator that costs nothing to capture and is invisible
      without this field. Stage places the event in the pipeline lifecycle.
      Verification records the expected hash, whether it matched, whether a
      signature and a build attestation were present and valid, and a verdict
      of verified, unverified, or failed.

      Four event types instantiate that shape: dataset ingest (adding record
      counts, source trust tier, and label distribution), fine-tune job
      (adding the base model reference, every dataset consumed, and a
      hyperparameter hash), registry mutation (adding the mutation type, the
      stage transition, and the approval reference whose absence is itself the
      signal), and RAG ingest (adding document counts, source domain, trust
      tier, and the embedding model used). Two properties of the schema are
      deliberate. Retention is longer than operational logs, because provenance
      is integrity evidence that must outlive the artifacts it describes, and
      tamper-evident storage is preferred since an attacker who can rewrite the
      provenance log can launder a poisoned artifact. And the privacy class is
      metadata only: document text stays in the knowledge base, not in
      telemetry, which keeps this family out of the restricted-content regime
      that governs prompts and completions.
  part_3:
    title: 'Deterministic Indicators: Integrity and Source'
    body: |-
      With provenance events flowing, the first indicator classes are the
      deterministic ones, and they are the best value in this section because
      they carry no false positive rate. An artifact either matches its
      manifest hash or it does not. A promotion to production either carries an
      approval reference or it does not. A RAG batch either came from an
      uncurated public source or it did not. These are Sigma rules in the
      ordinary sense, expressed over the provenance category, tagged to LLM03
      and LLM04, and shipped in the rule pack deliverable.

      Integrity verification is worth building out properly because the naive
      version has a hole. Hashing artifacts against a manifest catches
      substitution -- but only if the manifest itself is trustworthy, since an
      attacker who swaps the artifact will also update its recorded hash. The
      checker deliverable therefore verifies the manifest signature first and
      refuses to trust any hash in an unsigned or untrustworthy manifest. Its
      demonstration proves both properties: a vendor dataset substituted after
      signing is caught by hash mismatch, and a manifest forged to match the
      poisoned bytes is caught because the attacker cannot re-sign it without
      the trusted key. The shipped implementation uses HMAC so it runs without
      dependencies; production uses asymmetric signing through Sigstore,
      minisign, or a KMS-backed key, and the verification logic is unchanged.

      The verdict vocabulary matters more than it looks. Verified means hash
      and attestation both check out. Failed means something is actively wrong.
      Unverified is the interesting middle: the bytes match the manifest but
      nothing attests to how the artifact was built. Most organisations start
      with everything unverified, and the useful posture is to treat that as a
      tracked exception with an expiry rather than a permanent suppression --
      which is exactly how the corresponding Sigma rule documents its false
      positives. The cheapest control in this entire section is the pipeline
      simply refusing to feed an unverifiable artifact into a training job.
  part_4:
    title: 'Statistical Indicators at the Ingestion Boundary'
    body: |-
      Integrity proves an artifact is the one the manifest names. It says
      nothing about whether the content is trustworthy, and for retrieval
      poisoning that gap is the whole attack: the planted documents are
      genuinely the documents the pipeline intended to ingest. Catching that
      requires judging content statistically, in batch, at the ingestion stage
      boundary -- while rejection is still cheap.

      The monitor deliverable computes three indicator families per batch
      against a rolling baseline. Source anomalies cover the share of the batch
      from uncurated public sources and the concentration of the batch in a
      single domain. Duplication anomalies measure the fraction of documents
      that are near-identical to another in the batch, which is a direct
      indicator rather than a hygiene metric: practical retrieval poisoning
      works by flooding a corpus with variants of one planted claim so that it
      dominates retrieval for a target query. Distribution shift measures how
      far the batch's term distribution sits from the corpus it is joining,
      using Jensen-Shannon divergence because it is bounded and defined when a
      term appears on only one side -- the normal case for a new batch. In the
      shipped run, a planted batch of near-duplicate documents from one
      uncurated domain is quarantined on three independent indicators while an
      ordinary internal update is accepted.

      Two design corrections during construction are worth carrying into any
      implementation. First, domain concentration alone is not an indicator: a
      batch that is entirely internal intranet content is a normal corpus
      update, and flagging it teaches analysts to ignore the rule, which is how
      a detector dies. The check is therefore risk-weighted -- concentration
      only fires when the concentrated source is untrusted. Second, a
      hard-coded divergence threshold produced false positives on perfectly
      ordinary updates, because divergence between small text batches is
      inherently noisy. The monitor instead calibrates: it splits the existing
      corpus in half, measures the divergence the corpus already shows against
      itself, and sets the threshold to that value times a margin. A
      heterogeneous corpus earns a loose threshold and a homogeneous one earns
      a tight threshold, automatically and per corpus. This is statistical
      baselining in its simplest form, and Chapter 10 formalises the
      variance-aware version.
  part_5:
    title: 'Label Anomalies and the Training-Set Case'
    body: |-
      Retrieval poisoning is the attack most teams will actually face, because
      knowledge bases are updated continuously by comparatively lightweight
      pipelines. Classical training-set poisoning is rarer but more severe, and
      it has one additional indicator class the ingestion monitor does not
      cover: label anomalies.

      Where a dataset carries labels, the relationship between content and
      label is itself checkable. Backdoor poisoning works by attaching a
      trigger pattern to inputs whose labels have been flipped to the
      attacker's target class, so the statistical signature is a subpopulation
      whose label distribution diverges sharply from the corpus while sharing
      an unusual feature. The provenance schema captures the label distribution
      per ingest event precisely so this is computable at the stage boundary:
      a shard whose class balance departs materially from every prior shard
      from the same source is a finding, and the same calibration logic applies
      -- the threshold comes from the spread across accepted shards, not from a
      constant.

      The honest caveat is scope. Label-anomaly detection assumes labelled
      supervised data, which describes classical ML pipelines far better than
      it describes LLM fine-tuning on instruction data, where the label is the
      response and 'anomalous' is not statistically well defined. For that
      case, the durable controls are the ones from part 3: provenance,
      attestation, and refusing unverifiable artifacts. This is a place where
      the temptation to claim a detection is strong and the correct move is to
      record the limit -- the same discipline that produced the accepted-gap
      row in the Section 5.2 matrix.
  part_6:
    title: 'Post-Training Blindness: What This Cannot See'
    body: |-
      Every control in this section operates in one window: after an artifact
      becomes a discrete, attributable thing, and before it is consumed into
      model weights. Both edges of that window are hard limits, and a detection
      program that does not state them plainly will imply coverage it does not
      have.

      The upstream edge is the adversary's own infrastructure. A dataset
      poisoned at its source -- by whoever curated it, or by whoever
      compromised that curator -- arrives with a valid hash, a legitimate
      signature, and a clean attestation, because every one of those artifacts
      is generated by the compromised party. The integrity checker verifies it
      cleanly and says so explicitly in its output: integrity proves
      provenance, not intent. Similarly, a single well-written poisoned
      document from a trusted source, matching corpus style and duplicated
      nowhere, trips none of the statistical indicators. Those indicators
      detect campaigns, not craftsmanship, and the monitor prints that limit
      rather than burying it.

      The downstream edge is the more absolute one. Once training completes,
      the poisoning is no longer data -- it is a distributed adjustment to
      weights, with no event, no artifact, and no telemetry family that
      contains it. There is no detection rule over a weight tensor. Behavioural
      probing of a deployed model can reveal that something is wrong, and it is
      a legitimate control, but it is a different discipline from detection
      engineering: it requires knowing which behaviour to probe for, which the
      defender generally does not. This is why the section's economics
      argument matters so much. The pipeline window is not the best detection
      point because it is convenient; it is the only affordable one, and the
      program's response to a poisoning suspicion after deployment is
      containment and retraining rather than detection. Stating that clearly,
      in the coverage matrix and to stakeholders, is the difference between a
      program that knows its limits and one that discovers them during an
      incident.

