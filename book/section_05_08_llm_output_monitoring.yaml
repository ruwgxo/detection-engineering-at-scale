# section_05_08_llm_output_monitoring.yaml

---
document_info:
  title: 'LLM Output Monitoring: PII Leakage, Toxicity, Data Exfiltration'
  chapter: 5
  section: 8
  section_code: '0508'
  author: 'Raghav Dinesh'
  github: 'https://github.com/ruwgxo/detection-engineering-at-scale'
  license: 'MIT'
  version: '1.0'
  created: '2026-07-18'
  estimated_pages: 5
  estimated_reading_time: '40-50 minutes'

section_overview:
  one_line_summary: |-
    The completion channel is an egress path, so completions are inspected as
    telemetry: a staged pipeline of pluggable, cost-tiered checks emits
    findings that carry offsets and salted hashes but never raw values,
    detection stays strictly separate from redaction so scrubbing content never
    erases the incident, system prompt leakage is proven rather than inferred
    via canaries and template fingerprints, and staged exfiltration is caught by
    correlation that inline filtering structurally cannot perform.
  why_this_section_exists: |-
    Four sections of this chapter have inspected what goes into the model and
    what is consumed from it. None has looked at what comes out, and that gap
    is where a specific class of incident lives. A model that has been
    successfully injected does its damage in the completion. A model that has
    memorised training data discloses it in the completion. A model whose
    system prompt has been extracted reveals it in the completion. An agent
    exfiltrating data does so through output that a client renders. Monitoring
    prompts alone means detecting attempts while missing every success.

    The framing that makes this tractable is to stop treating completions as
    product output that happens to be inspectable and start treating them as
    telemetry that happens to be user-visible. Every other egress channel in
    the enterprise -- email, file transfer, DNS -- is monitored on that basis,
    and nobody argues that inspecting outbound email is a product feature
    decision. The completion channel is younger, so the argument still has to
    be made, and it is made most sharply by the security preview: every
    completion the platform does not inspect is an unmonitored egress channel
    wearing a product feature clothing.

    Two constraints shape everything that follows. The first is that output
    monitoring is where a detection program most easily builds the exact
    database it exists to prevent -- a searchable store of every card number,
    credential, and health detail the model has ever emitted. The second is
    that the obvious mitigation, inline redaction, quietly destroys detection
    if it is allowed to substitute for it.
  position_in_chapter: |-
    Eighth section of Chapter 5 and the last detector-building section. It
    fills the LLM02, LLM05, and LLM07 rows of the Section 5.2 matrix and closes
    the system-prompt loop opened by the extraction-attempt patterns in Section
    5.4 -- attempts are detected on the prompt side, disclosure is proven here.
    It also completes the traffic-side stack that Section 5.9 assembles under a
    latency budget, which is why every check in this section declares a cost
    tier. Section 5.10 then consolidates the completed coverage map.

learning_objectives:
  knowledge:
  - 'Explain why the completion channel is an egress path and what monitoring
    only prompts structurally misses'
  - 'State the per-data-class method selection rule for PII detection and why a
    single global method choice fails in both directions'
  - 'Explain why jurisdiction affects scope and severity but not detection
    logic'
  - 'Distinguish toxicity monitoring as policy detection from security
    detection, and explain why they share a pipeline anyway'
  - 'Name the exfiltration side channels available through completions:
    auto-rendering beacons, link payloads, encoded blobs, and tool-call
    arguments'
  - 'Explain canary-based system prompt leakage detection and what template
    fingerprinting adds when a canary is stripped'
  - 'Explain why redaction is response rather than detection, and what breaks
    when they are coupled'
  skills:
  - 'Build a staged output pipeline with pluggable, cost-tiered checks'
  - 'Emit findings that carry offsets and salted hashes rather than matched
    values'
  - 'Plant and register system prompt canaries and detect both verbatim and
    paraphrased disclosure'
  - 'Write correlation rules over output findings, including staged
    exfiltration across a conversation'
  - 'Specify a PII contract with jurisdiction profiles that scope classes
    without branching detection logic'
  security_mindset:
  - 'Treat every uninspected completion as unmonitored egress'
  - 'Refuse to let an output monitor become a curated store of the sensitive
    data it protects'
  - 'Never allow a filter to replace an alert -- scrubbed content with no
    finding is an incident that did not happen'
  - 'Assume exfiltration is staged across turns, because the single-turn
    version is the one everyone already blocks'

prerequisites:
- 'Section 5.1: completion_events, the restricted-content privacy regime, and
