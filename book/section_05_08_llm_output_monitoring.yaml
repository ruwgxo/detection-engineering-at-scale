- 'Chapter 12 (forward): response orchestration, which owns redaction and
  blocking decisions'

prose_content:
  part_1:
    title: 'The Completion Channel as Egress'
    body: |-
      Ask a security team how outbound email is monitored and they will
      describe content inspection, data-loss rules, and an alert queue. Ask how
      model completions are monitored and the answer is frequently that a
      guardrail product filters them, or that nobody has looked. The asymmetry
      is not principled. Both are channels through which internal data leaves
      an environment toward a recipient. One is old enough to have an
      established control category and the other is not.

      Reframing completions as egress makes the detection requirements fall
      out immediately. Egress channels get inspected for sensitive data
      leaving, they get monitored for covert channels, their findings feed
      correlation rather than terminating locally, and they are instrumented
      whether or not a preventive control also exists. Applied to completions,
      that means PII and secret detection, exfiltration side-channel detection,
      system prompt disclosure detection, and findings that reach the platform.

      The reframing also settles a recurring argument about ownership. Output
      filtering is usually built by the application team as a product quality
      feature -- keeping the assistant from saying something embarrassing --
      and security inherits whatever that produces. But a quality filter
      optimises for the user not seeing bad output, while a detection system
      optimises for the organisation knowing bad output occurred. Those goals
      diverge precisely at the moment that matters, which is why part 5 treats
      the separation of detection from redaction as the section load-bearing
      architectural claim rather than a stylistic preference.
  part_2:
    title: 'PII Detection: Method Per Data Class, Jurisdiction Per Scope'
    body: |-
      The most common PII-detection error is choosing one method and applying
      it everywhere. Pattern matching over structured identifiers is precise
      and cheap: a card number has a shape and a checksum, an API key has a
      prefix and an entropy floor, and a finding either validates or it does
      not. Applied to names, addresses, or free-text health detail, the same
      approach is blind, because those have no shape. Classifier and NER
      methods handle exactly that unstructured case and generalise to mentions
      nobody enumerated -- and applied to card numbers they produce noise while
      an eight-line regex with a checksum would have been exact.

      The contract deliverable therefore selects method per data class rather
      than globally: pattern methods with validation for payment cards,
      government identifiers, credentials, and contact details; classifier
      methods with confidence floors for person names and health detail. The
      evaluation gate follows the same principle and is deliberately per class,
      because an aggregate precision and recall figure will happily hide a data
      class that is entirely undetected behind strong numbers on the easy ones.

      Jurisdiction enters as scope and severity, not as logic. What counts as
      protected, and what response tier a finding warrants, genuinely differ
      across regions and applications -- special-category handling under GDPR,
      covered-entity status for health data, and a minimal floor profile for
      applications with no assigned jurisdiction that still never leaves
      credentials unmonitored. But the detection of a card number does not
      change by region. Keeping jurisdiction in profiles that select classes
      and severities, rather than branching the detectors, means one detector
      serves every region and a regulatory change is a configuration edit.
      Building it the other way produces per-region detector forks that drift
      apart within two quarters.
  part_3:
    title: 'Toxicity: Policy Detection Sharing a Security Pipeline'
    body: |-
      Toxicity and policy-violation monitoring sit awkwardly in a security
      book, and the honest treatment is to say why they are here and what they
      are not. A model producing abusive, discriminatory, or otherwise
      policy-violating output is a serious problem, but it is usually a product
      and trust-and-safety problem rather than a security incident: no
      adversary is required, the harm is reputational and human rather than
      confidentiality-related, and the owning team is rarely the SOC.

      They belong in this pipeline anyway, for two reasons that are
      architectural rather than definitional. First, they need exactly the same
      infrastructure: completion interception, staged checks, findings with
      offsets, a routing layer, and a response tier. Building a second
      inspection path for policy checks means two places where completions are
      read, two privacy reviews, and two latency budgets on the same request.
      Second, the boundary between policy and security is genuinely porous in
      one direction: a sudden shift in an application policy-violation rate is
      a strong indicator that something upstream changed, and jailbreak success
      frequently shows up first as a policy-violation spike rather than as a
      security alert.

      What keeps the distinction honest is routing rather than separation. The
      pipeline emits both kinds of finding with their data class attached, and
      the platform routes policy findings to the owning team while security
      findings page the SOC -- with a correlation rule watching for the case
      where a policy-violation rate change coincides with jailbreak scoring
      from Section 5.5. Sharing the pipeline is efficiency; sharing the alert
      queue would be a category error that buries security findings under
      volume the SOC cannot action.
  part_4:
    title: 'Exfiltration Side Channels in Output'
    body: |-
      The exfiltration case is where output monitoring stops being a variation
      on data-loss prevention and becomes specific to this attack surface,
      because the model can be induced to construct the channel itself.

      The sharpest example is the auto-rendering beacon. Many chat clients
      render markdown, including images. A completion containing an image
      reference causes the client to issue a request to that URL without any
      user action, and an attacker who has injected the model can have it embed
      data in the URL query string. The result is zero-click exfiltration
      through a feature nobody thought of as a channel: the user sees a broken
      image at worst, and the data has already left. The pipeline treats any
      auto-fetching resource reference in a completion as a critical finding,
      and pairs it with a check for long opaque payloads in link parameters,
      which catches the same technique through ordinary links.

      Encoded blobs are the second channel and require more care, because
      base64 in output is entirely normal for a developer assistant returning a
      fixture. The check therefore looks at context, firing on encoded content
      in prose rather than in code blocks, and it is deliberately assigned a
      lower cost tier and severity than the beacon check. The third channel is
      tool-call arguments, where a hijacked agent moves data through a
      function call rather than through visible output -- covered by the
      action-log rules Section 5.9 assembles, and named here so the map is
      complete. What all three share is that the single-instance version is
      the easy case; the hard case is staged, which part 5 addresses.
  part_5:
    title: 'Detection Is Not Redaction, and Findings Must Reach Correlation'
    body: |-
      This is the section architectural claim, and it is the one most
      implementations get wrong. The intuitive design puts a filter in the
      response path: inspect the completion, scrub anything sensitive, return
      the clean version. It protects the user, satisfies the product
      requirement, and produces no alert -- which means an incident occurred,
      was observed by the platform, and left no record. Every subsequent
      question the organisation might ask is now unanswerable: how often does
      this happen, which application, which identity, is it increasing, did it
      start after last week release.

      The pipeline enforces the separation structurally. Checks emit findings.
      Detection produces a redaction map -- a list of offset ranges -- and
      stops. A separate response layer may apply that map, log it, or ignore
      it, and the finding exists either way. The demonstration proves the
      property directly: the beacon case is scrubbed of its exfiltration URL
      and the finding survives the scrubbing. That ordering also preserves the
      Chapter 12 boundary, since whether to redact, block, or allow is a policy
      decision that belongs to response.

      The second half of the claim is that findings must reach the correlation
      engine rather than terminating at the filter, and the staged-exfiltration
      rule is why. An attacker who knows a single large encoded blob is caught
      splits the payload across turns, and each individual chunk is
      unremarkable -- too short to alarm, too ordinary to block. Only a rule
      counting encoded-blob findings within a conversation window sees the
      campaign, and that rule can only exist if every finding, including ones
      the response layer chose not to act on, lands in the platform. A pipeline
      that filters inline and emits nothing has not just lost an alert; it has
      made an entire class of attack structurally undetectable.
  part_6:
    title: 'Privacy-Safe Monitoring and the Placement Question'
    body: |-
      Output monitoring creates a specific hazard the rest of the chapter does
      not. A monitor that records what it found accumulates, in one place, with
      broad analyst access and long retention, every payment card, credential,
      and health detail the platform has ever emitted. That store is more
      valuable to an attacker than the model, and the security team built it.

      The pipeline avoids this by construction: findings carry the check name,
      the data class, the severity, the span offsets, and a salted hash of the
      matched value -- never the value. The offsets let the response layer
      redact and let an investigator retrieve the original from the
      short-retention completion store under break-glass access. The salted
      hash allows the one correlation that matters operationally -- the same
      value leaking repeatedly across completions -- without the platform ever
      holding the value. The demonstration asserts the property rather than
      documenting it, checking that no raw secret or card number appears in any
      emitted event. The same principle governs the canary registry, which
      stores hashed shingles rather than system prompt text, and the Sigma pack,
      which matches on finding metadata rather than completion content so
      sensitive matching logic never moves into the SIEM.

      Placement is the remaining decision, and this section prepares it rather
      than making it. Every check declares a cost tier, and the pipeline runs
      whichever tiers are enabled, so the same code serves inline inspection
      and asynchronous analysis -- the tiering demonstration shows the encoded
      blob check contributing nothing inline and firing once the near-real-time
      tier is enabled. Cheap deterministic checks such as beacon detection are
      inline candidates because their precision is high and the harm they
      prevent is immediate; classifier-based PII checks are more expensive and
      often better placed asynchronously, accepting that detection follows
      delivery. Section 5.9 makes that call under an explicit latency budget,
      and it can do so as configuration because this pipeline never assumed a
      placement.

