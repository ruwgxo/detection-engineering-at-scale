document_info:
  title: 'Production Architecture: AI Security Detection at API Gateway Scale'
  chapter: 5
  section: 9
  section_code: '0509'
  author: 'Raghav Dinesh'
  github: 'https://github.com/ruwgxo/detection-engineering-at-scale'
  license: 'MIT'
  version: '1.0'
  created: '2026-07-19'
  estimated_pages: 5
  estimated_reading_time: '40-50 minutes'

section_overview:
  one_line_summary: |-
    The chapter capstone assembles every detector from 5.4 through 5.8 into one
    deployable gateway architecture where placement is decided by latency budget
    and recoverability rather than preference: 94ms of inline detection inside a
    120ms cap, a fail policy fixed per detector before any incident, tiers that
    share state through the platform rather than the request path, and a closure
    report that recomputes the Section 5.2 coverage matrix from the detectors
    actually shipped.
  why_this_section_exists: |-
    Eight sections have produced detectors. None has answered the question a
    platform team asks first: what does this cost my request path. That question
    is not an afterthought to detection design -- it decides whether the
    detection exists at all. An AI security detector that adds unbounded latency
    to the request path is removed by the platform team before it ever catches
    an attack, and it is removed for entirely correct reasons, because a
    detection layer that becomes an availability risk has traded a hypothetical
    compromise for a certain outage.

    So this section makes placement a first-class engineering decision with a
    hard constraint behind it. Every detector carries a cost tier and a latency
    budget; the sum of inline budgets is capped; adding an inline detector means
    either fitting the headroom or demoting another one. That forced tradeoff is
    the mechanism. Alongside it sits the fail policy question -- what happens
    when a detector times out -- answered per detector in advance, because the
    alternative is answering it at three in the morning during the first
    gateway incident, when the only available answer is to disable the thing
    that is timing out.

    The section also closes the chapter honestly. The Section 5.2 matrix was
    built with every row marked planned. The closure report joins that matrix
    against the placement matrix and recomputes status from shipped detectors,
    so the final coverage claim is a computation over artifacts rather than an
    author remembering what got built.
  position_in_chapter: |-
    Ninth section of Chapter 5 and the capstone. It builds no new detection
    logic except the one component Section 5.8 explicitly deferred here -- the
    tool-call action-log gate -- and instead assembles what 5.4 through 5.8
    produced into a deployable architecture. Section 5.10 then consolidates the
    chapter: the closed coverage map, the consolidated rule pack, the mistakes
    reference, the assessment, and the bridge to Chapter 6. Scale engineering
    and response actions are deliberately out of scope, deferred to Chapters 9
    and 12 respectively.

learning_objectives:
  knowledge:
  - 'Name the four gateway integration points -- pre-request, tool-call gate,
    post-response, and off-path -- and what each can and cannot do'
  - 'State the four placement questions and apply them in order to any detector'
  - 'Explain why recoverability, not severity, determines which detectors earn
    fail-closed'
  - 'Explain why a capped inline budget is a design mechanism rather than a
    performance target'
  - 'Describe why tiers must share state through the platform rather than the
    request path'
  - 'Explain how the chapter rule packs and classifiers ship through the
    Chapter 3 pipeline, and what the two chapter-specific CI gates add'
  - 'Explain why coverage closure is computed from shipped detectors rather
    than declared'
  skills:
  - 'Build a placement decision matrix binding detector, tier, budget, fail
    policy, and rationale'
  - 'Wire detectors into a gateway configuration where placement is
    configuration rather than code'
  - 'Set and enforce an inline latency budget that fails at boot when exceeded'
  - 'Generate a coverage closure report that joins a framework matrix to
    implemented detectors per risk'
  - 'Instrument fail-open degradation so silent coverage loss becomes visible'
  security_mindset:
  - 'Treat placement as survival: an unbounded detector is a detector that will
    be removed'
  - 'Decide fail policy before the incident, because during the incident the
    only available answer is to disable the detector'
  - 'Prefer honest partial coverage computed from artifacts over a green
    dashboard asserted by an author'
  - 'Assume any detector can fail; require that its failure be visible'

