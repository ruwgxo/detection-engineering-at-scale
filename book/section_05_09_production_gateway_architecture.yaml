prose_content:
  part_1:
    title: 'The Gateway as Sensor, and Its Four Integration Points'
    body: |-
      Section 5.1 established the LLM gateway as the observation point for this
      surface, on the argument that no other layer sees the prompt channel. The
      capstone makes that concrete: the gateway is not merely where telemetry is
      captured, it is where detection executes, and it offers exactly four
      integration points with materially different properties.

      The pre-request point runs on the assembled context window before the
      model is called. It is the only point where an injection can be stopped
      before it acts, which is why the injection tiers live here despite the
      classifier being the single most expensive inline component in the
      architecture. The tool-call gate runs on each invocation the model
      requests, before execution -- a point that did not exist in earlier
      chapters because ordinary detection has no equivalent of a model choosing
      to act. The post-response point runs on the completion before delivery,
      which is the last moment a redaction map is useful and the last moment a
      beacon can be stopped. And the off-path point is everything else: findings
      and events flowing into the platform, where near-real-time and async
      detectors read them without ever sitting in the request path.

      The four points are not interchangeable, and the differences are not about
      cost. A detector at the pre-request point can prevent; a detector reading
      async can only detect. A detector at the tool-call gate can stop an
      irreversible action; the same logic reading events afterward can only
      record that the action happened. Placement therefore decides not just what
      a detector costs but what it is capable of, which is why the rest of this
      section treats it as an architectural decision rather than a tuning
      parameter.
  part_2:
    title: 'The Latency Budget as a Design Mechanism'
    body: |-
      The architecture sets a total inline budget of 120ms at p99, measured at
      the gateway under production concurrency rather than at p50 on a
      developer laptop. The placed detectors consume 94ms of it, leaving 26ms of
      headroom. Those numbers matter less than the rule attached to them: the
      sum of inline budgets must not exceed the cap, and the gateway refuses to
      start if a configuration violates it.

      Failing at boot rather than degrading at runtime is deliberate. A
      misconfigured chain that quietly adds forty milliseconds to every request
      is discovered by the platform team as a latency regression, investigated
      as a performance incident, and resolved by removing the security
      component. Failing at boot converts that outcome into a configuration
      error caught in staging, and it puts the tradeoff where it belongs: adding
      an inline detector requires either fitting the remaining headroom or
      demoting an existing one, argued explicitly rather than absorbed silently.

      The budget also explains an allocation that looks lopsided. The injection
      classifier alone takes 40ms -- more than a third of the consumed budget
      and more than every output check combined -- because indirect injection
      must be caught before the model acts on retrieved content, and detecting a
      successful injection afterward is an incident report rather than a
      prevention. Meanwhile the jailbreak semantic scorer, which is
      architecturally similar and roughly as valuable, was demoted to
      near-real-time at 250ms, because a jailbreak detected shortly after the
      response still drives suspension and conversation review. Same technique,
      different placement, and the deciding factor is what the detection can
      still accomplish once the response has left.
  part_3:
    title: 'Fail Policy: Recoverability, Not Severity'
    body: |-
      Every inline detector needs an answer to one question before deployment:
      what happens when it times out or errors. Fail-open allows the request and
      loses coverage; fail-closed blocks the request and preserves coverage at
      the cost of availability. The instinct is to map this onto severity --
      important detectors fail closed, minor ones fail open -- and that instinct
      produces an architecture that takes the platform down when a classifier
      has a bad afternoon.

      The correct axis is recoverability. Most detectors in this architecture
      fail open, including the injection tiers, because another tier or the
      async correlation still sees the request: coverage degrades rather than
      disappearing, and the alternative is a security component that can halt
      the product. Two inline detectors fail closed, and both share the same
      property. Beacon exfiltration completes the moment the client renders the
      response -- there is no post-hoc mitigation, the data is already gone.
      An irreversible tool call completes the moment it executes. In both cases
      the check is also cheap and high-precision, which is what makes
      fail-closed affordable rather than merely defensible.

      Off the request path, the calculus inverts entirely. The build-time checks
      from Section 5.6 fail closed by default, because blocking a build costs a
      pipeline re-run rather than a user request. That asymmetry is worth
      stating explicitly to a platform team: the security posture is strict
      where strictness is cheap and permissive where permissiveness preserves
      the product, and both choices were made deliberately rather than
      defaulting to whichever the framework happened to implement.

      The last piece is visibility. Every fail-open event emits a degradation
      record, because silent degradation is indistinguishable from clean traffic
      -- and a detector that has been failing open for a week is a coverage
      outage nobody declared.
  part_4:
    title: 'Normalisation and State Sharing'
    body: |-
      Two architectural rules keep the assembled system from collapsing back
      into a collection of point solutions.

      The first is that every finding and event flows through the Chapter 4
      OCSF normalisation layer into the Chapter 2 platform, on the same path as
      authentication and network telemetry, and no detector writes to a private
      console. This is the Section 5.1 argument arriving at its conclusion: a
      standalone AI security tool with its own dashboard recreates the SIEM
      lock-in problem of Section 4.1 on the newest surface in the stack, and it
      makes cross-domain correlation structurally inexpressible. With
      normalisation, an injection finding followed by anomalous tool calls under
      one identity is a single platform query. Without it, the same question is
      an integration project.

      The second rule is that tiers share state through the platform, never
      through the request path. An inline detector never waits on a correlation
      lookup; correlation reads the events the inline detectors emitted. The
      temptation to violate this is real and specific -- the multi-turn
      escalation state from Section 5.5 would genuinely improve inline scoring,
      and it is sitting right there in the correlation engine. Reaching for it
      synchronously puts platform query latency inside the request budget, at
      which point the tiered architecture has quietly become a slow monolithic
      one and the boot-time budget check will start failing for reasons nobody
      can explain. Where inline decisions need historical context, the context
      is pushed to the gateway as cached state on a refresh cycle, not pulled on
      demand.
  part_5:
    title: 'Shipping It: Detection-as-Code and Two Chapter Gates'
    body: |-
      Nothing in this architecture is deployed by hand. The rule packs, pattern
      libraries, contracts, and scorers all ride the Chapter 3 pipeline -- lint,
      unit test, integration test, stage, deploy -- and the assembly itself is
      configuration rather than code, so a placement change is a config pull
      request reviewed like any other rather than a gateway release.

      Two chapter-specific gates join the standard pipeline, and both were built
      as deliverables in earlier sections rather than invented here. The decay
      gate runs the Section 5.5 evaluation harness and fails the build when a
      jailbreak pattern family falls below its declared recall floor, which is
      how a library that has quietly stopped matching current variants becomes a
      red pipeline instead of a false coverage claim. The closure gate runs this
      section's report and fails when a coverage matrix row has no implementing
      detector and no recorded accepted gap.

      That second gate is worth dwelling on, because building it caught a real
      error. The first implementation joined the matrix to detectors by owning
      section: if a row was owned by Section 5.8 and Section 5.8 shipped
      detectors, the row counted as covered. That produced a confident ACTIVE
      status for excessive agency, credited to output-content detectors that
      have nothing to do with tool invocation -- a false coverage claim generated
      by the very report meant to prevent them. The fix was to make each
      detector declare the risks it covers and join on that, mirroring the
      Section 5.2 Sigma tag convention, and the exposed gap turned out to be
      genuine: the tool-call action-log gate that Section 5.8 deferred to this
      capstone had not yet been assembled. The lesson generalises past this
      report. A coverage join at the wrong granularity manufactures coverage,
      and it does so most convincingly in exactly the artifact everyone trusts.
  part_6:
    title: 'The Closed Coverage Picture and What Is Deferred'
    body: |-
      Running the closure report against the Section 5.2 matrix and the
      placement matrix produces the chapter's honest result: of ten rows, eight
      are active with named implementing detectors, one is partial by design,
      one is a recorded accepted gap, and none are open. The correct way to
      state that is ten of ten accounted for -- not ten of ten covered. LLM09
      remains an accepted gap because factuality is not a property any telemetry
      family carries, and LLM08 stays partial because the weakness is
      architectural while only its exploitation path emits telemetry. Both were
      recorded as such in Section 5.2 before any detector was built, and the
      report preserves them rather than quietly upgrading them once the chapter
      had something to show.

      Two things this architecture deliberately does not do. It states latency
      budgets but does not size infrastructure to meet them: throughput,
      horizontal scaling, caching strategy, and cost engineering for this
      pipeline are Chapter 9, and the enterprise-scale figures belong there
      rather than in an architecture diagram. And it emits findings without
      acting on them -- blocking, throttling, revocation, and applying the
      redaction map are response decisions owned by Chapter 12, which is why the
      Section 5.7 handoff contract stopped at the alert boundary and why the
      output pipeline returns a redaction map rather than a redacted string.

      What the chapter has produced is a monitored surface: the LLM attack
      surface that Section 5.1 showed was invisible to a mature detection
      program is now instrumented, mapped against two frameworks, detected by
      layered detectors with measured behaviour, assembled into a request path
      with an enforced budget, and reporting into the same platform as every
      other domain. Section 5.10 consolidates that result and hands off to
      Chapter 6, where the same discipline meets cloud, API, and serverless
      surfaces.

