deliverables:
  deliverable_1:
    title: 'Gateway Detection Reference Architecture'
    filename: 'gateway_detection_architecture.md'
    description: |-
      The component and data-flow map: four integration points with every
      detector placed, the inline budget consumption, the four placement
      questions in order, the fail policy table, detection-as-code integration
      with the two chapter gates, and the explicit deferrals to Chapters 9 and
      12.
    implementation_notes: |-
      The diagram is deliberately ASCII rather than an image so it survives in
      a YAML block scalar, diffs readably in review, and renders on the site
      without an asset pipeline. The four placement questions are ordered
      intentionally: capability first (does the signal exist in one request),
      then budget, then recoverability, then failure -- because asking about
      cost before asking whether inline placement is even meaningful is how
      async detectors end up as expensive inline ones.
    code: |
      <!--
      gateway_detection_architecture.md
      Section 0509 -- Production Architecture: AI Security Detection at API Gateway Scale
      20260719 | Detection Engineering: AI Security Detection (Section 0509 Production Gateway Architecture) by Raghav Dinesh
      -->
      # AI Security Detection Reference Architecture

      The gateway is the sensor. Every detector built in Sections 5.4 through 5.8
      attaches to one of four integration points, and where a detector attaches is
      determined by its latency cost and by whether the harm it prevents is
      recoverable after the fact.

      ## Component map

      ```
                              +---------------------------+
         client request  -->  |  LLM GATEWAY (the sensor) |
                              +---------------------------+
                                          |
                    (1) PRE-REQUEST  ..... | ..... assembled context window
                        injection pattern tier        8ms   fail-open
                        jailbreak pattern library     6ms   fail-open
                        injection classifier tier    40ms   fail-open
                                          |
                                          v
                              +---------------------------+
                              |       MODEL ENDPOINT      |
                              +---------------------------+
                                          |
                    (2) TOOL-CALL GATE ... | ..... each requested invocation
                        agent toolcall action log     6ms   FAIL-CLOSED
                                          |
                                          v
                    (3) POST-RESPONSE .... | ..... completion, before delivery
                        output canary scan            4ms   fail-open
                        output beacon exfil           5ms   FAIL-CLOSED
                        output PII pattern           25ms   fail-open
                                          |
         client response <----------------+
                                          |
                                          | (events, never blocking)
                                          v
                              +---------------------------+
                              |  OCSF NORMALISATION (Ch4) |
                              +---------------------------+
                                          |
                                          v
                              +---------------------------+
                              |  PLATFORM: ingest ->      |
                              |  correlate -> alert (Ch2) |
                              +---------------------------+
                                   ^                  ^
                    (4) NEAR-REAL-TIME          ASYNC CORRELATION
                        jailbreak semantic 250ms      multiturn escalation
                        output encoded blob 150ms     staged exfiltration
                                                      extraction scoring
                                                      api abuse rules

              BUILD-TIME (off the request path entirely, Section 5.6)
              pipeline integrity checks    FAIL-CLOSED
              RAG ingestion monitor        FAIL-CLOSED
      ```

      Inline total: **94ms of a 120ms p99 budget**, leaving 26ms of headroom. The
      chain refuses to start if configured inline budgets exceed the cap, so a
      misconfiguration fails at boot rather than silently degrading the request path.

      ## Data flow

      1. The gateway emits `prompt_events`, `completion_events`, `token_accounting`,
         and `tool_call_events` per the Section 5.1 and 5.7 schemas.
      2. Inline detectors run within their budgets and emit findings. Findings carry
         offsets and hashes, never raw values (Section 5.8).
      3. Every finding and event flows through the Chapter 4 OCSF mapping layer into
         the Chapter 2 platform -- the same path as authentication and network
         telemetry. No detector writes to a private console.
      4. Near-real-time and async detectors read from the platform. They never sit in
         the request path, and inline detectors never wait on them.

      ## The four placement questions

      For any new detector, in order:

      1. **Does the signal exist within one request?** If not, it is async by
         construction -- extraction scoring and multi-turn escalation are not
         expensive inline detectors, they are meaningless ones.
      2. **Does it fit the remaining inline headroom at p99 under production
         concurrency?** If not, it runs near-real-time. Headroom is finite; adding
         inline means demoting something else.
      3. **Is the harm recoverable after delivery?** If not, it is an inline
         candidate regardless of preference -- beacon exfiltration and irreversible
         tool calls complete the moment they reach the client.
      4. **What happens when it fails?** Answer before deployment, not during the
         first incident.

      ## Fail policy

      | Policy | Applied to | Rationale |
      |---|---|---|
      | `fail_open` | Injection tiers, jailbreak patterns, canary scan, PII pattern | Another tier or async correlation still sees the request. Availability wins because coverage degrades rather than disappearing. |
      | `fail_closed` | Beacon exfiltration, tool-call gate | Unrecoverable: rendering or execution completes the harm. Cheap and high-precision, which is the only combination justifying it. |
      | `fail_closed` | Build-time checks | Blocking a build costs a pipeline re-run, not a user request. Fail-closed is the default off the request path. |
      | `not_applicable` | Near-real-time and async | Failure delays detection; it cannot affect the request. |

      Every fail-open event emits a `detector_degraded` record. Silent degradation is
      indistinguishable from clean traffic, and a detector failing open for a week is
      an undeclared coverage outage.

      ## Detection-as-code integration

      The chapter ships rule packs (`sigma_prompt_injection_rules.yml`,
      `sigma_poisoning_indicators.yml`, `sigma_api_abuse_rules.yml`,
      `sigma_output_rules.yml`), contracts, pattern libraries, and scorers. All of
      them ride the Chapter 3 pipeline: lint, unit test against the labelled corpora
      from 5.4 and 5.5, integration test, stage, deploy. Two chapter-specific gates
      join the standard pipeline:

      - **Decay gate** (`jailbreak_eval_harness.py`): fails the build when a pattern
        family falls below its declared recall floor.
      - **Closure gate** (`chapter5_coverage_closure_report.py`): fails when a
        coverage matrix row has no implementing detector and no recorded accepted gap.

      ## Explicitly deferred

      - **Throughput, scaling, and cost engineering** -- Chapter 9. This architecture
        states budgets; it does not size infrastructure to meet them.
      - **Response actions** -- Chapter 12. Findings are emitted here; blocking,
        throttling, revocation, and redaction application are policy decisions owned
        by response orchestration.
  deliverable_2:
    title: 'Placement Decision Matrix'
    filename: 'placement_decision_matrix.yaml'
    description: |-
      Every detector from 5.4 through 5.8 plus the tool-call gate assembled
      here, each bound to a tier, a p99 latency budget, a fail policy, the
      risks it covers, and a written rationale -- with a budget model that caps
      the sum of inline budgets.
    implementation_notes: |-
      The covers field is the join key for coverage closure and exists because
      a section-level join over-credits: crediting every risk owned by a section
      to every detector built in that section produced a false active claim for
      LLM06 during construction. Rationales are mandatory because an undefended
      placement decision gets relitigated during the first latency incident,
      and the reasoning needs to be in the artifact rather than in someone
      memory. The tool-call gate is the single component this capstone adds,
      deferred here by Section 5.8.
    code: |
      # placement_decision_matrix.yaml
      # Section 0509 -- Production Architecture: AI Security Detection at API Gateway Scale
      # 20260719 | Detection Engineering: AI Security Detection (Section 0509 Production Gateway Architecture) by Raghav Dinesh
      #
      # Every detector built in 5.4-5.8, placed. Placement is the architecture: a
      # detector that adds unbounded latency to the request path is removed by the
      # platform team before it ever catches an attack. Each row records the tier,
      # the latency budget it must meet to hold that tier, the fail policy decided
      # BEFORE the incident, and the reason -- because an undefended placement
      # decision gets relitigated during the first outage.
      matrix_version: '1.0'
      budget_model:
        total_inline_budget_ms: 120
        rule: >
          The sum of p99 budgets for inline detectors must not exceed
          total_inline_budget_ms. This is a hard constraint, not a target: adding an
          inline detector requires either fitting the remaining headroom or demoting
          another. That forced tradeoff is the point.
        measurement: 'p99 at the gateway, measured under production concurrency, not p50 on a laptop'
      fail_policy_definitions:
        fail_open: 'On detector timeout or error, allow the request and emit a degradation event. Availability preserved, coverage temporarily lost.'
        fail_closed: 'On detector timeout or error, block the request. Coverage preserved, availability at risk.'
        not_applicable: 'Detector is not in the request path; failure delays detection but cannot affect the request.'
      detectors:
        injection_pattern_tier:
          covers: ['LLM01', 'LLM08']
          source_section: '5.4'
          artifact: 'sigma_prompt_injection_rules.yml'
          tier: 'inline'
          latency_budget_p99_ms: 8
          fail_policy: 'fail_open'
          rationale: >
            Cheap deterministic regex over the context window. Earns inline placement
            on cost and explainability. Fail-open because the classifier tier and the
            async correlation both still see the request.
        injection_classifier_tier:
          covers: ['LLM01', 'LLM08']
          source_section: '5.4'
          artifact: 'injection_classifier_contract.yaml'
          tier: 'inline'
          latency_budget_p99_ms: 40
          fail_policy: 'fail_open'
          rationale: >
            The contract already specifies fail_open_to_pattern_layer on timeout.
            Inline because indirect injection must be caught before the model acts on
            retrieved content, and post-hoc detection of a successful injection is an
            incident rather than a prevention.
        jailbreak_pattern_library:
          covers: ['LLM01']
          source_section: '5.5'
          artifact: 'jailbreak_pattern_library.yaml'
          tier: 'inline'
          latency_budget_p99_ms: 6
          fail_policy: 'fail_open'
          rationale: 'Structural signal matching; same cost profile as the injection pattern tier.'
        jailbreak_semantic_scorer:
          covers: ['LLM01']
          source_section: '5.5'
          artifact: 'semantic_distance_scorer.py'
          tier: 'near_real_time'
          latency_budget_p99_ms: 250
          fail_policy: 'not_applicable'
          rationale: >
            Embedding inference plus centroid comparison does not fit the inline
            budget alongside the injection classifier. Demoted deliberately: a
            jailbreak detected 200ms after the response still drives suspension and
            conversation review, whereas an injection detected late has already acted.
        jailbreak_multiturn_correlation:
          covers: ['LLM01']
          source_section: '5.5'
          artifact: 'multiturn_correlation_rule.yaml'
          tier: 'async'
          latency_budget_p99_ms: null
          fail_policy: 'not_applicable'
          rationale: >
            Stateful over a 12-turn window. Cannot be inline by construction -- the
            detected object is a sequence that does not exist yet at request time.
        output_pii_pattern:
          covers: ['LLM02']
          source_section: '5.8'
          artifact: 'output_monitoring_pipeline.py (inline tier checks)'
          tier: 'inline'
          latency_budget_p99_ms: 25
          fail_policy: 'fail_open'
          rationale: >
            Checksum-validated pattern checks for cards and credentials. Inline
            because the redaction map is only useful before the response is
            delivered. Matches the PII contract service level.
        output_beacon_exfil:
          covers: ['LLM02', 'LLM05']
          source_section: '5.8'
          artifact: 'output_monitoring_pipeline.py (exfil.markdown_beacon)'
          tier: 'inline'
          latency_budget_p99_ms: 5
          fail_policy: 'fail_closed'
          rationale: >
            THE EXCEPTION. Zero-click exfiltration completes when the client renders
            the response -- there is no post-hoc mitigation, the data is already
            gone. Cheap, high-precision, and unrecoverable if missed, which is the
            only combination that justifies fail-closed.
        output_encoded_blob:
          covers: ['LLM02']
          source_section: '5.8'
          artifact: 'output_monitoring_pipeline.py (near_real_time tier)'
          tier: 'near_real_time'
          latency_budget_p99_ms: 150
          fail_policy: 'not_applicable'
          rationale: 'Context-sensitive scanning; medium severity and recoverable after delivery.'
        output_canary_scan:
          covers: ['LLM07']
          source_section: '5.8'
          artifact: 'system_prompt_canary_kit.py'
          tier: 'inline'
          latency_budget_p99_ms: 4
          fail_policy: 'fail_open'
          rationale: >
            Exact substring match against a small registry -- trivially cheap. The
            template fingerprint half runs near-real-time; only the exact canary
            check is inline.
        staged_exfil_correlation:
          covers: ['LLM02']
          source_section: '5.8'
          artifact: 'sigma_output_rules.yml (rule 4)'
          tier: 'async'
          latency_budget_p99_ms: null
          fail_policy: 'not_applicable'
          rationale: 'Counts findings per conversation over 30m. Sequence detection, not request detection.'
        extraction_scoring:
          covers: ['LLM10']
          source_section: '5.7'
          artifact: 'extraction_detector.py'
          tier: 'async'
          latency_budget_p99_ms: null
          fail_policy: 'not_applicable'
          rationale: >
            Per-identity baselines over windows. Inline placement is not merely
            expensive but meaningless: the signal does not exist within one request.
        api_abuse_rules:
          covers: ['LLM10']
          source_section: '5.7'
          artifact: 'sigma_api_abuse_rules.yml'
          tier: 'async'
          latency_budget_p99_ms: null
          fail_policy: 'not_applicable'
          rationale: 'Aggregate correlation over identity windows, including a 21-day slow-burn rule.'
        pipeline_integrity_checks:
          covers: ['LLM03', 'LLM04']
          source_section: '5.6'
          artifact: 'artifact_integrity_checker.py'
          tier: 'build_time'
          latency_budget_p99_ms: null
          fail_policy: 'fail_closed'
          rationale: >
            Not on the request path at all -- runs in CI before a model ships.
            Fail-closed is free here: blocking a build costs a pipeline re-run, not a
            user request. This is where fail-closed belongs by default.
        rag_ingestion_monitor:
          covers: ['LLM03', 'LLM04']
          source_section: '5.6'
          artifact: 'rag_ingestion_monitor.py'
          tier: 'build_time'
          latency_budget_p99_ms: null
          fail_policy: 'fail_closed'
          rationale: 'Batch quarantine at the ingestion stage boundary; rejection is cheap before indexing.'
        agent_toolcall_action_log:
          covers: ['LLM06', 'LLM05']
          source_section: '5.9'
          artifact: 'gateway_reference_config.yaml (tool_call_rules)'
          tier: 'inline'
          latency_budget_p99_ms: 6
          fail_policy: 'fail_closed'
          rationale: >
            Deferred here by Section 5.8 and assembled by the capstone. Tool calls
            are ACTIONS, not text: a hijacked agent invoking a destructive or
            exfiltrating function cannot be un-invoked after the fact, which puts it
            in the same unrecoverable class as the beacon check. Cheap allowlist and
            argument checks against the declared tool contract, so fail-closed costs
            little and prevents an irreversible action.
        covers_note: >
          The covers field is the join key for coverage closure, and it exists
          because a section-level join over-credits: crediting every LLM row owned by
          a section to every detector built in that section produced a FALSE active
          claim for LLM06 during construction. Coverage is per detector, per risk --
          the same discipline as the Section 5.2 Sigma tag convention.
  deliverable_3:
    title: 'Gateway Reference Configuration'
    filename: 'gateway_reference_config.yaml'
    description: |-
      Deployable configuration wiring every placed detector into the gateway
      filter chain by stage, with budgets and fail policies matching the
      placement matrix, the tool-call rule definitions, the normalisation path,
      the state-sharing rule, and degradation emission.
    implementation_notes: |-
      Nothing here is a detector -- all of them ship from 5.4 through 5.8 --
      which is the point: assembly is configuration, so a placement change is a
      config pull request rather than a gateway release. The boot-time budget
      check is the enforcement mechanism from part 2: a chain whose configured
      inline budgets exceed the cap refuses to start, converting a silent
      latency regression into a staging failure. Validation asserts that every
      detector in the placement matrix is wired and that budgets agree between
      the two files.
    code: |
      # gateway_reference_config.yaml
      # Section 0509 -- Production Architecture: AI Security Detection at API Gateway Scale
      # 20260719 | Detection Engineering: AI Security Detection (Section 0509 Production Gateway Architecture) by Raghav Dinesh
      #
      # Deployable configuration wiring every Chapter 5 detector into the gateway.
      # The placement matrix decides WHERE each detector runs; this file is how that
      # decision is expressed to the runtime. Nothing here is a detector -- they all
      # ship from 5.4-5.8 -- which is the point: assembly is configuration, so a
      # placement change is a config PR rather than a code change.
      config_version: '1.0'
      gateway:
        deployment: 'sidecar or in-process filter chain in front of the model endpoint'
        emits: ['prompt_events', 'completion_events', 'token_accounting', 'tool_call_events']
        schema_refs:
          prompt_and_completion: 'ocsf_genai_event_schema.yaml (Section 5.1)'
          consumption: 'token_accounting_schema.yaml (Section 5.7)'
        budget:
          total_inline_p99_ms: 120
          enforcement: >
            The chain refuses to start if the sum of configured inline budgets
            exceeds total_inline_p99_ms. A misconfiguration that would silently
            degrade the request path fails at boot instead.
      stages:
        pre_request:
          description: 'Runs on the assembled context window before the model is called'
          detectors:
            - name: 'injection_pattern_tier'
              budget_ms: 8
              on_failure: 'fail_open'
              scope: 'all context sources, tagged by source_type'
            - name: 'jailbreak_pattern_library'
              budget_ms: 6
              on_failure: 'fail_open'
              scope: 'user_turn'
            - name: 'injection_classifier_tier'
              budget_ms: 40
              on_failure: 'fail_open'
              scope: 'all context sources'
              notes: 'contract specifies fail_open_to_pattern_layer; the chain honours it'
        post_response:
          description: 'Runs on the completion before delivery'
          detectors:
            - name: 'output_canary_scan'
              budget_ms: 4
              on_failure: 'fail_open'
            - name: 'output_beacon_exfil'
              budget_ms: 5
              on_failure: 'fail_closed'
              notes: 'the one unrecoverable output case -- rendering completes the exfiltration'
            - name: 'output_pii_pattern'
              budget_ms: 25
              on_failure: 'fail_open'
              emits: 'redaction_map for the response layer; detection never applies it'
        tool_call_gate:
          description: 'Runs on each tool invocation the model requests, before execution'
          detectors:
            - name: 'agent_toolcall_action_log'
              budget_ms: 6
              on_failure: 'fail_closed'
          tool_call_rules:
            allowlist_check: 'function must appear in the application declared tool contract'
            argument_checks:
              - 'destination hosts in arguments must match the tool contract allowlist'
              - 'argument size beyond the contract maximum is a finding'
              - 'encoded blobs in arguments are a finding (reuses the 5.8 encoded-blob check)'
            irreversibility_rule: >
              Tools declared irreversible in the contract (delete, transfer, send)
              require a passing verdict; there is no post-hoc mitigation for an
              executed destructive call.
        near_real_time:
          description: 'Runs off the request path within seconds; cannot affect the response'
          detectors:
            - name: 'jailbreak_semantic_scorer'
              budget_ms: 250
            - name: 'output_encoded_blob'
              budget_ms: 150
        async_correlation:
          description: 'Platform correlation engine over normalised events (Chapter 2)'
          detectors:
            - name: 'jailbreak_multiturn_correlation'
            - name: 'staged_exfil_correlation'
            - name: 'extraction_scoring'
            - name: 'api_abuse_rules'
      build_time:
        description: 'Not on the request path -- CI and ingestion pipeline gates (Section 5.6)'
        detectors:
          - name: 'pipeline_integrity_checks'
            on_failure: 'fail_closed'
          - name: 'rag_ingestion_monitor'
            on_failure: 'fail_closed'
      normalisation:
        path: 'gateway -> OCSF mapping layer (Chapter 4) -> ingest -> correlate -> alert (Chapter 2)'
        rule: >
          Every detector finding is normalised and lands in the same platform as
          authentication and network telemetry. No detector writes to a private
          console. This is what makes cross-domain correlation expressible -- an
          injection finding followed by anomalous tool calls under one identity is a
          single query, not an integration project.
      state_sharing:
        rule: >
          Tiers share state through the platform, never through the request path. An
          inline detector never waits on a correlation lookup; correlation reads the
          events inline detectors emitted. Coupling them would put async latency into
          the request path, which is how a tiered architecture collapses back into a
          slow one.
      degradation:
        emit_on_failure: 'detector_degraded event with detector name, tier, and reason'
        rule: >
          Every fail_open event is recorded. Silent degradation is indistinguishable
          from clean traffic, and a detector that has been failing open for a week is
          a coverage outage nobody declared.
      deferred:
        throughput_and_cost: 'Chapter 9 -- horizontal scaling, caching, and cost engineering for this pipeline'
        response_actions: 'Chapter 12 -- what happens after a finding (block, throttle, revoke, redact)'
  deliverable_4:
    title: 'Chapter 5 Coverage Closure Report'
    filename: 'chapter5_coverage_closure_report.py'
    description: |-
      Recomputes the Section 5.2 coverage matrix from shipped detectors by
      joining it to the placement matrix on per-detector risk coverage, reports
      each row as active, partial, accepted gap, or open, and exits non-zero
      when any row lacks both an implementing detector and a recorded accepted
      gap.
    implementation_notes: |-
      Single quotes throughout per book convention. The join is per detector,
      per risk -- never per section -- for the reason recorded in the module
      docstring and part 5: the section-level version manufactured a false
      active status for LLM06. The report deliberately prints ten of ten
      ACCOUNTED FOR rather than covered, and preserves the accepted gap and
      partial statuses from Section 5.2 rather than upgrading them now that the
      chapter has detectors to show. Verified in both directions: exit 0 against
      the full placement matrix, exit 1 when the tool-call gate is removed.
    code: |
      #!/usr/bin/env python3
      # chapter5_coverage_closure_report.py
      # Section 0509 -- Production Architecture: AI Security Detection at API Gateway Scale
      # 20260719 | Detection Engineering: AI Security Detection (Section 0509 Production Gateway Architecture) by Raghav Dinesh
      # Single quotes throughout per book convention
      '''Regenerate the Section 5.2 coverage matrix with implemented-detection status.

      Section 5.2 built the matrix with every row marked 'planned'. Sections 5.4
      through 5.8 built the detectors. This report closes the loop by JOINING those
      two artifacts -- the matrix and the placement decision matrix -- so the
      coverage claim is COMPUTED from shipped detectors rather than asserted by an
      author who remembers building them.

      The join key is the owning section recorded in each matrix row. A row claims
      'active' only when the placement matrix contains at least one detector
      sourced from that section. Rows with no implementing detector stay planned;
      accepted gaps stay accepted gaps and are reported in capitals.

      Exit code 1 when any row that should be closed is not, so the report works as
      a chapter-completion CI gate rather than a document.
      '''
      from __future__ import annotations

      import sys

      import yaml


      def detectors_by_risk(placement: dict) -> dict:
          '''Map risk id -> detectors that explicitly declare covering it.

          The join key is the per-detector covers list, NOT the owning section. An
          earlier version of this report joined on section and produced a FALSE
          active claim: every detector built in a section was credited to every risk
          that section owned, so output-content detectors appeared to cover excessive
          agency. Coverage is per detector, per risk -- the same discipline as the
          Section 5.2 Sigma tag convention.
          '''
          out: dict = {}
          for name, spec in placement['detectors'].items():
              if not isinstance(spec, dict) or 'covers' not in spec:
                  continue
              for rid in spec['covers']:
                  out.setdefault(rid, []).append(name)
          return out


      def main() -> int:
          matrix_path = sys.argv[1] if len(sys.argv) > 1 else 'owasp_llm_top10_coverage_matrix.yaml'
          placement_path = sys.argv[2] if len(sys.argv) > 2 else 'placement_decision_matrix.yaml'
          matrix = yaml.safe_load(open(matrix_path))
          placement = yaml.safe_load(open(placement_path))
          built = detectors_by_risk(placement)
          placed = [k for k, v in placement['detectors'].items()
                    if isinstance(v, dict) and 'covers' in v]

          pin = matrix['framework_pin']
          print('coverage closure -- ' + pin['framework'] + ' ' + pin['edition'])
          print('detectors placed: ' + str(len(placed))
                + ' | risks with at least one detector: ' + str(len(built)))
          print('=' * 78)

          counts = {'active': 0, 'partial': 0, 'accepted_gap': 0, 'open': 0}
          unclosed = []

          for rid, row in sorted(matrix['coverage_matrix'].items()):
              declared = row['status']
              detectors = sorted(built.get(rid, []))

              if declared == 'accepted_gap':
                  state = 'ACCEPTED_GAP'
                  counts['accepted_gap'] += 1
              elif not detectors:
                  state = 'OPEN'
                  counts['open'] += 1
                  unclosed.append(rid)
              elif declared == 'partial-by-design':
                  state = 'PARTIAL'
                  counts['partial'] += 1
              else:
                  state = 'ACTIVE'
                  counts['active'] += 1

              print(rid + '  ' + row['name'][:36].ljust(38) + state)
              if detectors:
                  print('      detectors: ' + ', '.join(detectors))
              else:
                  print('      detectors: none -- ' + str(row['detection_method'])[:60])

          print('=' * 78)
          total = sum(counts.values())
          print('active=' + str(counts['active'])
                + '  partial=' + str(counts['partial'])
                + '  accepted_gap=' + str(counts['accepted_gap'])
                + '  open=' + str(counts['open'])
                + '   (of ' + str(total) + ' rows)')

          # The honest closure statement. NOT 'ten of ten covered'.
          closed = counts['active'] + counts['partial'] + counts['accepted_gap']
          print('\naccounted for: ' + str(closed) + '/' + str(total)
                + ' -- every row is either implemented, partial by design, or a')
          print('recorded accepted gap. Coverage is CLAIMED only where a detector exists;')
          print('LLM09 remains an accepted gap because factuality is not an event property,')
          print('and LLM08 stays partial because the weakness is architectural while only')
          print('its exploitation path emits telemetry.')

          if unclosed:
              print('\nOPEN ROWS (no implementing detector found): ' + ', '.join(unclosed))
              print('Chapter 5 does not close. Either build the detector or record an')
              print('accepted gap with a rationale -- silence is not a third option.')
              return 1
          return 0


      if __name__ == '__main__':
          sys.exit(main())
common_mistakes:
  mistake_1:
    description: |-
      Placing detectors inline by importance -- reasoning that a critical
      detector belongs in the request path because it matters.
    why_it_happens: |-
      Severity is the axis security teams already rank by, inline placement
      feels like the strong choice, and the latency cost is invisible until
      production concurrency reveals it.
    consequence: |-
      The request path accumulates expensive detectors until the platform team
      measures a latency regression, investigates it as a performance incident,
      and removes the security components. The most important detector is
      deleted first because it was the most expensive.
    correct_approach: |-
      Place by capability, budget, and recoverability in that order. Ask whether
      the signal even exists within one request, then whether it fits the
      remaining headroom, then whether the harm is recoverable after delivery --
      and cap the total so adding inline forces an explicit demotion.
  mistake_2:
    description: |-
      Mapping fail policy onto severity: important detectors fail closed, minor
      ones fail open.
    why_it_happens: |-
      It reads as the security-conscious default, and fail-closed sounds like
      the answer a security review wants to hear.
    consequence: |-
      A classifier having a bad afternoon takes the product down. The
      architecture converts a hypothetical compromise into a certain outage, and
      the response is an emergency change disabling the detector entirely --
      which is worse than fail-open would have been.
    correct_approach: |-
      Decide on recoverability. Fail open where another tier or async
      correlation still sees the request; fail closed only where the harm
      completes on delivery or execution and the check is cheap and precise.
      Off the request path, fail closed by default because blocking is cheap.
  mistake_3:
    description: |-
      Letting inline detectors query the correlation engine for historical
      context at request time.
    why_it_happens: |-
      The state genuinely improves inline decisions, it already exists in the
      platform, and a single lookup looks inexpensive in isolation.
    consequence: |-
      Platform query latency lands inside the request budget. The tiered
      architecture becomes a slow monolithic one, the boot-time budget check
      starts failing for reasons nobody can trace to a config change, and p99
      degrades under exactly the load where it matters.
    correct_approach: |-
      Share state through the platform in one direction only: correlation reads
      what inline detectors emitted, never the reverse. Where inline decisions
      need history, push it to the gateway as cached state on a refresh cycle
      rather than pulling on demand.
  mistake_4:
    description: |-
      Computing coverage closure by joining a framework matrix to detectors at
      section granularity.
    why_it_happens: |-
      The matrix already records an owning section per row, so the join is free,
      and it produces a satisfying all-green result that looks like diligence.
    consequence: |-
      Manufactured coverage. Every detector built in a section is credited to
      every risk that section owns, so unrelated detectors close rows they have
      nothing to do with -- this section produced a confident ACTIVE for
      excessive agency credited to output-content detectors, in the very report
      meant to prevent false claims.
    correct_approach: |-
      Have each detector declare the risks it covers and join on that, mirroring
      the Section 5.2 Sigma tag convention. Coverage is per detector, per risk,
      and a join at the wrong granularity is most convincing in the artifact
      everyone trusts.
  mistake_5:
    description: |-
      Failing open without emitting a degradation event.
    why_it_happens: |-
      Fail-open is the safe default and the request succeeded, so nothing looks
      broken. The detector timeout is a debug-level line in a gateway log
      nobody reads.
    consequence: |-
      Silent coverage loss. A detector failing open for a week is
      indistinguishable from a week of clean traffic, and the coverage matrix
      keeps reporting the row as active while nothing has been inspected.
    correct_approach: |-
      Emit a detector_degraded event on every fail-open, alert on sustained
      degradation, and treat a detector that has been failing open as a declared
      coverage outage with an owner -- not as a successful request.

section_summary:
  compact: |-
    The capstone assembles every Chapter 5 detector into one gateway
    architecture with four integration points that differ in capability, not
    just cost: pre-request can prevent injection, the tool-call gate can stop an
    irreversible action, post-response can redact and stop rendering-triggered
    harm, and off-path can only detect. Placement follows four ordered questions
    -- does the signal exist within one request, does it fit the remaining
    headroom, is the harm recoverable, and what happens on failure -- enforced
    by a 120ms inline cap that the gateway refuses to start without satisfying,
    currently consuming 94ms across seven detectors. Fail policy is decided by
    recoverability rather than severity, so most detectors fail open while
    beacon exfiltration and the tool-call gate fail closed because the harm
    completes on delivery or execution, and build-time checks fail closed
    because blocking a build is cheap. Every finding normalises through the
    Chapter 4 OCSF layer into the Chapter 2 platform, tiers share state in one
    direction only, and assembly is configuration so placement changes are
    config pull requests. The closure report recomputes the Section 5.2 matrix
    from shipped detectors and reports ten of ten accounted for -- eight active,
    one partial by design, one accepted gap -- a join that had to be corrected
    from section granularity to per-risk granularity after it manufactured a
    false active status for excessive agency.
  key_takeaways:
  - 'Placement is survival: a detector that adds unbounded latency to the
    request path is removed by the platform team before it ever catches an
    attack, and removed for correct reasons'
  - 'The four integration points differ in capability, not just cost -- only
    pre-request prevents injection, only the tool-call gate stops an
    irreversible action, and off-path can never do either'
  - 'A capped inline budget enforced at boot is a design mechanism, not a
    performance target: it forces an explicit demotion every time something new
    goes inline'
  - 'Fail policy follows recoverability, not severity -- fail closed only where
    harm completes on delivery or execution and the check is cheap and precise;
    off the request path, fail closed by default'
  - 'Tiers share state through the platform in one direction only; an inline
    detector that queries correlation has quietly rebuilt a monolith'
  - 'Compute coverage closure from shipped detectors at per-risk granularity --
    a section-level join manufactures coverage, and it does so most
    convincingly in the report meant to prevent false claims'

preview_section_05_10:
  title: 'Chapter 5 Summary: AI Security Detection and Chapter 6 Preview'
  summary: |-
    Every detector is built and placed, and the coverage map is closed. Section
    5.10 consolidates the chapter: the AI security detection stack with its tier
    placement, the unified OWASP and ATLAS coverage view as the chapter
    measurable outcome, the consolidated Sigma rule pack feeding Appendix B.3,
    the common mistakes reference gathered from all nine sections, and a
    knowledge assessment against the chapter completion criteria. It then hands
    off to Chapter 6, where the same discipline -- telemetry first, frameworks
    as coverage maps, layered detectors, measured placement -- meets the cloud,
    API, and serverless attack surfaces that traditional detection tooling has
    not caught up to either.

