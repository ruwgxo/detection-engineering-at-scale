      - 'Hostile instructions present in the user turn or in any content
        assembled into the context window'
      - 'prompt_events'
    - - 'LLM02'
      - 'Sensitive Information Disclosure'
      - 'Content in a completion that policy says must not leave -- PII,
        secrets, privileged business data'
      - 'completion_events'
    - - 'LLM03'
      - 'Supply Chain'
      - 'A model, dataset, or adapter entering the pipeline without verifiable
        provenance, or a registry mutation outside the sanctioned path'
      - 'pipeline_provenance'
    - - 'LLM04'
      - 'Data and Model Poisoning'
      - 'Statistical integrity indicators at pipeline stage boundaries --
        distribution shift, label anomalies, trigger patterns -- or canary
        drift post-deployment'
