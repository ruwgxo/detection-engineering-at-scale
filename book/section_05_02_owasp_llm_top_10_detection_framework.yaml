      - 'Invisible per event; visible as deviation from a per-entity baseline'
      - 'Baselines built and refreshed; anomaly scoring deployed with
        allowlist mechanism'
      - 'LLM06, LLM10'
    - - 'statistical'
      - 'Batch judgement at a pipeline stage boundary, not a streaming
        detection'
      - 'Integrity gates wired into the pipeline; canaries maintained'
