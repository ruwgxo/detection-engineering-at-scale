      - 'Improper Output Handling'
      - 'A completion flowing into an execution or rendering sink without the
        sanctioned validation step'
      - 'completion_events, tool_call_events'
    - - 'LLM06'
      - 'Excessive Agency'
      - 'Tool invocations outside the identity''s or application''s established
        action envelope'
      - 'tool_call_events'
    - - 'LLM07'
      - 'System Prompt Leakage'
      - 'A system-prompt canary marker appearing in any completion; extraction-
        attempt patterns on the prompt side'
      - 'completion_events, prompt_events'
    - - 'LLM08'
      - 'Vector and Embedding Weaknesses'
      - 'The weakness itself is architectural; its exploitation path is
        indirect injection through retrieved content, visible in tagged
        context sources'
