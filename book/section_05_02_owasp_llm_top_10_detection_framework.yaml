    - - 'LLM09'
      - 'Misinformation'
      - 'No security-event observable -- factuality is not a telemetry
        property; owned by evaluation and grounding controls'
      - 'none (accepted gap)'
    - - 'LLM10'
      - 'Unbounded Consumption'
      - 'Per-identity consumption exceeding its own or its peer group''s
        baseline envelope'
      - 'token_accounting'
  table_2:
    title: 'Detectability Classes'
    description: |-
      The six classes the matrix uses, what membership means for the detector,
      and which risks land in each. The class determines what the word
      'covered' is allowed to mean for a row.
    columns:
    - 'Class'
    - 'Definition'
    - 'What ''covered'' means'
    - 'Risks in class'
    rows:
    - - 'rule'
      - 'Deterministic logic over single events captures the observable well'
