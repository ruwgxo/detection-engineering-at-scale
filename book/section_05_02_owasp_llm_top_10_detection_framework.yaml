deliverables:
  deliverable_1:
    title: 'OWASP LLM Top 10 Coverage Matrix'
    filename: 'owasp_llm_top10_coverage_matrix.yaml'
    description: |-
      The living coverage artifact: all ten risks of the pinned edition bound
      to their telemetry requirements, detectability class, detection method
      family, owning section, and status, under a framework_pin block that
      records the edition, pin date, and recheck cadence. This is the machine
      view the gap report renders and the CI pipeline validates.
    implementation_notes: |-
      The telemetry identifiers are the exact family names from the Section
      5.1 inventory -- the gap report computes reachability by set arithmetic
      on them, so prose approximations break the tooling. Statuses come from
      the closed set defined in part 5; 'blocked' is never written into this
      file because it is computed per environment by the gap report. Changes
      to this file travel by pull request only, so coverage history is git
      history.
    code: |
      # owasp_llm_top10_coverage_matrix.yaml
      # Section 0502 -- OWASP LLM Top 10 as a Detection Framework
      # 20260716 | Detection Engineering: AI Security Detection (Section 0502 OWASP LLM Top 10 as Detection Framework) by Raghav Dinesh
      #
      # The living coverage artifact for Chapter 5. Framework version is PINNED:
      # detections bind to attack classes; risk IDs cite the pinned edition.
      framework_pin:
        framework: 'OWASP Top 10 for LLM Applications'
        edition: '2025 (v2.0)'
        designation_style: 'LLM01:2025 .. LLM10:2025'
        pinned_on: '2026-07-16'
        recheck: 'quarterly and before publication (book market_currency cadence)'
      coverage_matrix:
        LLM01:
          name: 'Prompt Injection'
          detectability_class: 'hybrid'
          required_telemetry: ['prompt_events']
          detection_method: 'regex prefilter + classifier scoring (tiered)'
          owning_section: '5.4'
          status: 'planned'
        LLM02:
          name: 'Sensitive Information Disclosure'
          detectability_class: 'hybrid'
          required_telemetry: ['completion_events']
          detection_method: 'output PII/secret scoring, pattern + NER tiers'
          owning_section: '5.8'
          status: 'planned'
        LLM03:
          name: 'Supply Chain'
          detectability_class: 'rule'
          required_telemetry: ['pipeline_provenance']
          detection_method: 'provenance verification rules + registry mutation alerts'
          owning_section: '5.6'
          status: 'planned'
        LLM04:
          name: 'Data and Model Poisoning'
          detectability_class: 'statistical'
          required_telemetry: ['pipeline_provenance']
          detection_method: 'stage-boundary integrity gates + behavioural canaries'
          owning_section: '5.6'
          status: 'planned'
        LLM05:
          name: 'Improper Output Handling'
          detectability_class: 'rule'
          required_telemetry: ['completion_events', 'tool_call_events']
          detection_method: 'output-consumption path rules (exec/render sinks)'
          owning_section: '5.8'
          status: 'planned'
        LLM06:
          name: 'Excessive Agency'
          detectability_class: 'behavioral'
          required_telemetry: ['tool_call_events']
          detection_method: 'action-log rules + tool-call baselines'
          owning_section: '5.8-5.9'
          status: 'planned'
        LLM07:
          name: 'System Prompt Leakage'
          detectability_class: 'rule'
          required_telemetry: ['completion_events', 'prompt_events']
          detection_method: 'system-prompt canary markers scanned in outputs + extraction-attempt patterns'
          owning_section: '5.8 (attempt patterns: 5.4)'
          status: 'planned'
        LLM08:
          name: 'Vector and Embedding Weaknesses'
          detectability_class: 'architectural'
          required_telemetry: ['prompt_events']
          detection_method: 'context-source scoring covers exploitation path (indirect injection); weakness itself is an architecture control'
          owning_section: '5.4 (exploitation path only)'
          status: 'partial-by-design'
        LLM09:
          name: 'Misinformation'
          detectability_class: 'not-detection-shaped'
          required_telemetry: []
          detection_method: 'none -- evaluation/grounding process control; recorded as accepted gap'
          owning_section: 'accepted_gap'
          status: 'accepted_gap'
        LLM10:
          name: 'Unbounded Consumption'
          detectability_class: 'behavioral'
          required_telemetry: ['token_accounting']
          detection_method: 'per-identity consumption baselines + rate anomaly scoring'
          owning_section: '5.7'
          status: 'planned'
  deliverable_2:
    title: 'Coverage Gap Report'
    filename: 'coverage_gap_report.py'
    description: |-
      Renders the coverage matrix into a per-environment gap report. Takes the
      matrix and an environment declaration listing which telemetry families
      the pipeline actually emits, and classifies every risk as REACHABLE,
      BLOCKED (with the missing families named), or ACCEPTED_GAP. Exits
      non-zero when anything is BLOCKED, so the report doubles as a CI check
      and its output doubles as the telemetry onboarding work queue.
    implementation_notes: |-
      Single quotes throughout per book convention. Uses PyYAML (the book's
      standard format library, in the repo's requirements) rather than pure
      standard library. Reachability is set arithmetic: a risk is REACHABLE
      only when every required telemetry family is present in the environment
      declaration -- which is why the matrix must use the exact Section 5.1
      family identifiers. Accepted gaps pass through explicitly and are
      counted in the summary; they are never silently dropped, because
      visibility of the gap is the point.
    code: |
      #!/usr/bin/env python3
      # coverage_gap_report.py
      # Section 0502 -- OWASP LLM Top 10 as a Detection Framework
      # 20260716 | Detection Engineering: AI Security Detection (Section 0502 OWASP LLM Top 10 as Detection Framework) by Raghav Dinesh
      # Single quotes throughout per book convention
      '''Render the LLM Top 10 coverage matrix into a gap report for one environment.

      Usage:
          coverage_gap_report.py matrix.yaml environment.yaml

      The environment file declares which telemetry families the pipeline actually
      emits (the Section 5.1 inventory). A risk is REACHABLE only when every
      telemetry family it requires is present; otherwise it is BLOCKED regardless
      of rule inventory. Accepted gaps pass through explicitly -- silence is the
      failure mode this report exists to prevent.
      '''
      from __future__ import annotations

      import sys

      import yaml


      def classify(risk: dict, available: set[str]) -> str:
          if risk['status'] == 'accepted_gap':
              return 'ACCEPTED_GAP'
          needed = set(risk['required_telemetry'])
          missing = needed - available
          if missing:
              return 'BLOCKED (missing: ' + ', '.join(sorted(missing)) + ')'
          return 'REACHABLE (' + risk['status'] + ')'


      def main() -> int:
          if len(sys.argv) != 3:
              print('usage: coverage_gap_report.py matrix.yaml environment.yaml')
              return 2
          with open(sys.argv[1]) as fh:
              matrix = yaml.safe_load(fh)
          with open(sys.argv[2]) as fh:
              env = yaml.safe_load(fh)

          available = set(env.get('available_telemetry', []))
          pin = matrix['framework_pin']
          print('framework: ' + pin['framework'] + ' -- ' + pin['edition']
                + ' (pinned ' + pin['pinned_on'] + ')')
          print('environment: ' + env.get('name', 'unnamed'))
          print('-' * 72)

          counts: dict[str, int] = {}
          for rid, risk in matrix['coverage_matrix'].items():
              verdict = classify(risk, available)
              bucket = verdict.split(' ')[0]
              counts[bucket] = counts.get(bucket, 0) + 1
              line = rid.ljust(7) + risk['name'].ljust(38) + verdict
              print(line)
              if bucket == 'BLOCKED':
                  print(' ' * 7 + 'owner: ' + str(risk['owning_section'])
                        + ' -- unblock by onboarding the missing family')
          print('-' * 72)
          summary = ', '.join(k.lower() + '=' + str(v) for k, v in sorted(counts.items()))
          print('summary: ' + summary)
          print('rule: every risk is covered by a tested detection or recorded as an')
          print('accepted gap. BLOCKED entries are neither -- they are the work queue.')
          return 0 if 'BLOCKED' not in counts else 1


      if __name__ == '__main__':
          sys.exit(main())
  deliverable_3:
    title: 'Risk Detectability Reference'
    filename: 'risk_detectability_reference.md'
    description: |-
      The per-risk detectability classification with its rationale written
      out -- the document a reviewer reads when challenging why a row carries
      the class it does, and the template for classifying entries of future
      framework editions.
    implementation_notes: |-
      Kept as a standalone markdown reference rather than folded into the
      matrix YAML so the rationale prose can breathe and be reviewed as prose.
      The classification here and the detectability_class fields in the matrix
      must agree; the CI check that enforces matrix invariants includes a
      cross-check against this file's class table.
    code: |
      <!--
      risk_detectability_reference.md
      Section 0502 -- OWASP LLM Top 10 as a Detection Framework
      20260716 | Detection Engineering: AI Security Detection (Section 0502 OWASP LLM Top 10 as Detection Framework) by Raghav Dinesh
      -->
      # Risk Detectability Reference -- OWASP LLM Top 10 (2025 edition, pinned 2026-07-16)

      The class determines what 'covered' is allowed to mean for a risk. A
      challenge to any classification below is a pull request against this
      file; the matrix and this reference must agree.

      | Risk | Class | Rationale |
      |---|---|---|
      | LLM01 Prompt Injection | hybrid | Known technique families are cheap deterministic catches; novel phrasings require learned scoring. Neither tier alone meets the false-negative or explainability bar. |
      | LLM02 Sensitive Information Disclosure | hybrid | Structured identifiers (keys, card numbers) are pattern-detectable; contextual PII requires NER-class methods. Per-data-class method choice, so the row is hybrid. |
      | LLM03 Supply Chain | rule | Provenance is verifiable deterministically: an artifact either carries a valid chain or it does not; a registry mutation is either sanctioned or not. |
      | LLM04 Data and Model Poisoning | statistical | Poisoning indicators are distribution-level claims about datasets, judged in batch at stage boundaries -- not per-event logic. |
      | LLM05 Improper Output Handling | rule | A completion reaching an execution or rendering sink without the sanctioned validation step is a deterministic path property. |
      | LLM06 Excessive Agency | behavioral | No single tool call is 'excessive'; the property exists only against an action-envelope baseline per identity and application. |
      | LLM07 System Prompt Leakage | rule | A canary marker in a completion is the cleanest deterministic observable on the list. Extraction-attempt patterns on the prompt side ride the 5.4 tiers. |
      | LLM08 Vector and Embedding Weaknesses | architectural | The weakness is a design property of the retrieval layer and emits no events. Its exploitation path (indirect injection) is covered by 5.4; the row is partial-by-design. |
      | LLM09 Misinformation | not-detection-shaped | Factuality is not a property any telemetry family carries. Owned by evaluation and grounding controls. Accepted gap, rationale on record -- do not build the keyword rule. |
      | LLM10 Unbounded Consumption | behavioral | Abuse is a consumption-pattern property per identity; naive volume thresholds punish sanctioned bulk users, so baselines plus diversity features are required. |

      ## Class definitions (normative)

      - **rule** -- deterministic logic over single events; covered means
        deployed, tested rules.
      - **hybrid** -- deterministic tier plus learned tier; covered means both
        tiers deployed with per-tier precision, recall, and latency on record.
      - **behavioral** -- deviation from a per-entity baseline; covered means
        baselines built and refreshed, anomaly scoring deployed, allowlist
        mechanism present.
      - **statistical** -- batch judgement at a pipeline stage boundary;
        covered means integrity gates wired into the pipeline.
      - **architectural** -- the weakness is design, not events; covered means
        the exploitation path has a detector and the weakness is referenced to
        a named architecture control (status: partial-by-design).
      - **not-detection-shaped** -- no security-event observable exists;
        covered means an accepted-gap record naming the owning non-detection
        control, visible in every coverage report.
  deliverable_4:
    title: 'Sigma Tag Convention for LLM Top 10 Binding'
    filename: 'sigma_tag_convention.md'
    description: |-
      The tagging convention that binds every Sigma rule in this chapter to
      the framework risk it covers, carrying the pinned edition so coverage
      queries are platform queries and framework revisions are mechanical
      remaps instead of archaeology.
    implementation_notes: |-
      Extends the Chapter 4 tag discipline (ATT&CK technique tags) with a
      second namespace. The edition segment inside the tag is deliberate
      redundancy: it makes every rule self-describing about which framework
      text its risk ID refers to, which is what keeps dashboards meaningful
      across a framework revision. The CI cross-check described in part 5
      joins matrix rows to rules on these tags.
    code: |
      <!--
      sigma_tag_convention.md
      Section 0502 -- OWASP LLM Top 10 as a Detection Framework
      20260716 | Detection Engineering: AI Security Detection (Section 0502 OWASP LLM Top 10 as Detection Framework) by Raghav Dinesh
      -->
      # Sigma Tag Convention -- Binding Rules to LLM Top 10 Risks

      ## The tag

      Every Sigma rule covering an LLM Top 10 risk carries a tag of the form:

          owasp_llm.2025.llm01

      Segments: framework namespace (`owasp_llm`), pinned edition (`2025`),
      risk identifier lowercased (`llm01` .. `llm10`). Rules covering an
      exploitation path for a partial-by-design risk tag the risk they
      partially cover (e.g. the 5.4 context-scoring rule tags
      `owasp_llm.2025.llm08` in addition to `owasp_llm.2025.llm01`).

      ## Rules

      1. One tag per covered risk; a rule may carry several risk tags, plus
         its ATT&CK technique tags per the Chapter 4 convention. Namespaces
         never mix.
      2. The edition segment always matches the matrix `framework_pin` --
         a rule tagged to an edition the matrix does not pin fails CI.
      3. Never tag a rule to an accepted-gap risk. If a rule genuinely covers
         it, the matrix row changes first (PR), then the tag ships.
      4. On a framework revision: pin the new edition in the matrix, remap
         identifiers in ONE reviewed change, leave old-edition tags on retired
         rules (history stays truthful).

      ## Example (rule excerpt)

          title: LLM system prompt canary observed in completion
          tags:
              - owasp_llm.2025.llm07
              - attack.exfiltration
          # detection logic lives in Section 5.8; this excerpt shows tagging only

      ## The queries this buys

      - 'Every rule covering LLM02' -- a tag-prefix query, answerable by the
        platform, no tribal knowledge.
      - 'Every matrix row claiming active with zero tagged rules' -- the CI
        rot check from part 5.
      - 'Coverage delta between editions' -- a join across tag edition
        segments during a framework migration.

common_mistakes:
  mistake_1:
    description: |-
      Consuming the LLM Top 10 as a compliance checklist: a one-time design
      review that walks the ten risks, records mitigations, and closes.
    why_it_happens: |-
      That is the mode most teams already use for the web Top 10, the
      framework's own text is written as risk narratives rather than detection
      specifications, and a closed review ticket feels like completion.
    consequence: |-
      Zero new detection coverage. The program can attest alignment while
      remaining unable to see a single exploitation of any of the ten risks --
      the Section 5.1 blind spot with a certificate stapled to it.
    correct_approach: |-
      Operate the framework as a coverage map: restate every risk as a
      detection hypothesis, bind it to telemetry and an owner in the matrix,
      and let the gap report grade the program continuously. Attestation is a
      byproduct of the matrix, never a substitute for it.
  mistake_2:
    description: |-
      Citing the framework from memory or without an edition pin -- rules,
      dashboards, and documents referring to risk IDs with no record of which
      edition defines them.
    why_it_happens: |-
      Risk IDs look stable and memorable, the framework text is a browser tab
      away, and pinning feels like bureaucracy while the current edition is
      the only one anyone has used.
    consequence: |-
      The framework has already renumbered entries once across editions. After
      the next revision, unpinned references become ambiguous: two teams argue
      about what a risk ID means while reading different documents, dashboards
      silently misreport, and the migration becomes archaeology.
    correct_approach: |-
      Two-sided pin, mechanically enforced: detections bind to stable attack
      classes; every citation of a risk ID -- matrix, Sigma tags, prose --
      carries the pinned edition, recorded in the framework_pin block with a
      recheck cadence. Migration then becomes one reviewed remap.
  mistake_3:
    description: |-
      Forcing every risk into a rule -- most visibly, shipping keyword rules
      for LLM09 Misinformation so the coverage dashboard shows ten green rows.
    why_it_happens: |-
      Green rows are what leadership asks to see, rules are the tool the team
      knows, and 'we do not detect this by design' feels like an admission of
      failure rather than a professional judgement.
    consequence: |-
      The forced rules fire on hedging language and legitimate uncertainty,
      flooding the queue with noise that erodes analyst trust in the genuinely
      load-bearing detections -- while covering nothing, because factuality
      was never an event property.
    correct_approach: |-
      Classify before building. The detectability class determines what
      covered means; not-detection-shaped risks get an accepted-gap record
      naming the owning non-detection control. An honest ACCEPTED_GAP row is
      evidence of a program that understands its detections; ten green rows
      are evidence of a filled-in spreadsheet.
  mistake_4:
    description: |-
      Building a coverage map with no accepted-gap state -- every row must be
      either covered or in progress, so undetectable or deprioritised risks
      simply vanish from the artifact.
    why_it_happens: |-
      The status vocabulary was copied from a project tracker, where every
      item is eventually done; nobody designed a state for 'consciously not
      doing this', so the schema cannot express it.
    consequence: |-
      Silence -- the exact failure mode the coverage map exists to prevent.
      The gap migrates from the visible artifact into undocumented tribal
      knowledge, survives team turnover as pure ignorance, and resurfaces
      during an incident as 'we thought that was covered'.
    correct_approach: |-
      Make accepted_gap a first-class status with a mandatory rationale field,
      enforced by CI, rendered in capitals by the gap report. Review the
      rationales on the same recheck cadence as the framework pin -- a gap
      accepted under last year's assumptions is a decision, not a default.
  mistake_5:
    description: |-
      Treating the matrix as a one-time mapping exercise: built during this
      chapter, admired, and never bound to the lifecycle -- no CI validation,
      no tag cross-check, no status discipline.
    why_it_happens: |-
      The mapping work feels complete when the artifact is written, the
      Chapter 3 lifecycle instincts are wired to rules rather than to
      metadata artifacts, and nothing visibly breaks when the matrix drifts.
    consequence: |-
      The matrix rots silently: statuses say active for rules that were
      retired, owners reference sections that were restructured, and within
      two quarters the artifact is confidently wrong -- worse than absent,
      because it is still being read.
    correct_approach: |-
      Bind it three ways, per part 5: statuses change only via pull request,
      CI validates the invariants on every change (identifiers resolve,
      accepted gaps carry rationales, active rows have tagged rules), and the
      Sigma tag convention makes the rule-to-matrix join checkable. The matrix
      is a detection-as-code artifact; treat it exactly like a rule.

section_summary:
  compact: |-
    The OWASP LLM Top 10 (2025 edition, pinned) becomes a detection framework
    through a mechanical conversion: each risk restated as a falsifiable
    detection hypothesis, bound to the exact telemetry families from the
    Section 5.1 inventory, classified for detectability -- rule, hybrid,
    behavioral, statistical, architectural, or not-detection-shaped -- and
    assigned to the chapter section that builds its detector, with risks that
    are not detection-shaped recorded as explicit accepted gaps rather than
    forced into noisy rules. The resulting coverage matrix is a living
    detection-as-code artifact: version-pinned against framework drift,
    validated by CI, joined to deployed rules through a Sigma tag convention
    that carries the edition, and rendered per environment by a gap report
    whose REACHABLE, BLOCKED, and ACCEPTED_GAP verdicts double as the
    telemetry onboarding work queue. Detections bind to stable attack classes;
    citations pin the edition; and the machinery transfers unchanged to the
    next framework -- which Section 5.3 demonstrates immediately with MITRE
    ATLAS.
  key_takeaways:
  - 'A risk framework improves detection only when operated as a coverage map
    with a denominator -- restated hypotheses, named telemetry, tracked
    statuses -- never when consumed as a checklist'
  - 'The ten risks collapse onto the five Section 5.1 telemetry families,
    confirming the attack surface map and the community enumeration describe
    the same territory'
  - 'The detectability class determines what covered is allowed to mean for a
    row; forcing every risk into a rule mangles the ones that are behavioral,
    statistical, architectural, or not detection-shaped'
  - 'An honest accepted-gap record -- rationale written, owning control named,
    rendered visibly in every report -- is stronger posture than a noisy rule
    pretending to cover an undetectable risk'
  - 'Detections bind to stable attack classes while every citation pins the
    framework edition, so a framework revision is one reviewed remap instead
    of an archaeology project'
  - 'The matrix is a detection-as-code artifact: statuses move by pull
    request, CI enforces its invariants, and the Sigma tag convention makes
    the claim ''this risk is covered'' a checkable platform query'

preview_section_05_03:
  title: 'ATLAS ATT&CK for ML: Mapping Adversarial ML Tactics to Detection'
  summary: |-
    Section 5.2 built the conversion machinery on the OWASP LLM Top 10;
    Section 5.3 proves the machinery is framework-agnostic by running it
    against MITRE ATLAS -- the tactic-and-technique enumeration for
    adversarial ML. ATLAS techniques get detectability ratings that turn the
    framework into an engineering backlog, its documented case studies become
    regression test scenarios for the chapter's detectors, and the ATLAS map
    joins the LLM Top 10 matrix and the Chapter 1 ATT&CK map in a single
    unified coverage view -- one platform query that spans the intrusion and
    AI surfaces alike.

