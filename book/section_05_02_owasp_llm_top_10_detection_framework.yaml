# section_05_02_owasp_llm_top_10_detection_framework.yaml

---
document_info:
  title: 'OWASP LLM Top 10 as a Detection Framework'
  chapter: 5
  section: 2
  section_code: '0502'
  author: 'Raghav Dinesh'
  github: 'https://github.com/ruwgxo/detection-engineering-at-scale'
  license: 'MIT'
  version: '1.0'
  created: '2026-07-16'
  estimated_pages: 5
  estimated_reading_time: '35-45 minutes'

section_overview:
  one_line_summary: |-
    The OWASP LLM Top 10 becomes useful to a detection program only when it is
    read as a coverage map -- each of the ten risks restated as a detection
    hypothesis with named telemetry, a detectability class, an owning detector,
    and a tracked status -- and the resulting matrix is version-pinned,
    lifecycle-managed, and honest about the risks that are not detection-shaped.
  why_this_section_exists: |-
    Section 5.1 made the LLM detection gap visible and specified the telemetry
    that closes it. What it did not provide is a way to say 'covered' with a
    straight face. A detection program needs an external, community-maintained
    enumeration of the risks it claims to cover, or its coverage claims are
    self-graded homework. For the LLM surface, that enumeration is the OWASP
    Top 10 for LLM Applications -- the same role MITRE ATT&CK plays for
    intrusion detection in Chapter 1.

    The problem is that the LLM Top 10 arrives shaped as an awareness document:
    ten narrative risk descriptions written for developers and security leaders,
    not ten detection specifications. Most teams consume it as a compliance
    checklist -- read the list, nod, attest -- which produces exactly zero new
    detection coverage. This section does the conversion work: it restates each
    risk as a detection hypothesis, classifies how detectable each one actually
    is, binds each to the telemetry families from Section 5.1 and to the section
    of this chapter that builds its detector, and packages the result as a
    living coverage matrix the platform tracks the way it tracks ATT&CK
    coverage. The honest entries matter most: a risk the program cannot detect
    and has decided not to detect is recorded as an accepted gap, because on a
    coverage map, silence is the failure mode.
  position_in_chapter: |-
    Second section of Chapter 5 and the first half of the chapter's framework
    layer. Section 5.1 established the gap and the telemetry inventory; this
    section converts the OWASP LLM Top 10 into the coverage map that makes the
    gap trackable. Section 5.3 does the same conversion for MITRE ATLAS and
    unifies the two into a single platform view. Sections 5.4 through 5.8 then
    build the detectors this section's matrix assigns to them, and Section 5.10
    consolidates the completed map. Nothing in this section builds a detector --
    it builds the contract the detectors are graded against.

learning_objectives:
  knowledge:
  - 'Explain the difference between consuming a risk framework as a compliance
    checklist and operating it as a detection coverage map'
  - 'Name the ten risks of the OWASP LLM Top 10 2025 edition and give the
    one-line detection reading of each'
  - 'Define the detectability classes -- rule, hybrid, behavioral, statistical,
    architectural, not-detection-shaped -- and classify any given risk into one
    with a defensible rationale'
  - 'Explain why LLM09 (Misinformation) is recorded as an accepted gap rather
    than forced into a detection rule, and why recording it beats omitting it'
  - 'State the restatement pattern that turns a narrative risk description into
    a testable detection hypothesis with telemetry requirements'
  - 'Explain why detections bind to attack classes while citations pin the
    framework edition, and what breaks when either half is skipped'
  - 'Describe where the agentic extension (the separate OWASP agentic-
    applications list) sits relative to this chapter''s scope'
  skills:
  - 'Build and maintain the LLM Top 10 coverage matrix as a version-pinned,
    lifecycle-managed detection-as-code artifact'
  - 'Run the coverage gap report against a declared environment and read its
    REACHABLE / BLOCKED / ACCEPTED_GAP verdicts as a work queue'
  - 'Write the detectability classification for a new or updated risk entry'
  - 'Apply the Sigma tagging convention so every rule in the chapter announces
    which risk it covers and coverage queries become platform queries'
  security_mindset:
  - 'Treat a coverage claim without a named framework entry, telemetry source,
    and tested detection behind it as marketing, not coverage'
  - 'Respect the risks that are not detection-shaped -- an honest accepted gap
    is stronger security posture than a noisy rule pretending to cover it'
  - 'Assume the framework will change under you; pin what you cite, bind what
    you build to the attack class, and schedule the recheck'

prerequisites:
- 'Section 5.1: the LLM attack surface map and the five mandatory telemetry
  families -- the matrix binds risks to exactly those families'
- 'Chapter 1, Section 1.4: ATT&CK as architecture -- this section reapplies
  that coverage-mapping discipline to a different framework'
- 'Chapter 3: detection-as-code -- the matrix is a versioned artifact under the
  same lifecycle as any rule'
- 'Chapter 4, Sections 4.5-4.6: Sigma rule anatomy, extended here with a risk-
  tagging convention'
- 'Working Python and YAML fluency for the deliverables'
- 'A copy of the current OWASP LLM Top 10 text for reference while reading --
  this section restates the risks for detection, it does not reproduce them'

prose_content:
  part_1:
    title: 'From Awareness Document to Coverage Map'
    body: |-
      Every security team that ships an LLM application has, somewhere, a slide
      that says 'aligned with the OWASP LLM Top 10'. Ask what that means
      operationally and the answer is usually a design review that walked the
      ten risks once, produced some mitigations, and closed. That is a
      legitimate use of the framework -- for application security. For a
      detection program it produces nothing, because detection coverage is not
      a property you attest to at design time; it is a property you measure
      continuously against events, and measurement needs a denominator.

      The denominator is what a good framework provides. Chapter 1 made this
      argument for MITRE ATT&CK: the framework's value to detection engineering
      is not the reading material, it is the enumeration -- a community-
      maintained, externally-versioned list of the things your program should
      be able to see, against which your actual coverage can be scored and your
      gaps made visible. The OWASP Top 10 for LLM Applications is the natural
      denominator for the LLM surface. It is the most widely adopted enumeration
      of LLM application risk, it is maintained by an active project rather than
      frozen in a paper, and its entries map cleanly onto the attack surface
      inventory Section 5.1 built.

      The conversion from awareness document to coverage map is mechanical once
      stated, and the rest of this section performs it. Each risk is restated as
      a detection hypothesis: a falsifiable claim about what observable events
      an exploitation of that risk produces. Each hypothesis names the telemetry
      families -- from the Section 5.1 inventory -- it requires. Each risk gets
      a detectability class, because the honest answer to 'can we detect this'
      differs materially across the ten. And each row gets an owner: the section
      of this chapter that builds the detector, or an explicit accepted-gap
      record when no detector is warranted. The output is the coverage matrix --
      a YAML artifact the platform tracks, the CI pipeline validates, and the
      gap report renders into a work queue.
  part_2:
    title: 'The Ten Risks, Read with Detection Eyes'
    body: |-
      The 2025 edition (v2.0) of the list -- the current edition, published by
      the OWASP GenAI Security Project and designated LLM01:2025 through
      LLM10:2025 -- is the version this chapter pins. What follows is not a
      summary of the framework text; it is the detection reading of each entry,
      which is a different document. The framework asks 'what can go wrong'.
      The detection engineer asks 'what would I see'.

      LLM01 Prompt Injection is the marquee entry and the highest-exploitation
      risk on the list: hostile instructions in the prompt channel, direct or
      indirect. Its observable is the prompt event itself, which is why Section
      5.1 made full-context prompt capture non-negotiable. LLM02 Sensitive
      Information Disclosure inverts the channel: the observable is the
      completion, scanned for content that should not leave. LLM03 Supply Chain
      and LLM04 Data and Model Poisoning are the two upstream entries; their
      observables are pipeline provenance events -- dataset ingestion,
      fine-tune jobs, registry mutations -- not user traffic, which is why they
      belong to Section 5.6 and why a program without pipeline telemetry is
      blind to both regardless of rule count. LLM05 Improper Output Handling is
      about what downstream components do with model output; its detection
      reading is rules on the consumption path -- completions flowing into
      execution or rendering sinks -- which makes completion and tool-call
      events its telemetry. LLM06 Excessive Agency is the agentic entry: a
      model empowered to act, acting beyond intent. Its observable is the tool
      call event stream, read as an action log. LLM07 System Prompt Leakage has
      the cleanest detection reading on the list: seed the system prompt with a
      canary marker and scan completions for it, plus pattern-match the
      extraction attempts on the prompt side. LLM08 Vector and Embedding
      Weaknesses is mostly an architecture problem -- the weakness lives in how
      the RAG layer is built -- but its exploitation path is indirect injection
      through retrieved content, which the Section 5.4 context-scoring detector
      covers; the matrix records that split honestly as partial-by-design.
      LLM09 Misinformation is the entry that tests the program's honesty, and
      part 3 returns to it. LLM10 Unbounded Consumption is the resource entry:
      extraction-scale querying, quota abuse, denial-of-wallet. Its observable
      is token accounting per identity, which is Section 5.7's raw material.

      Reading the list this way surfaces the pattern that drives the rest of
      the chapter: the ten risks collapse onto the five telemetry families of
      Section 5.1. No risk requires telemetry the inventory missed, and every
      family the inventory named is load-bearing for at least one risk. That
      correspondence is not luck -- it is evidence the attack surface map and
      the community's risk enumeration describe the same territory, which is
      exactly the property a denominator needs.
  part_3:
    title: 'Detectability Classes: Not Every Risk Is a Rule'
    body: |-
      The single most damaging way to operate a risk framework is to force
      every entry through the same detection mold -- usually 'write a rule per
      risk' -- because the mold fits some entries and mangles others. The
      coverage matrix therefore carries a detectability class per risk, and the
      class determines what 'covered' is allowed to mean for that row.

      Six classes are enough for this list. Rule-detectable risks have
      observables that deterministic logic captures well: a system-prompt
      canary appearing in a completion (LLM07), a registry mutation without a
      signed provenance chain (LLM03), a completion flowing into an execution
      sink (LLM05). Hybrid risks need a deterministic tier for the known and a
      learned tier for the novel: injection phrasings (LLM01) and sensitive-
      content detection (LLM02) both live here, and Sections 5.4 and 5.8 build
      exactly that two-tier shape. Behavioral risks are invisible per-event and
      visible against a baseline: excessive agency (LLM06) and unbounded
      consumption (LLM10) are properties of patterns, not of any single
      request. Statistical risks are batch judgements at pipeline boundaries:
      poisoning indicators (LLM04) are distribution-level claims about a
      dataset, not streaming detections. Architectural risks are weaknesses
      whose fix is design, not detection -- LLM08's embedding-layer weaknesses
      are not events at all, though their exploitation path is, so the matrix
      splits the row: the path is covered, the weakness is an architecture
      control, and the status says partial-by-design rather than pretending
      otherwise.

      The sixth class is the one that earns the program its credibility:
      not-detection-shaped. LLM09 Misinformation is a real risk -- a model
      confidently asserting falsehoods that downstream decisions consume -- but
      it has no security-event observable. Whether an assertion is false is not
      a property any telemetry family carries; it is an evaluation and
      grounding problem, owned by model quality processes, not by the
      detection platform. The wrong move is a keyword rule that fires on
      hedging language and drowns the queue in noise while covering nothing.
      The right move is an accepted-gap record: the risk is named, the
      rationale is written, the owning control (evaluation pipeline, grounding
      architecture) is referenced, and the coverage report says ACCEPTED_GAP
      in capital letters where everyone can see it. A program that can show an
      honest accepted gap has demonstrated it knows what its detections do. A
      program with ten green rows has demonstrated it can fill in a
      spreadsheet.
  part_4:
    title: 'From Risk to Hypothesis: The Restatement Pattern'
    body: |-
      A framework entry becomes engineerable at the moment it is restated as a
      detection hypothesis -- a falsifiable claim in the shape 'exploitation of
      this risk produces events with these properties in this telemetry
      family'. The restatement pattern has four moves, and running them against
      one entry end-to-end shows the mechanics.

      Take LLM10 Unbounded Consumption. Move one: name the exploitation
      behaviour concretely -- an identity drives model usage far outside its
      established pattern, whether for extraction-scale querying, quota fraud,
      or denial-of-wallet. Move two: name the observable -- per-request token
      accounting attributed to an identity, which is the third telemetry family
      in the Section 5.1 inventory. Move three: state the hypothesis
      falsifiably -- 'sustained consumption by one identity that exceeds its
      own baseline envelope, or the envelope of its peer group, is observable
      in token accounting events and distinguishes abuse from legitimate heavy
      use when combined with diversity features'. Move four: name what would
      falsify or bound it -- sanctioned bulk consumers will trip naive volume
      thresholds, so the hypothesis stands only with an allowlist mechanism
      and diversity features, which is precisely the design constraint Section
      5.7 inherits. The hypothesis is now something a detector can be built to,
      tested against, and graded on -- none of which was true of the narrative
      risk description.

      Two disciplines keep restatement honest. First, the hypothesis must name
      its telemetry family from the Section 5.1 inventory by its exact
      identifier, because the gap report computes reachability by set
      arithmetic on those identifiers -- prose approximations break the
      tooling. Second, the hypothesis must stay inside the risk's detection
      reading and out of the owning section's design space. The matrix row for
      LLM01 says 'tiered scoring over prompt events, owner 5.4'; it does not
      specify the regex families or the classifier architecture, because that
      is Section 5.4's job and duplicating it here is exactly the drift the
      chapter structure exists to prevent. The matrix is a contract, and good
      contracts specify the what and leave the how to the owner.
  part_5:
    title: 'The Matrix as a Living Artifact: Statuses, CI, and Sigma Tags'
    body: |-
      A coverage matrix built once is a snapshot that starts rotting the day it
      ships. The matrix earns the word 'living' through three bindings, all of
      them Chapter 3 discipline applied to a new artifact.

      The first binding is status. Every row carries one of a small closed set:
      planned (the detector is assigned but not yet shipped), active (the
      detector is deployed with passing tests), partial-by-design (part of the
      risk is covered, the remainder is explicitly an architecture control),
      accepted_gap (no detector, rationale on record), and blocked (required
      telemetry absent -- computed, not declared, by the gap report). Statuses
      change only through pull requests, which means the coverage history is
      the git history, and 'when did we start covering LLM07' is a one-command
      answer. The second binding is CI. The matrix lives in the repo beside the
      rules, and the pipeline enforces its invariants on every change: the YAML
      parses, every telemetry identifier resolves against the Section 5.1
      inventory, every owning section exists, every accepted_gap row carries a
      rationale, and -- the check that catches real rot -- every risk whose
      status says active has at least one deployed rule tagged to it. A matrix
      that claims active coverage with no tagged rule fails the build, which
      converts silent drift into a red pipeline.

      The third binding is the tag convention, and it is what makes the second
      binding checkable. Every Sigma rule this chapter ships carries a tag
      binding it to the risk it covers, in the same way Chapter 4's rules carry
      ATT&CK technique tags. The convention (deliverable 4) uses a namespaced
      tag carrying the framework, the pinned edition, and the risk identifier,
      so a platform query can answer 'show me every rule covering LLM02' and
      the CI check can answer 'does anything actually cover what the matrix
      claims'. The tag carries the edition deliberately: when the framework
      revises and an old risk identifier is renumbered or retired, edition-
      tagged rules keep their meaning and the migration becomes a mechanical,
      reviewable rename rather than an archaeology project. Coverage queries
      thereby become platform queries -- the same move Chapter 1 made for
      ATT&CK -- and the LLM surface stops being a special case anyone has to
      remember to check.
  part_6:
    title: 'Version Volatility and the Agentic Horizon'
    body: |-
      The LLM Top 10 is a fast-moving anchor -- the book's market_currency
      policy already names it -- and this section is where that policy becomes
      mechanism. The framework has already been through one major revision, the
      current edition reorganised and renumbered entries relative to the first,
      and the underlying attack landscape moves faster than any annual list.
      A detection program that hard-codes today's list into its structure will
      be describing its coverage in a dead dialect within a couple of years.

      The mechanism is a two-sided pin. Detections bind to attack classes --
      the stable identifiers of the Section 5.1 attack surface map, which
      change only when the attack landscape genuinely changes. Citations pin
      the framework edition -- the matrix's framework_pin block records the
      edition, the designation style, the date pinned, and the recheck cadence,
      and every Sigma tag carries the edition string. When the next edition
      lands, the migration is bounded and mechanical: diff the new list against
      the pinned one, remap risk identifiers to the unchanged attack classes,
      update the tags in one reviewed change, and re-verify the accepted-gap
      rationales still hold. Nothing about the detectors themselves moves,
      because they were never bound to the list -- only described by it. Skip
      either side of the pin and one of two failures follows: bind detections
      to risk IDs and a renumbering breaks every dashboard; cite the framework
      without an edition and two teams will argue about what LLM07 means while
      looking at different documents.

      The horizon item is agency. The OWASP GenAI project maintains a separate
      top-ten for agentic applications, and the boundary between the two lists
      is the boundary between this chapter and the next frontier: LLM06 covers
      excessive agency as an application risk, but multi-agent orchestration,
      inter-agent trust, and tool-ecosystem attacks are their own enumeration
      with their own detection readings. This chapter deliberately stops at the
      LLM application list. The matrix structure, the detectability classes,
      the restatement pattern, and the tag convention all transfer unchanged
      when the program is ready to onboard the agentic list -- which is the
      point of building the machinery framework-agnostically. Section 5.3 makes
      that transfer immediately, applying the identical conversion to MITRE
      ATLAS and unifying the results into one platform view.

reference_materials:
  table_1:
    title: 'The OWASP LLM Top 10 (2025 Edition), Read for Detection'
    description: |-
      The ten risks of the pinned edition with the detection engineer's
      one-line reading of each: what exploitation would make observable, and
      where. The framework text describes the risks; this table describes the
      evidence.
