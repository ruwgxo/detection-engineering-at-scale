chapter_completion_criteria:
  knowledge:
    - 'Explain the five structural reasons traditional detection rules cannot cover LLM applications'
    - 'Name the ten OWASP LLM Top 10 (2025) risks and classify each by detectability'
    - 'Describe how MITRE ATLAS techniques translate into detection hypotheses and where observability limits coverage'
    - 'Explain the layered prompt injection stack and why neither regex-only nor classifier-only survives production'
    - 'Distinguish jailbreak detection from injection detection and describe semantic-distance methods'
    - 'Describe poisoning as a supply-chain detection problem and the pipeline provenance telemetry it requires'
    - 'Explain why extraction detection lives in per-identity baselines rather than per-request rules'
    - 'Name the output-channel risks and the placement trade-off between inline redaction and async monitoring'
    - 'Describe the gateway-scale architecture: placement tiers, latency budgets, and fail policies'
  skills:
    - 'Run the telemetry gap assessment against an environment and produce the detection gap scorecard'
    - 'Build and maintain the OWASP LLM Top 10 coverage matrix as a living artifact'
    - 'Author Sigma rules over OCSF GenAI events for pattern-layer LLM detections'
    - 'Specify a classifier contract and wire a hybrid decision layer with tested thresholds'
    - 'Implement semantic-distance jailbreak scoring with a versioned pattern library'
    - 'Instrument a training or RAG pipeline with provenance telemetry and integrity checks'
    - 'Build per-identity rate and consumption baselines over gateway logs'
    - 'Deploy staged output monitoring with canary-based system prompt leakage detection'
    - 'Produce a placement decision matrix assigning every detector a tier, budget, and fail policy'
    - 'Ship the chapter rule packs and classifiers through the Chapter 3 CI/CD pipeline'
  security_mindset:
    - 'Treat missing telemetry as a hundred-percent false-negative rate, not an acceptable unknown'
    - 'Measure coverage per attack class against a versioned framework, never per rule count'
    - 'Assume adversaries enumerate static patterns; design the update pipeline as the detection'
    - 'Respect the privacy cost of prompt and output logging as a first-class design constraint'
    - 'Treat detector latency as a survival constraint: an unplaceable detection protects nothing'

