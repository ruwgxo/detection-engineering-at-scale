      - 'Placement by latency budget: what runs inline, what runs near-real-time, what runs batch'
      - 'Fail-open vs fail-closed policy per detector class'
      - 'Normalisation flow: gateway events through the Chapter 4 OCSF layer into the Chapter 2 platform'
      - 'Detection-as-code integration: shipping the chapter''s rule packs and classifiers through the Chapter 3 pipeline'
      - 'Scale considerations preview: throughput and cost engineering deferred to Chapter 9'
      - 'The assembled coverage picture: chapter detections mapped back onto the 5.2 matrix'
    key_concepts:
      - 'Latency-budgeted placement'
      - 'Fail-policy per detector'
      - 'Gateway as sensor'
      - 'Coverage closure'
    deliverables:
      - 'gateway_detection_architecture.md: reference architecture with component and data-flow diagrams'
      - 'placement_decision_matrix.yaml: detector -> tier -> latency budget -> fail policy'
      - 'gateway_reference_config.yaml: deployable configuration wiring the chapter''s detectors'
      - 'chapter5_coverage_closure_report.py: regenerates the 5.2 matrix with implemented-detection status'
    security_preview: 'An AI security detector that adds unbounded latency to the request path will be removed by the platform team before it ever catches an attack -- placement is survival'

  - section_number: 10
    title: 'Chapter 5 Summary: AI Security Detection'
    filename: 'section_05_10_chapter_summary.yaml'
    note: 'Schema B (chapter summary section) per the Books Authoring schema set'
    estimated_pages: 3
    topics:
