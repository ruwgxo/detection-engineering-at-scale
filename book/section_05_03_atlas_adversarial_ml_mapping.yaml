deliverables:
  deliverable_1:
    title: 'ATLAS Detection Hypotheses'
    filename: 'atlas_detection_hypotheses.yaml'
    description: |-
      The machine-readable technique-to-hypothesis mapping: chapter-relevant
      ATLAS technique families keyed by the stable Section 5.1 attack
      classes, each carrying its hypothesis, exact telemetry family
      identifiers, observability rating, prevalence tier, and owning section,
      under a framework_pin block whose ID policy delegates all technique IDs
      to the resolution map.
    implementation_notes: |-
      Rows deliberately carry technique names, never memorised IDs -- IDs
      live only in atlas_id_resolution.yaml, filled against the pinned
      release at atlas.mitre.org. The scope field states the artifact covers
      LLM-application-layer observable techniques, not the full matrix;
      completeness against a fast-moving framework is maintained by the
      recheck cadence, not claimed by a snapshot. Keys must match the Section
      5.1 attack-class identifiers exactly -- the crosswalk and generator
      join on them.
    code: |
      # atlas_detection_hypotheses.yaml
      # Section 0503 -- ATLAS ATT&CK for ML: Mapping Adversarial ML Tactics to Detection
      # 20260717 | Detection Engineering: AI Security Detection (Section 0503 ATLAS Adversarial ML Mapping) by Raghav Dinesh
      #
      # Chapter-relevant ATLAS technique families translated into detection
      # hypotheses. Rows key on the STABLE attack classes from the Section 5.1
      # surface map; ATLAS technique IDs are resolved separately (atlas_id_resolution
      # map) against the pinned release -- never from memory. Completeness is scoped:
      # this file covers the techniques observable at the LLM application layer,
      # not the full matrix.
      framework_pin:
        framework: 'MITRE ATLAS'
        release_consulted: 'v5.4.0 (2026-02)'
        pinned_on: '2026-07-17'
        id_policy: 'technique IDs resolve via atlas_id_resolution.yaml against the pinned release; unresolved IDs block the backlog'
        scope: 'LLM-application-layer observable techniques only; research-stage and model-internal techniques are out of platform scope by design'
      hypotheses:
        direct_prompt_injection:
          atlas_technique_name: 'LLM Prompt Injection (direct)'
          hypothesis: 'Exploitation places hostile instructions in the user turn; observable in prompt_events as scored content'
          required_telemetry: ['prompt_events']
          observability: 'observable_now'
          prevalence_tier: 'high'
          owning_section: '5.4'
        indirect_prompt_injection:
          atlas_technique_name: 'LLM Prompt Injection (indirect) / RAG poisoning family'
          hypothesis: 'Exploitation plants instructions in retrieved content; observable in prompt_events context entries with source tags'
          required_telemetry: ['prompt_events']
          observability: 'observable_now'
          prevalence_tier: 'high'
          owning_section: '5.4'
        system_prompt_discovery:
          atlas_technique_name: 'LLM system prompt extraction / meta prompt discovery'
          hypothesis: 'Exploitation elicits system prompt content; observable as canary markers in completion_events plus attempt patterns in prompt_events'
          required_telemetry: ['completion_events', 'prompt_events']
          observability: 'observable_now'
          prevalence_tier: 'high'
          owning_section: '5.8'
        model_extraction:
          atlas_technique_name: 'Extract ML model via inference API'
          hypothesis: 'Distillation-scale querying is invisible per request and observable as volume-diversity-coverage anomalies in token_accounting per identity'
          required_telemetry: ['token_accounting']
          observability: 'observable_now'
          prevalence_tier: 'medium'
          owning_section: '5.7'
        training_data_poisoning:
          atlas_technique_name: 'Poison training data'
          hypothesis: 'Tampering shifts dataset distributions or plants triggers; observable as statistical indicators at pipeline stage boundaries in pipeline_provenance'
          required_telemetry: ['pipeline_provenance']
          observability: 'needs_new_telemetry'
          prevalence_tier: 'medium'
          owning_section: '5.6'
        ml_supply_chain_compromise:
          atlas_technique_name: 'AI supply chain compromise (model / dataset / dependency)'
          hypothesis: 'A tampered artifact enters the pipeline without valid provenance; observable as verification failures and unsanctioned registry mutations in pipeline_provenance'
          required_telemetry: ['pipeline_provenance']
          observability: 'needs_new_telemetry'
          prevalence_tier: 'high'
          owning_section: '5.6'
        agent_tool_exfiltration:
          atlas_technique_name: 'Exfiltration via AI agent tool invocation'
          hypothesis: 'A hijacked model moves data out through tool calls; observable as anomalous tool_call_events read as an action log'
          required_telemetry: ['tool_call_events']
          observability: 'observable_now'
          prevalence_tier: 'medium'
          owning_section: '5.8-5.9'
        cost_harvesting_denial:
          atlas_technique_name: 'Denial of ML service / cost harvesting'
          hypothesis: 'Abuse drives consumption beyond baseline envelopes; observable in token_accounting per identity and endpoint'
          required_telemetry: ['token_accounting']
          observability: 'observable_now'
          prevalence_tier: 'medium'
          owning_section: '5.7'
  deliverable_2:
    title: 'ATLAS-OWASP Crosswalk'
    filename: 'atlas_owasp_crosswalk.yaml'
    description: |-
      The join between the two framework views, keyed on the stable Section
      5.1 attack classes: each row binds one attack class to the ATLAS
      technique names that execute it, the pinned-edition LLM Top 10 risk IDs
      that describe it, and the single owning detector -- one detector,
      several framework descriptions, zero double-counting. The coverage note
      records the seams explicitly.
    implementation_notes: |-
      The crosswalk never maps framework-to-framework directly; both sides
      join through the attack-class keys, which is what keeps a framework
      revision on either side from tearing the join. Keys are asserted equal
      to the hypotheses artifact''s keys at validation time. The coverage
      note is normative content, not commentary: absences in a crosswalk are
      recorded, not implied, per the part 4 rule.
    code: |
      # atlas_owasp_crosswalk.yaml
      # Section 0503 -- ATLAS ATT&CK for ML: Mapping Adversarial ML Tactics to Detection
      # 20260717 | Detection Engineering: AI Security Detection (Section 0503 ATLAS Adversarial ML Mapping) by Raghav Dinesh
      #
      # Crosswalk joining the two framework views on the STABLE attack-class keys
      # from the Section 5.1 surface map. ATLAS rows cite the pinned release
      # (v5.4.0, 2026-02); OWASP rows cite the pinned 2025 (v2.0) edition from the
      # Section 5.2 matrix. One attack class may serve several entries in either
      # framework -- the crosswalk is many-to-many by design.
      crosswalk:
        direct_prompt_injection:
          atlas: ['LLM Prompt Injection (direct)']
          owasp_llm_2025: ['LLM01']
          detector: '5.4'
        indirect_prompt_injection:
          atlas: ['LLM Prompt Injection (indirect)', 'RAG poisoning family']
          owasp_llm_2025: ['LLM01', 'LLM08']
          detector: '5.4'
        system_prompt_discovery:
          atlas: ['LLM system prompt extraction / meta prompt discovery']
          owasp_llm_2025: ['LLM07']
          detector: '5.8'
        model_extraction:
          atlas: ['Extract ML model via inference API']
          owasp_llm_2025: ['LLM10']
          detector: '5.7'
        training_data_poisoning:
          atlas: ['Poison training data']
          owasp_llm_2025: ['LLM04']
          detector: '5.6'
        ml_supply_chain_compromise:
          atlas: ['AI supply chain compromise (model / dataset / dependency)']
          owasp_llm_2025: ['LLM03']
          detector: '5.6'
        agent_tool_exfiltration:
          atlas: ['Exfiltration via AI agent tool invocation']
          owasp_llm_2025: ['LLM06', 'LLM05']
          detector: '5.8-5.9'
        cost_harvesting_denial:
          atlas: ['Denial of ML service / cost harvesting']
          owasp_llm_2025: ['LLM10']
          detector: '5.7'
      coverage_note: >
        OWASP LLM02 (Sensitive Information Disclosure) and LLM09 (Misinformation)
        have no ATLAS technique row here: LLM02 is an output-content risk detected
        in 5.8 regardless of adversary TTP, and LLM09 is the accepted gap recorded
        in the 5.2 matrix. Absences in a crosswalk are recorded, not implied.
  deliverable_3:
    title: 'Hypothesis Backlog Generator'
    filename: 'hypothesis_backlog_generator.py'
    description: |-
      Emits the prioritised detection backlog from the hypothesis mapping.
      Priority per row combines the observability weight, a bonus when the
      environment already emits every required telemetry family, and the
      prevalence tier; telemetry gaps are surfaced as explicit flags. Rows
      whose technique ID is unresolved against the pinned release are emitted
      with [ID-UNRESOLVED] and the run exits non-zero -- the do-not-cite-
      from-memory rule, enforced in code.
    implementation_notes: |-
      Single quotes throughout per book convention. Uses PyYAML (the book''s
      standard format library, in the repo''s requirements). The unresolved-ID
      block is deliberately a hard failure rather than a warning: a backlog
      is a shipping artifact, and an unverified citation in a shipping
      artifact is the exact failure the mechanism exists to prevent. The
      TELEMETRY-GAP flag intentionally rides alongside the priority score
      rather than zeroing it -- a high-value hypothesis blocked on telemetry
      is an onboarding work item, not a low priority.
    code: |
      #!/usr/bin/env python3
      # hypothesis_backlog_generator.py
      # Section 0503 -- ATLAS ATT&CK for ML: Mapping Adversarial ML Tactics to Detection
      # 20260717 | Detection Engineering: AI Security Detection (Section 0503 ATLAS Adversarial ML Mapping) by Raghav Dinesh
      # Single quotes throughout per book convention
      '''Emit a prioritised detection backlog from the ATLAS hypothesis mapping.

      Usage:
          hypothesis_backlog_generator.py hypotheses.yaml resolution.yaml environment.yaml

      Priority per hypothesis = observability weight + telemetry availability bonus
      + prevalence weight. Rows whose technique ID is not resolved against the
      pinned ATLAS release are emitted with an [ID-UNRESOLVED] flag and the run
      exits non-zero -- the do-not-cite-from-memory rule, enforced in code.
      '''
      from __future__ import annotations

      import sys

      import yaml

      OBSERVABILITY_WEIGHT = {'observable_now': 3, 'needs_new_telemetry': 1, 'not_observable': 0}
      PREVALENCE_WEIGHT = {'high': 2, 'medium': 1, 'low': 0}
      TELEMETRY_BONUS = 2


      def score(h: dict, available: set[str]) -> int:
          s = OBSERVABILITY_WEIGHT.get(h['observability'], 0)
          s += PREVALENCE_WEIGHT.get(h['prevalence_tier'], 0)
          if set(h['required_telemetry']) <= available:
              s += TELEMETRY_BONUS
          return s


      def main() -> int:
          if len(sys.argv) != 4:
              print('usage: hypothesis_backlog_generator.py hypotheses.yaml resolution.yaml environment.yaml')
              return 2
          with open(sys.argv[1]) as fh:
              hyp = yaml.safe_load(fh)
          with open(sys.argv[2]) as fh:
              res = yaml.safe_load(fh)
          with open(sys.argv[3]) as fh:
              env = yaml.safe_load(fh)

          resolved = res.get('resolved', {}) or {}
          available = set(env.get('available_telemetry', []))
          pin = hyp['framework_pin']
          print('framework: ' + pin['framework'] + ' -- ' + pin['release_consulted']
                + ' (pinned ' + pin['pinned_on'] + ')')
          print('environment: ' + env.get('name', 'unnamed'))
          print('-' * 78)

          rows = []
          unresolved = 0
          for key, h in hyp['hypotheses'].items():
              atlas_id = resolved.get(key)
              if atlas_id is None:
                  atlas_id = '[ID-UNRESOLVED]'
                  unresolved += 1
              rows.append((score(h, available), key, atlas_id, h))

          rows.sort(key=lambda r: (-r[0], r[1]))
          for s, key, atlas_id, h in rows:
              gap = '' if set(h['required_telemetry']) <= available else ' TELEMETRY-GAP'
              print('P' + str(s) + '  ' + key.ljust(28) + atlas_id.ljust(17)
                    + 'owner ' + str(h['owning_section']).ljust(9) + h['observability'] + gap)
          print('-' * 78)
          print('backlog: ' + str(len(rows)) + ' hypotheses, ' + str(unresolved) + ' unresolved IDs')
          if unresolved:
              print('BLOCKED: resolve every technique ID against the pinned release at')
              print('atlas.mitre.org before this backlog ships -- IDs are never cited from memory.')
              return 1
          return 0


      if __name__ == '__main__':
          sys.exit(main())
  deliverable_4:
    title: 'ATLAS Case-Study Test Scenarios'
    filename: 'atlas_test_scenarios.md'
    description: |-
      The case-study-derived regression scenarios for the Chapter 3 unit-test
      harness: each archetype specifies the event chain a real incident class
      implies, the detectors that must fire, the tiers that may legitimately
      stay silent, and the instantiation step that binds the scenario to
      specific case-study IDs from the pinned release.
    implementation_notes: |-
      Archetypes are shipped instead of named case studies for the same
      reason the hypotheses ship names instead of IDs: the corpus grows
      release to release, and the instantiation step -- pull the current
      case-study list from the pinned release, bind matching studies to each
      archetype -- keeps the test suite current without ever reproducing the
      catalogue from memory. The must-fire and may-stay-silent split is the
      part rule authors skip and regret: a scenario that only asserts firings
      cannot catch an over-firing detector.
    code: |
      <!--
      atlas_test_scenarios.md
      Section 0503 -- ATLAS ATT&CK for ML: Mapping Adversarial ML Tactics to Detection
      20260717 | Detection Engineering: AI Security Detection (Section 0503 ATLAS Adversarial ML Mapping) by Raghav Dinesh
      -->
      # ATLAS Case-Study Test Scenarios

      Incident-grounded regression scenarios for the chapter's detectors.
      Instantiate against the pinned ATLAS release (v5.4.0, 2026-02): pull
      the current case-study list at atlas.mitre.org, bind matching studies
      to each archetype below by their AML.CS identifiers, and record the
      binding in the test manifest. Case-study IDs are never reproduced here
      from memory.

      ## Scenario 1 -- Indirect injection to tool exfiltration

      - **Chain:** poisoned retrieved content enters the context window
        (tagged source) -> model complies -> tool calls carry data outward.
      - **Must fire:** context-source scoring (5.4); action-envelope
        deviation on tool_call_events (5.8-5.9).
      - **May stay silent:** the direct-injection regex tier -- the user turn
        is clean by construction in this scenario.
      - **Corpus events:** one prompt_event with a hostile rag_document
        context entry; three tool_call_events, one exfiltration-bearing.

      ## Scenario 2 -- Supply chain to backdoored behaviour

      - **Chain:** unverified artifact enters the pipeline -> unsanctioned
        registry mutation -> deployed model drifts on behavioural canaries.
      - **Must fire:** provenance verification rule; registry mutation rule;
        canary drift alert (all 5.6).
      - **May stay silent:** every traffic-side detector -- the attack never
        touches user traffic, which is the scenario's teaching point.
      - **Corpus events:** pipeline_provenance sequence (ingest without
        chain, mutation outside sanctioned path), then canary probe results.

      ## Scenario 3 -- Extraction campaign against the inference API

      - **Chain:** sustained high-volume, high-diversity querying under one
        identity across days.
      - **Must fire:** volume-diversity-coverage baseline scoring (5.7).
      - **May stay silent:** per-request content tiers -- every individual
        prompt is benign, which is the scenario's teaching point.
      - **Corpus events:** token_accounting series exceeding the identity's
        baseline envelope on volume and diversity simultaneously.

      ## Scenario 4 -- System prompt theft

      - **Chain:** extraction-attempt prompts -> canary marker appears in a
        completion.
      - **Must fire:** attempt patterns on the prompt side (5.4); canary
        scan on the output side (5.8).
      - **May stay silent:** consumption baselines -- volume is nominal.
      - **Corpus events:** prompt_events with extraction phrasings; one
        completion_event containing the seeded canary marker.

      ## Scenario 5 -- Consumption abuse / denial of wallet

      - **Chain:** per-identity consumption exceeds the baseline envelope at
        a sustained rate without extraction-style diversity.
      - **Must fire:** consumption baseline scoring with the allowlist
        mechanism consulted (5.7).
      - **May stay silent:** extraction scoring's diversity dimension --
        distinguishing the two abuse shapes is the scenario's teaching point.
      - **Corpus events:** token_accounting series high on volume, flat on
        diversity; identity absent from the sanctioned-bulk allowlist.

      ## Harness contract

      Each scenario compiles to a Chapter 3 unit-test case: corpus events in,
      expected firings and expected silences asserted. A detector change that
      breaks a must-fire is a regression; one that breaks a may-stay-silent
      is an over-firing regression -- both fail CI.

common_mistakes:
  mistake_1:
    description: |-
      Importing the full ATLAS matrix as a coverage obligation -- every
      technique a dashboard row, every row a detection work item, no
      observability audit in between.
    why_it_happens: |-
      That is exactly how ATT&CK onboarding works in mature programs, ATLAS
      looks structurally identical, and a bigger mapped matrix reads as
      diligence in a coverage review.
    consequence: |-
      Coverage claims for attacks the platform physically cannot see:
      staging techniques that execute on adversary infrastructure get rules
      that fire on nothing, dashboards report reach that does not exist, and
      the genuinely observable gaps hide behind the noise of impossible
      obligations.
    correct_approach: |-
      Audit observability first, per part 4: rate every technique
      observable_now, needs_new_telemetry, or not_observable; claim coverage
      only in the first class, convert the second into telemetry onboarding
      work, and record the third with downstream pointers instead of rules.
  mistake_2:
    description: |-
      Citing ATLAS technique IDs, counts, or inventories from memory --
      hard-coding AML.T identifiers into rules, prose, or dashboards without
      verifying against the pinned release.
    why_it_happens: |-
      IDs look stable because ATT&CK''s are; the matrix is a browser tab
      away, and resolution feels like ceremony when the author is confident
      they remember the entry.
    consequence: |-
      ATLAS is in rapid expansion, and whatever an author or a model
      remembers describes a superseded release. Stale IDs bind rules to
      renamed or renumbered techniques, dashboards misreport silently, and
      the errors are undetectable by inspection because the citations look
      authoritative.
    correct_approach: |-
      Enforce the discipline in code, per part 6: names in the hypotheses
      artifact, IDs only in the resolution map filled against the pinned
      release, and a generator that emits [ID-UNRESOLVED] and exits non-zero
      rather than shipping an unverified citation.
  mistake_3:
    description: |-
      Skipping the observability audit''s honest exclusions in the other
      direction -- quietly deleting not-observable techniques from the map
      because they cannot be covered.
    why_it_happens: |-
      A map with only coverable rows is tidier, review conversations about
      permanent gaps are uncomfortable, and deletion feels equivalent to the
      accepted-gap discipline of Section 5.2.
    consequence: |-
      Real intelligence is lost: not-observable staging techniques predict
      which observable techniques follow when the staged attack executes.
      Deleting them severs the pointer, so the program loses the early-
      warning framing that makes the observable detections make sense as a
      set.
    correct_approach: |-
      Record not-observable techniques with downstream pointers -- the
      observable family where the attack surfaces -- per part 4. Awareness
      is retained everywhere; coverage is claimed only where physics allows.
  mistake_4:
    description: |-
      Treating ATLAS case studies as background reading rather than as the
      detector regression corpus.
    why_it_happens: |-
      Case studies read like incident journalism, the test suite already has
      synthetic samples, and converting narrative incidents into event
      sequences is unglamorous work with no dashboard payoff.
    consequence: |-
      The test suite asserts the detectors catch the attacks the rule
      authors imagined, not the attacks that have actually happened -- and
      the difference is precisely the incidents the community documented.
      Detectors pass CI while failing the historical record.
    correct_approach: |-
      Compile case-study archetypes into harness scenarios per deliverable
      4: event chains in, must-fire and may-stay-silent assertions out,
      instantiated against the pinned release''s corpus so new case studies
      become new regression floor.
  mistake_5:
    description: |-
      Running the ATLAS map and the OWASP matrix as parallel coverage
      systems -- two artifacts, two dashboards, no crosswalk, mapped
      framework-to-framework where they are joined at all.
    why_it_happens: |-
      Each framework arrives with its own community, its own review
      meetings, and its own tooling; direct framework-to-framework mapping
      is the obvious join and nobody owns the seam between them.
    consequence: |-
      Overlapping entries are double-counted as independent coverage,
      genuine seams -- risks one framework describes and the other does not
      -- disappear between the dashboards, and a revision on either side
      tears every framework-to-framework link that was hand-maintained.
    correct_approach: |-
      Join both views on the stable attack-class keys per part 5: one
      underlying map, two framework renderings, seams recorded explicitly in
      the crosswalk''s coverage note, and framework revisions absorbed at
      the framework layer without touching the join.

section_summary:
  compact: |-
    MITRE ATLAS supplies the adversary-TTP view of the AI surface --
    ATT&CK-shaped tactics and techniques grounded in documented incidents,
    with two AI-specific tactics (AI Model Access, AI Attack Staging) and a
    fast-growing technique inventory -- and this section runs the Section 5.2
    conversion machinery against it with the one discipline a TTP framework
    adds: the observability audit. Chapter-relevant techniques become
    hypotheses bound to exact telemetry families and rated observable_now,
    needs_new_telemetry, or not_observable, with coverage claimed only where
    the platform''s telemetry can physically witness the behaviour and
    not-observable staging techniques retained as awareness with downstream
    pointers. The crosswalk joins the ATLAS and OWASP views on the stable
    Section 5.1 attack-class keys -- one map, two renderings, seams recorded
    -- while case-study archetypes compile into must-fire and may-stay-silent
    regression scenarios for the Chapter 3 harness. Against ATLAS''s tempo,
    the citation policy of 5.2 becomes mechanism: a pinned release, a
    resolution map filled at source, and a backlog generator that exits
    non-zero on any technique ID cited from memory. The framework layer is
    complete; the chapter turns to building its first detector.
  key_takeaways:
  - 'ATLAS gives the AI surface the adversary-behaviour enumeration that
    detections actually fire on, and the Chapter 1 coverage discipline
    transfers to it unchanged -- but only alongside the observability audit
    the ATT&CK analogy does not require'
  - 'Three breaks in the analogy drive the section: adversary-side
    execution demands observability ratings, the observation perimeter moves
    to the gateway and pipeline, and the framework''s tempo turns citation
    policy into enforced mechanism'
  - 'Coverage is claimed only for observable_now techniques;
    needs_new_telemetry rows are onboarding work surfaced as TELEMETRY-GAP
    flags, and not_observable techniques are retained as awareness with
    downstream pointers, never deleted and never given rules'
  - 'The crosswalk joins ATLAS and OWASP on stable attack-class keys rather
    than framework-to-framework -- one underlying map, two renderings, zero
    double-counting, seams recorded explicitly'
  - 'Case studies are the regression corpus: incident-grounded scenarios
    with must-fire and may-stay-silent assertions set the floor synthetic
    samples cannot'
  - 'Technique IDs live only in a resolution map filled against the pinned
    release, and the backlog generator refuses to ship an unresolved ID --
    do-not-cite-from-memory as a failing build, not a good intention'

preview_section_05_04:
  title: 'Detecting Prompt Injection: Regex, Classifier, and Hybrid Approaches'
  summary: |-
    The framework layer is complete: the maps name prompt injection as the
    highest-prevalence, observable-now hypothesis on the backlog, owned by
    Section 5.4 -- so Section 5.4 builds it. The chapter''s first full
    detector takes shape as a three-tier pipeline: a versioned regex pattern
    library prefiltering known technique families, a classifier scoring the
    phrasings regex cannot express, and hybrid escalation logic sequencing
    the two -- with indirect injection handled by scoring every tagged
    context source, and every tier measured for precision, recall, and
    latency against a labelled corpus before Section 5.9 decides what earns
    a place in the request path.

