# section_05_03_atlas_adversarial_ml_mapping.yaml

---
document_info:
  title: 'ATLAS ATT&CK for ML: Mapping Adversarial ML Tactics to Detection'
  chapter: 5
  section: 3
  section_code: '0503'
  author: 'Raghav Dinesh'
  github: 'https://github.com/ruwgxo/detection-engineering-at-scale'
  license: 'MIT'
  version: '1.0'
  created: '2026-07-17'
  estimated_pages: 4
  estimated_reading_time: '30-40 minutes'

section_overview:
  one_line_summary: |-
    MITRE ATLAS gives the AI surface what ATT&CK gives intrusions -- an
    adversary-TTP enumeration grounded in real incidents -- and this section
    runs the Section 5.2 conversion machinery against it: techniques become
    detection hypotheses scoped by an observability audit, case studies become
    a regression test corpus, a crosswalk joins the ATLAS view to the LLM Top
    10 matrix on stable attack-class keys, and the do-not-cite-from-memory
    rule for a fast-moving framework is enforced in code rather than in
    good intentions.
  why_this_section_exists: |-
    The Section 5.2 matrix answers 'which risks does the program cover', but a
    risk list is the defender's taxonomy. Adversaries do not work through risk
    lists; they execute tactics and techniques, and the enumeration that
    catalogues those -- observed in real incidents, structured the way
    Chapter 1 taught the reader to think -- is MITRE ATLAS. A detection
    program that maps only to OWASP can say what it covers; a program that
    also maps to ATLAS can say what it would catch, because ATLAS entries
    describe adversary behaviour, which is the thing detections actually fire
    on.

    ATLAS needs its own section rather than a paragraph in 5.2 for two
    reasons. First, a TTP framework demands a discipline a risk list does
    not: the observability audit. ATLAS catalogues the full adversarial ML
    lifecycle, and a substantial share of its techniques -- surrogate model
    training, offline adversarial example crafting, research-stage staging
    work -- happen on infrastructure the defender does not operate and
    therefore produce no events any platform telemetry can carry. Importing
    the matrix as a coverage obligation without that audit manufactures
    coverage claims for attacks the platform physically cannot see, which is
    the precise failure mode Section 5.1 exists to prevent. Second, ATLAS
    moves fast -- major releases have added double-digit technique counts
    within single quarters -- so the citation discipline that was policy in
    5.2 becomes mechanism here: technique IDs resolve against the pinned
    release through a resolution map, and the backlog generator refuses to
    ship a backlog containing an ID cited from memory.
  position_in_chapter: |-
    Third section of Chapter 5 and the close of the chapter's framework
    layer. Section 5.1 built the attack surface map and telemetry inventory;
    Section 5.2 converted the OWASP LLM Top 10 into a coverage matrix; this
    section applies the identical conversion to MITRE ATLAS, proves the
    machinery is framework-agnostic, and joins both views on the stable
    attack-class keys so the platform holds one unified coverage picture.
    From here the chapter builds: Sections 5.4 through 5.8 implement the
    detectors the unified map assigns, using the case-study-derived scenarios
    this section packages as their regression tests, and Section 5.10
    consolidates the completed map.

learning_objectives:
  knowledge:
  - 'Describe the structure of MITRE ATLAS -- tactics, techniques,
    sub-techniques, mitigations, and case studies -- and its lineage from
    ATT&CK'
  - 'Name the two AI-specific tactics that distinguish ATLAS from ATT&CK and
    explain what each covers'
  - 'Explain where the ATT&CK analogy holds for detection engineering and the
    three places it breaks'
  - 'Define the observability audit and the three observability ratings, and
    explain why a TTP framework demands one where a risk list does not'
  - 'Explain why ATLAS technique counts and IDs are treated as volatile and
    what the two-sided pin from Section 5.2 looks like when applied here'
  - 'Describe how ATLAS case studies differ from technique entries and why
    incident-grounded case studies make better regression tests than
    synthetic samples'
  - 'State how the crosswalk joins ATLAS and OWASP views without double-
    counting coverage or hiding seams'
  skills:
  - 'Translate an ATLAS technique into a detection hypothesis bound to the
    Section 5.1 telemetry families, per the restatement pattern'
  - 'Assign observability ratings to technique families and defend the
    not-observable exclusions in review'
  - 'Maintain the ID resolution map against the pinned release and read the
    generator''s [ID-UNRESOLVED] block as the citation-discipline gate it is'
  - 'Generate and read the prioritised detection backlog: priority scores,
    telemetry gaps, and owner assignments'
  - 'Derive rule regression test scenarios from ATLAS case studies'
  security_mindset:
  - 'Distrust any coverage claim over a technique the platform''s telemetry
    cannot physically witness -- audit observability before claiming reach'
  - 'Treat framework volatility as an engineering input: pin what you cite,
    verify at source, and make unresolved citations fail loudly'
  - 'Prefer incident-grounded test scenarios over invented ones; the attacks
    that happened are the minimum bar for what the detectors must catch'

prerequisites:
- 'Section 5.1: the attack surface map whose stable keys this section''s
  artifacts join on, and the five telemetry families'
- 'Section 5.2: the coverage matrix, the restatement pattern, the
  detectability classes, and the two-sided pin -- all reapplied here'
- 'Chapter 1, Section 1.4: ATT&CK as architecture -- the tactic-and-technique
  mental model ATLAS inherits'
- 'Chapter 3: detection-as-code lifecycle and the unit-test harness the test
  scenarios feed'
- 'Working Python and YAML fluency for the deliverables'
- 'The live ATLAS matrix at atlas.mitre.org open while working -- this
  section deliberately ships technique names and a resolution workflow, not
  memorised IDs'

prose_content:
  part_1:
    title: 'ATLAS: The Adversary View of the AI Surface'
    body: |-
      MITRE ATLAS -- the Adversarial Threat Landscape for Artificial-
      Intelligence Systems -- is the ATT&CK-shaped enumeration for attacks on
      AI and ML systems: a living knowledge base of adversary tactics and
      techniques, grounded in documented real-world incidents, maintained by
      MITRE with community contribution. It grew out of the joint
      MITRE-Microsoft adversarial ML threat matrix work and deliberately
      inherits ATT&CK's structural conventions, which is a gift to this book's
      reader: the tactic-and-technique mental model built in Chapter 1
      transfers directly, and so does the coverage-mapping discipline built on
      top of it.

      The structure has five elements a detection engineer uses differently.
      Tactics are the adversary's objectives, laid out along an attack
      lifecycle from reconnaissance through impact; most are inherited or
      adapted from ATT&CK, and two are AI-specific and carry most of the
      framework's identity. AI Model Access covers the adversary's routes to
      the model itself -- inference APIs, the surrounding application, model
      artifacts. AI Attack Staging covers preparation aimed at the model:
      crafting adversarial inputs, training surrogate models, poisoning data,
      planting backdoors. Techniques are the concrete methods under each
      tactic -- the unit this section translates into hypotheses -- with
      sub-techniques refining them. Mitigations are the control-side pairing.
      And case studies are the element ATT&CK readers underuse: documented
      real-world incidents, each mapped to the tactics and techniques it
      exercised, which makes them ready-made attack chains for testing
      detectors rather than reading material. As of the v5.x releases the
      matrix spans roughly sixteen tactics and eighty-plus techniques with
      dozens of case studies -- figures quoted here deliberately as
      approximations, for reasons part 6 makes structural.
  part_2:
    title: 'Where the ATT&CK Analogy Holds, and the Three Places It Breaks'
    body: |-
      The analogy holds where it matters most: ATLAS entries describe
      adversary behaviour, behaviour produces observables, and observables are
      what detections fire on. The Chapter 1 coverage-map discipline --
      enumerate, map to telemetry, score coverage, make gaps visible --
      applies without modification, and part 3 applies it. But three breaks in
      the analogy change how the mapping work proceeds, and each one has
      operational consequences.

      The first break is the defender's observation footprint. ATT&CK
      techniques overwhelmingly execute on infrastructure the defender
      operates -- their hosts, their network, their identity plane -- so the
      question is usually which telemetry sees a technique, not whether any
      can. ATLAS covers a lifecycle in which large phases run on the
      adversary's own infrastructure: training a surrogate model, crafting
      evasion inputs offline, staging poisoned data before it ever touches the
      victim pipeline. Those techniques produce no events in any telemetry the
      defender can deploy, which is why part 4's observability audit is
      mandatory here and merely implicit in Chapter 1. The second break is
      where the perimeter of observation sits. For ATT&CK the interesting
      boundary is the defender's network edge and host boundary; for ATLAS it
      is the model interface -- the gateway of Section 5.1 -- plus the
      training pipeline, and a program whose telemetry stops at traditional
      boundaries sees almost none of the matrix. The third break is tempo.
      ATT&CK is mature and its technique inventory moves slowly; ATLAS is in
      its rapid-expansion phase, with recent releases adding double-digit
      technique counts in single quarters as agentic and generative attack
      classes get catalogued. A mapping discipline calibrated to ATT&CK's
      pace -- annual review, IDs cited casually -- silently breaks against
      ATLAS's, which is why part 6 turns citation policy into enforced
      mechanism.
  part_3:
    title: 'From Technique to Hypothesis: The Same Pattern, the Adversary''s Direction'
    body: |-
      The restatement pattern from Section 5.2 applies to ATLAS techniques
      unchanged in mechanics and reversed in direction. A risk entry describes
      what can go wrong for the defender; a technique entry describes what the
      adversary does. The translation question is correspondingly sharper:
      not 'what would we see if this risk materialised' but 'what does this
      behaviour emit, and into which telemetry family'.

      One worked translation shows the shape, using the technique family for
      exfiltration through agent tool invocation -- a hijacked model moving
      data outward through the tools it is empowered to call. Move one, name
      the behaviour: the adversary, having gained instruction-level influence
      over the model, drives tool calls whose arguments or destinations carry
      data out. Move two, name the observable: tool call events -- function,
      arguments, results -- captured at the gateway or orchestrator as the
      action log Section 5.1 specified. Move three, state the hypothesis
      falsifiably: exfiltration-bearing tool calls deviate from the
      application's established action envelope in destination, argument
      shape, or sequence, and are distinguishable from sanctioned calls when
      the envelope is baselined per application and identity. Move four,
      bound it: applications with legitimately broad tool surfaces will
      stretch any envelope, so the hypothesis holds only with per-application
      baselines -- a constraint Sections 5.8 and 5.9 inherit. The output
      lands as a row in the hypotheses artifact: stable attack-class key from
      the Section 5.1 map, technique name, hypothesis, telemetry families by
      exact identifier, observability rating, prevalence tier, owning
      section.

      The artifact deliberately covers the chapter-relevant technique
      families rather than the full matrix, and says so in its scope field.
      Completeness against a fast-moving framework is a property the
      recheck cadence maintains, not a property a snapshot can claim -- and
      an artifact that silently implies full coverage of an eighty-plus
      technique matrix would be committing mistake one of this section's
      list.
  part_4:
    title: 'The Observability Audit: Coverage Claims Need Physics'
    body: |-
      Every hypothesis row carries an observability rating, and the rating is
      the section's load-bearing discipline. Three values are enough.
      Observable-now means the behaviour emits events into a telemetry family
      the Section 5.1 inventory already specifies -- prompt injection into
      prompt events, extraction-scale querying into token accounting, tool
      exfiltration into tool call events. Needs-new-telemetry means the
      behaviour is observable in principle but only through a family the
      program may not have onboarded -- the pipeline provenance events that
      poisoning and supply chain techniques require -- so the rating doubles
      as an onboarding work item, and the backlog generator surfaces it as a
      TELEMETRY-GAP flag rather than hiding it inside a priority score.
      Not-observable means the technique executes outside the defender's
      observation footprint entirely: the adversary's surrogate training runs,
      their offline staging work, their research infrastructure. No telemetry
      investment changes that physics.

      The not-observable class is where TTP mapping goes wrong most often,
      in both directions. The first wrong move is importing those techniques
      as coverage obligations anyway -- rows on a dashboard, rules that fire
      on nothing -- which manufactures exactly the false-confidence the
      security preview of this section warns about: coverage claims for
      attacks the platform physically cannot see. The second wrong move is
      quietly dropping them, which loses real information. A not-observable
      staging technique is still intelligence: it tells the defender which
      observable techniques must follow if the staged attack is ever
      executed. Offline adversarial example crafting is invisible; the
      crafted inputs arriving at the inference API are prompt events. The
      audit therefore records not-observable techniques with a downstream
      pointer -- the observable technique family where the attack surfaces --
      rather than deleting them. Coverage is claimed only where physics
      allows; awareness is retained everywhere.
  part_5:
    title: 'The Crosswalk and the Test Corpus: Joining Views, Grounding Tests'
    body: |-
      Two frameworks now describe the same territory -- OWASP by risk, ATLAS
      by adversary behaviour -- and the worst available move is running them
      as parallel coverage systems, each with its own dashboard, double-
      counting the overlaps and hiding the seams. The crosswalk artifact
      prevents that by refusing to map framework-to-framework at all. Both
      views join on the stable attack-class keys of the Section 5.1 surface
      map: each crosswalk row binds one attack class to the ATLAS technique
      names that execute it, the LLM Top 10 risk IDs that describe it, and
      the single owning detector section. One detector, several framework
      descriptions, zero double-counting -- and the platform can now answer
      'show coverage by OWASP risk' and 'show coverage by ATLAS technique' as
      two renderings of one underlying map. The seams are recorded rather
      than implied: the crosswalk's coverage note states explicitly which
      OWASP risks have no ATLAS row and why, because part 4's rule applies to
      crosswalks too -- absences are information.

      The case studies then do for testing what the techniques did for
      hypotheses. Each documented ATLAS case study is a real incident mapped
      to the techniques it exercised, which makes it a ready-made attack
      chain: a sequence of behaviours, several of which land in this
      chapter's detector scope. The test scenario artifact converts
      chapter-relevant case-study archetypes -- an indirect injection
      planted in retrieved content driving tool-call exfiltration, a
      poisoned artifact entering the pipeline through the supply chain, an
      extraction campaign against an inference API -- into regression
      scenarios for the Chapter 3 unit-test harness: the event sequence the
      scenario implies, the detectors that must fire, the tiers that may
      legitimately stay silent. Incident-grounded scenarios set the floor
      synthetic samples cannot: whatever else the detectors catch, they must
      catch the attacks that have already happened.
  part_6:
    title: 'Do-Not-Cite-From-Memory as Mechanism'
    body: |-
      Section 5.2 established the two-sided pin as policy: detections bind to
      stable attack classes, citations pin the framework edition. ATLAS's
      tempo -- an actively expanding matrix whose technique counts and
      identifiers shift release to release -- is what turns that policy into
      enforced mechanism, because against a framework this fast, memory is
      not merely unreliable but systematically stale: whatever inventory an
      author or a model remembers describes a release that has since been
      superseded.

      The mechanism has three parts. The hypotheses artifact carries a
      framework_pin block recording the release consulted, the pin date, and
      the ID policy -- and its rows deliberately carry technique names, not
      memorised IDs. The resolution map is the only place technique IDs
      live, and it is filled by a human with the pinned release open at
      atlas.mitre.org, one verified entry at a time. And the backlog
      generator enforces the join: any hypothesis row without a resolved ID
      is emitted with an [ID-UNRESOLVED] flag and the run exits non-zero, so
      an unverified citation cannot ship a backlog any more than a failing
      test can ship a rule. The same discipline governs this book's own
      prose, which is why part 1 quoted the matrix's size as approximations
      and why no technique ID appears in this section that was not verified
      against current sources at writing time.

      The recheck cadence completes the loop. On the book's market_currency
      schedule -- quarterly, and before publication -- the pin is re-verified:
      the current release is diffed against the pinned one, renamed or
      renumbered techniques are remapped in the resolution map in one
      reviewed change, and newly catalogued techniques relevant to the
      chapter's scope enter the hypotheses artifact through the same
      restatement pattern. The stable attack-class keys mean none of this
      touches the detectors; the framework layer absorbs the change, which
      is precisely what a framework layer is for. With both maps built and
      joined, the framework work of Chapter 5 is complete, and the chapter
      turns to what the maps have been pointing at all along: Section 5.4
      builds the first detector.

